<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Cyber-Auto: Neon Velocity</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }
    body {
      overflow: hidden;
      background: #050716;
      font-family: 'Arial Black', Impact, 'Courier New', sans-serif;
      color: #fff;
    }
    #canvas-container {
      width: 100vw;
      height: 100vh;
      display: block;
    }

    /* ====================================================
       PORTRAIT-OPTIMIZED SUBWAY SURFERS HUD (COMPACT TOP)
       ==================================================== */
    #hud {
      position: absolute;
      top: max(10px, env(safe-area-inset-top));
      left: 10px;
      right: 10px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 8px;
      pointer-events: none;
      z-index: 15;
    }
    #hud.hidden { display: none; }

    .cyber-hud-box {
      background: linear-gradient(180deg, rgba(12, 18, 42, 0.90) 0%, rgba(5, 8, 20, 0.94) 100%);
      border: 2.5px solid #00f5d4;
      box-shadow: 0 4px 0 #023e8a, 0 0 16px rgba(0, 245, 212, 0.55);
      border-radius: 14px;
      padding: 7px 11px;
      pointer-events: auto;
      backdrop-filter: blur(8px);
    }
    .hud-top-label {
      font-family: 'Courier New', monospace;
      font-size: 9px;
      font-weight: 900;
      color: #ffbe0b;
      letter-spacing: 0.4px;
      text-transform: uppercase;
      margin-bottom: 2px;
      white-space: nowrap;
    }
    .hud-top-label .cyan-mult {
      background: #00f5d4;
      color: #03071e;
      padding: 1px 5px;
      border-radius: 5px;
      margin-left: 4px;
      font-weight: 900;
    }
    .hud-score-num {
      font-family: 'Arial Black', Impact, sans-serif;
      font-size: 26px;
      line-height: 1.0;
      color: #ffffff;
      -webkit-text-stroke: 1px #000;
      text-shadow: 0 3px 0 #ff007f, 0 0 12px rgba(255, 0, 127, 0.85);
      margin-bottom: 4px;
    }
    #powerup-banners {
      display: flex;
      gap: 4px;
      flex-wrap: wrap;
      min-height: 18px;
    }
    .alert-pill {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      background: linear-gradient(180deg, #ff2a2a 0%, #990000 100%);
      border: 1.5px solid #ffffff;
      border-radius: 14px;
      padding: 1px 8px;
      font-size: 9px;
      font-weight: 900;
      color: #fff;
      text-transform: uppercase;
      box-shadow: 0 2px 0 #4a0000;
    }

    .hud-right-wrap {
      display: flex;
      align-items: flex-start;
      gap: 6px;
      pointer-events: auto;
    }
    #wheelie-bar-wrap {
      width: 118px;
      height: 12px;
      background: #0b0e1d;
      border: 2px solid #ffffff;
      border-radius: 8px;
      margin: 4px 0 5px 0;
      overflow: hidden;
      position: relative;
    }
    #wheelie-bar {
      height: 100%;
      width: 68%;
      background: linear-gradient(90deg, #f77f00 0%, #ffbe0b 55%, #ffffff 100%);
      border-radius: 5px;
      transition: width 0.04s linear;
    }
    #wheelie-zone {
      position: absolute;
      left: 55%;
      width: 30%;
      top: 0;
      bottom: 0;
      border-left: 2px dashed #ffffff;
      border-right: 2px dashed #ffffff;
      background: rgba(0, 245, 212, 0.28);
    }
    .hud-stats-row {
      font-family: 'Courier New', monospace;
      font-size: 10px;
      font-weight: 900;
      color: #ffbe0b;
      display: flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }
    .pause-btn-orange {
      width: 44px;
      height: 44px;
      background: linear-gradient(180deg, #ffbe0b 0%, #fb5607 100%);
      border: 2.5px solid #ffffff;
      border-radius: 12px;
      color: #ffffff;
      font-family: 'Arial Black', sans-serif;
      font-size: 16px;
      font-weight: 900;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      box-shadow: 0 4px 0 #992200;
    }
    .pause-btn-orange:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #992200;
    }

    /* BOLLYWOOD CINEMATIC INTRO LETTERBOX & BANNER */
    #cinematic-bars {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 20;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    #cinematic-bars.hidden { display: none; }
    .cinema-bar {
      width: 100%;
      height: 11vh;
      background: #000;
      border-bottom: 2px solid #ff007f;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .cinema-bar.bottom {
      border-bottom: none;
      border-top: 2px solid #00f5d4;
    }
    #cinema-caption {
      font-family: 'Arial Black', Impact, sans-serif;
      font-size: clamp(16px, 4.5vw, 24px);
      color: #ffbe0b;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      text-shadow: 2px 2px 0 #ff007f;
      text-align: center;
      padding: 0 12px;
    }

    /* FLOATING COMBO POPUPS */
    #floating-popups {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 16;
      overflow: hidden;
    }
    .combo-pop {
      position: absolute;
      left: 50%;
      top: 52%;
      font-family: 'Arial Black', Impact, sans-serif;
      font-size: 24px;
      color: #ffbe0b;
      -webkit-text-stroke: 1.5px #000;
      text-shadow: 0 3px 0 #ff007f, 0 0 12px #00f5d4;
      animation: floatUpFade 0.75s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    @keyframes floatUpFade {
      0% { transform: translate(-50%, 0) scale(0.6); opacity: 1; }
      50% { transform: translate(-50%, -40px) scale(1.2); opacity: 1; }
      100% { transform: translate(-50%, -75px) scale(0.95); opacity: 0; }
    }

    /* ====================================================
       PORTRAIT HOME SCREEN UI (SUBWAY SURFERS LAYOUT)
       ==================================================== */
    #home-screen {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: max(14px, env(safe-area-inset-top)) 14px max(20px, env(safe-area-inset-bottom)) 14px;
      z-index: 25;
      pointer-events: none;
    }
    #home-screen.hidden { display: none; }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      pointer-events: auto;
    }
    .top-left-group, .top-right-group {
      display: flex;
      gap: 8px;
      align-items: center;

    .ss-pill-btn {

      border: 2.5px solid #ffffff;
      border-radius: 12px;
      padding: 7px 12px;
      color: #03071e;
      font-family: 'Arial Black', sans-serif;
      font-size: 11px;

    .ss-icon-btn {
      width: 42px;
      height: 42px;
      background: linear-gradient(180deg, #ffbe0b 0%, #fb5607 100%);
      border: 2.5px solid #fff;
      border-radius: 12px;
      color: #fff;
      font-size: 18px;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      position: relative;
      box-shadow: 0 4px 0 #992200;

    .badge-count {

      bottom: -5px;
      right: -5px;

      color: #000;
      font-size: 10px;
      padding: 1px 5px;
      border-radius: 6px;
      border: 1.5px solid #fff;
      font-weight: 900;
    }

    .home-center {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      pointer-events: auto;
      cursor: pointer;
      flex: 1;
      padding: 3vh 0 4vh 0;
      text-align: center;
    }
    .logo-cluster {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .tour-tag {
      background: linear-gradient(90deg, #ff007f 0%, #7209b7 100%);
      color: #fff;
      padding: 4px 14px;
      border-radius: 20px;
      border: 2px solid #00f5d4;
      font-size: 10px;
      font-weight: 900;
      letter-spacing: 1.2px;
      margin-bottom: 8px;
      box-shadow: 0 4px 0 #240046;
    }
    .graffiti-title {
      font-family: 'Arial Black', Impact, sans-serif;
      font-size: clamp(32px, 9vw, 48px);

      color: #ffbe0b;
      text-transform: uppercase;
      -webkit-text-stroke: 2px #000;
      text-shadow: 0 6px 0 #ff007f, 0 0 24px rgba(255, 0, 127, 0.8);
      margin-bottom: 8px;
      transform: rotate(-2deg);

    .graffiti-sub {
      display: block;

      color: #00f5d4;
      -webkit-text-stroke: 2px #050716;
      text-shadow: 0 6px 0 #7209b7;

    .high-score-banner {
      background: rgba(8, 11, 24, 0.92);
      border: 2px solid #00f5d4;
      padding: 5px 14px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: bold;
      color: #ffbe0b;
      box-shadow: 0 4px 0 #023e8a;
    }
    .tap-to-play {
      font-family: 'Arial Black', Impact, sans-serif;
      font-size: clamp(19px, 5vw, 25px);
      color: #03071e;
      background: linear-gradient(180deg, #ffbe0b 0%, #fb5607 100%);
      border: 3px solid #ffffff;
      padding: 12px 32px;
      border-radius: 30px;
      box-shadow: 0 6px 0 #992200, 0 0 25px rgba(255, 190, 11, 0.85);
      animation: pulseTap 0.95s infinite alternate ease-in-out;
    }
    @keyframes pulseTap {
      from { transform: scale(1); }
      to { transform: scale(1.08); }
    }

    .bottom-dock {
      display: flex;
      justify-content: center;
      gap: 12px;
      width: 100%;
      pointer-events: auto;
    }
    .dock-btn {
      flex: 1;
      max-width: 115px;
      background: linear-gradient(180deg, #240046 0%, #10002b 100%);
      border: 2.5px solid #00f5d4;
      border-radius: 14px;
      padding: 8px 10px;
      text-align: center;
      box-shadow: 0 5px 0 #03045e, 0 0 14px rgba(0, 245, 212, 0.4);
      cursor: pointer;
    }
    .dock-btn:active { transform: translateY(3px); }
    .dock-icon { font-size: 20px; display: block; }
    .dock-label { font-family: 'Arial Black', sans-serif; font-size: 11px; color: #ffbe0b; }

    #event-toast {

      top: 108px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(8, 11, 24, 0.95);
      border: 2.5px solid #00f5d4;
      padding: 8px 18px;
      border-radius: 20px;
      font-weight: 900;
      font-size: 12px;
      color: #ffbe0b;
      box-shadow: 0 0 18px rgba(0, 245, 212, 0.7);
      z-index: 18;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.3s ease;
      white-space: nowrap;
    }
    #event-toast.show { opacity: 1; }

    .modal-backdrop {
      position: absolute;
      inset: 0;
      background: rgba(4, 6, 16, 0.86);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 30;
      padding: 16px;
    }
    .modal-backdrop.hidden { display: none; }
    .modal-card {
      background: linear-gradient(180deg, #161b36 0%, #090c1c 100%);
      border: 3.5px solid #00f5d4;
      box-shadow: 0 10px 0 #023e8a, 0 0 30px rgba(0, 245, 212, 0.55);
      border-radius: 18px;
      padding: 20px;
      width: 100%;
      max-width: 360px;
      text-align: center;
      max-height: 86vh;
      overflow-y: auto;
    }
    .modal-card h2 {
      font-family: 'Arial Black', sans-serif;
      color: #ffbe0b;
      font-size: 20px;
      margin-bottom: 10px;
      text-shadow: 2px 2px 0 #ff007f;
    }
    .modal-card p {
      font-family: 'Courier New', monospace;
      font-size: 12px;
      color: #e0e1dd;
      line-height: 1.5;
      margin-bottom: 14px;
      font-weight: bold;
    }
    .modal-btn-col { display: flex; flex-direction: column; gap: 10px; }
    .btn {
      background: linear-gradient(180deg, #ff007f 0%, #99004d 100%);
      color: #fff;
      border: 2.5px solid #fff;
      padding: 10px 16px;
      font-family: 'Arial Black', sans-serif;
      font-size: 14px;
      border-radius: 12px;
      cursor: pointer;
      box-shadow: 0 4px 0 #4a0025;
    }
    .btn.green { background: linear-gradient(180deg, #00b4d8 0%, #0077b6 100%); box-shadow: 0 4px 0 #023e8a; }
    .btn.blue { background: linear-gradient(180deg, #7209b7 0%, #3a0ca3 100%); box-shadow: 0 4px 0 #10002b; }
    .setting-row, .level-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(255,255,255,0.07);
      border: 1.5px solid rgba(0, 245, 212, 0.35);
      padding: 8px 12px;
      border-radius: 10px;
      margin-bottom: 8px;
      font-size: 12px;
      text-align: left;
    }
    .level-item.active { border: 2px solid #ffbe0b; background: rgba(255, 190, 11, 0.18); }
  </style>

  <script>
    // =========================================================================
    // 1. SUBWAY SURFERS STYLE UPBEAT BGM SEQUENCER + SFX ENGINE
    // =========================================================================
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;

    const Settings = {
      bgm: true,
      sfx: true,
      loops: true,
      bloom: true,
      vibration: true,
      selectedEventIdx: 1
    };

    function ensureAudio() {
      try {
        if (!audioCtx) audioCtx = new AudioCtx();
        if (audioCtx.state === 'suspended') audioCtx.resume();
      } catch (e) {}
    }

    // Procedural Subway Surfers Style 132 BPM Upbeat Funk/Surf Groove Sequencer
    const SubwayBGM = {
      step: 0,
      accum: 0,
      stepDuration: 60 / 132 / 4, // 16th-note at 132 BPM (~0.1136s)
      // Catchy Minor-Pentatonic / Dorian Surf Lead Melody (MIDI frequencies)
      bassNotes: [
        110, 0, 110, 130.8, 146.8, 0, 146.8, 164.8,
        130.8, 0, 130.8, 146.8, 164.8, 0, 196.0, 164.8
      ],
      leadNotes: [
        440, 0, 523.2, 587.3, 659.2, 0, 587.3, 523.2,
        440, 523.2, 659.2, 0, 784.0, 659.2, 587.3, 0
      ],
      update(delta, isFast = false) {
        if (!Settings.bgm || !audioCtx) return;
        const rate = isFast ? 1.18 : 1.0;
        this.accum += delta * rate;
        if (this.accum < this.stepDuration) return;
        this.accum -= this.stepDuration;

        const s = this.step % 16;
        const now = audioCtx.currentTime;

        // 1. Punchy 4-on-the-floor Kick + Syncopated Bounce Kick
        if (s === 0 || s === 4 || s === 8 || s === 10 || s === 12) {
          SoundFX._tone(135, 'sine', 0.11, 38, 0.15);
        }
        // 2. Crisp Backbeat Snare (Steps 4 & 12)
        if (s === 4 || s === 12) {
          this._playNoiseHit(0.09, 0.08);
          SoundFX._tone(210, 'triangle', 0.07, 110, 0.09);
        }
        // 3. Upbeat 16th Hi-Hat Groove
        if (s % 2 === 1) {
          this._playNoiseHit(0.03, 0.035);
        }
        // 4. Funky Slap Bassline
        const bFreq = this.bassNotes[s];
        if (bFreq > 0) {
          SoundFX._tone(bFreq, 'sawtooth', 0.10, bFreq * 0.98, 0.065);
        }
        // 5. Catchy Subway Surfers-style Lead Synth Hook
        const lFreq = this.leadNotes[s];
        if (lFreq > 0) {
          SoundFX._tone(lFreq, 'square', 0.11, lFreq * 1.005, 0.055);
        }

        this.step++;
      },
      _playNoiseHit(duration, vol) {
        try {
          const bufferSize = Math.floor(audioCtx.sampleRate * duration);
          const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
          const data = buffer.getChannelData(0);
          for (let i = 0; i < bufferSize; i++) {
            data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (bufferSize * 0.35));
          }
          const noise = audioCtx.createBufferSource();
          noise.buffer = buffer;
          const filter = audioCtx.createBiquadFilter();
          filter.type = 'highpass';
          filter.frequency.value = 1800;
          const gain = audioCtx.createGain();
          gain.gain.value = vol;
          noise.connect(filter);
          filter.connect(gain);
          gain.connect(audioCtx.destination);
          noise.start();

          osc.type = type;
          osc.frequency.setValueAtTime(freq, audioCtx.currentTime);

          gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);

          osc.start();

    const worldCurveUniforms = {

    function applySubwaySurfersCurveShader(material) {
      material.onBeforeCompile = (shader) => {
        shader.uniforms.uCurveY = worldCurveUniforms.uCurveY;
        shader.uniforms.uCurveX = worldCurveUniforms.uCurveX;
        shader.vertexShader = `
          uniform float uCurveY;
          uniform float uCurveX;
        ` + shader.vertexShader;
        shader.vertexShader = shader.vertexShader.replace(
          '#include <project_vertex>',
          `
          vec4 mvPosition = modelViewMatrix * vec4( transformed, 1.0 );
          float zDist = max(0.0, -mvPosition.z - 15.0);
          mvPosition.y += uCurveY * zDist * zDist;
          mvPosition.x += uCurveX * zDist * zDist;
          gl_Position = projectionMatrix * mvPosition;
          `
        );
      };
      return material;
    }

    function makeTextCanvasTexture(bgHex, borderHex, lines, width = 512, height = 256, textColor = '#000') {
      const c = document.createElement('canvas');
      c.width = width;
      c.height = height;
      const ctx = c.getContext('2d');
      ctx.fillStyle = bgHex;
      ctx.fillRect(0, 0, width, height);
      if (borderHex) {
        ctx.strokeStyle = borderHex;
        ctx.lineWidth = 12;
        ctx.strokeRect(6, 6, width - 12, height - 12);
      }
      ctx.fillStyle = textColor;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      const fontSize = Math.floor(height / (lines.length + 0.75));
      ctx.font = `900 ${fontSize}px "Arial Black", Impact, sans-serif`;
      lines.forEach((line, i) => {
        const y = ((i + 1) / (lines.length + 1)) * height;
        ctx.fillText(line, width / 2, y);
      });
      return new THREE.CanvasTexture(c);
    }

      grad.addColorStop(0.5, '#e2e8f0');

        triggerStumble();

    }

    function triggerJump() {
      if (gameState !== 'PLAYING' || isJumping || activePowerups.jetpack > 0) return;
      isJumping = true;
      slideTimer = 0;
      const superJump = activePowerups.sneakers > 0;
      jumpVel = superJump ? 46 : 34;
      SoundFX.jumpWhoosh(superJump);
    }

    function triggerSlide() {
      if (gameState !== 'PLAYING') return;
      slideTimer = 0.65;
      if (isJumping) jumpVel = -55;
      SoundFX.slideRoll();
    }

    function triggerBoostShield() {
      if (gameState !== 'PLAYING' || activePowerups.shield > 0) return;
      if (boostCount > 0) {
        boostCount--;
        localStorage.setItem('cyberauto_boosts', boostCount);
        hudBoosts.textContent = boostCount;
        boostCountBadge.textContent = boostCount;
        activePowerups.shield = 8.0;
        cameraShake = 0.35;
        SoundFX.autoHorn();
        showToast('🛡️ HOLO-BUMPER SHIELD ACTIVE (8S)!');
      }
    }

    function triggerStumble() {
      cameraShake = 0.45;
      SoundFX.stumbleAlert();
      if (stumbleTimer > 0) {
        triggerGameOver('Rammed off the Maglev by the chasing Cyber-Mafia SUV!');
      } else {
        stumbleTimer = 6.0;
        SoundFX.policeSiren();
        showToast('🚨 SUV BOSS GAINING! DONT SCRAPE THE RAILS!');
      }
    }

    let touchStartX = 0;
    let touchStartY = 0;
    let lastTapTime = 0;

    window.addEventListener('pointerdown', (e) => {
      if (e.target.closest('button') || e.target.closest('.dock-btn') || e.target.closest('.modal-card')) return;
      ensureAudio();
      if (gameState === 'INTRO') {
        finishBollywoodIntroAndStartRun();
        return;
      }
      touchStartX = e.clientX;
      touchStartY = e.clientY;
      if (gameState === 'PLAYING') {
        isHoldingWheelie = true;
        const now = performance.now();
        if (now - lastTapTime < 260) triggerBoostShield();
        lastTapTime = now;
      }
    });

    window.addEventListener('pointerup', (e) => {
      isHoldingWheelie = false;
      if (gameState !== 'PLAYING') return;
      const dx = e.clientX - touchStartX;
      const dy = e.clientY - touchStartY;
      if (Math.abs(dx) > 24 && Math.abs(dx) > Math.abs(dy)) {
        switchLane(dx < 0 ? -1 : 1);
      } else if (Math.abs(dy) > 24 && Math.abs(dy) > Math.abs(dx)) {
        if (dy < 0) triggerJump();
        else triggerSlide();
      }
    });

    window.addEventListener('keydown', (e) => {
      if (e.code === 'Escape' || e.code === 'KeyP') {
        if (gameState === 'PLAYING') openPauseModal();
        else if (gameState === 'PAUSED') resumeGame();
      }
      if (gameState === 'INTRO' && e.code === 'Space') {
        finishBollywoodIntroAndStartRun();
        return;
      }
      if (gameState !== 'PLAYING') return;
      if (e.code === 'ArrowLeft' || e.code === 'KeyA') switchLane(-1);
      if (e.code === 'ArrowRight' || e.code === 'KeyD') switchLane(1);
      if (e.code === 'ArrowUp' || e.code === 'KeyW') triggerJump();
      if (e.code === 'ArrowDown' || e.code === 'KeyS') triggerSlide();
      if (e.code === 'KeyE') triggerBoostShield();
      if (e.code === 'Space') isHoldingWheelie = true;
    });

    window.addEventListener('keyup', (e) => {

    });

    // =========================================================================
    // 11. MAIN ANIMATION, BOLLYWOOD INTRO & HIGH-ANGLE PORTRAIT CAMERA LOOP
    // =========================================================================
    const clock = new THREE.Clock();

    function updatePowerupHUD() {
      const tags = [];
      if (stumbleTimer > 0) tags.push(`<span class="alert-pill">🚨 SUV BOSS ${Math.ceil(stumbleTimer)}S</span>`);
      if (activePowerups.jetpack > 0) tags.push(`<span class="alert-pill" style="background:#ff6d00">🚀 NITRO ${Math.ceil(activePowerups.jetpack)}S</span>`);
      if (activePowerups.magnet > 0) tags.push(`<span class="alert-pill" style="background:#00b4d8">🧲 MAGNET ${Math.ceil(activePowerups.magnet)}S</span>`);
      if (activePowerups.sneakers > 0) tags.push(`<span class="alert-pill" style="background:#38b000">🔩 SPRINGS ${Math.ceil(activePowerups.sneakers)}S</span>`);
      if (activePowerups.shield > 0) tags.push(`<span class="alert-pill" style="background:#7209b7">🛡️ BUMPER ${Math.ceil(activePowerups.shield)}S</span>`);
      powerupBanners.innerHTML = tags.join('');
    }

    function animate() {
      requestAnimationFrame(animate);
      const delta = Math.min(clock.getDelta(), 0.1);
      const elapsed = clock.getElapsedTime();

      worldCurveUniforms.uCurveX.value = Math.sin(elapsed * 0.35) * 0.00010;

      // Play upbeat Subway Surfers-style BGM groove during Intro and Gameplay!
      if (gameState === 'INTRO' || gameState === 'PLAYING') {
        SubwayBGM.update(delta, activePowerups.jetpack > 0);
      }

      // Flash Rival SUV Police/Mafia Sirens
      if (rivalSirenL && rivalSirenR) {
        const flash = Math.sin(elapsed * 22) > 0;
        rivalSirenL.material.color.setHex(flash ? 0xff0000 : 0x220000);
        rivalSirenR.material.color.setHex(flash ? 0x003333 : 0x00ffff);
      }

      if (cameraShake > 0) cameraShake = Math.max(0, cameraShake - delta * 2.2);
      const shakeX = (Math.random() - 0.5) * cameraShake * 1.4;
      const shakeY = (Math.random() - 0.5) * cameraShake * 1.4;

      // =====================================================================
      // STATE 1: HOME SCREEN SHOWCASE CAMERA
      // =====================================================================
      if (gameState === 'HOME') {
        playerRig.position.x = THREE.MathUtils.lerp(playerRig.position.x, LANES[1], delta * 6);
        playerRig.position.y = THREE.MathUtils.lerp(playerRig.position.y, LANE_Y[1], delta * 6);
        bikeWheelieRig.rotation.z = 0.26 + Math.sin(elapsed * 3.2) * 0.03;
        bikeWheelieRig.rotation.y = 0.18;
        camera.position.lerp(new THREE.Vector3(0, 15.5, 23.0), delta * 5);
        camera.lookAt(0, 4.5, -25);
      }

      // =====================================================================
      // STATE 2: BOLLYWOOD ACTION INTRO CUTSCENE (3.8 SECONDS)
      //   0.0s - 1.3s: Street sideswipe collision with Boss SUV + Sparks!
      //   1.3s - 2.5s: Angry SUV chase toward the glowing Stunt Ramp!
      //   2.5s - 3.8s: Slow-mo 360° barrel-roll launch onto the Maglev Roof!
      // =====================================================================
      if (gameState === 'INTRO') {
        introTimer += delta;

        if (introTimer < 1.3) {
          // Phase 1: Street Sideswipe Crash!
          const t = introTimer / 1.3;
          playerRig.position.set(14.5 + Math.sin(t * Math.PI * 3) * 0.9, -7.5, 4);
          rivalSuvMesh.position.set(15.2 - Math.sin(t * Math.PI) * 1.1, -7.5, 6.5);
          bikeWheelieRig.rotation.z = Math.sin(t * 14) * 0.25;

          if (!introCrashTriggered && introTimer > 0.35) {
            introCrashTriggered = true;
            cameraShake = 0.75;
            SoundFX.crashSmash();
            spawnPickupBurst(new THREE.Vector3(14.8, -5.5, 12), 0xffbe0b);
          }

          camera.position.lerp(new THREE.Vector3(21.5 + shakeX, -1.5 + shakeY, 20.5), delta * 7);
          camera.lookAt(14.5, -5.5, 2);
        } else if (introTimer < 2.5) {
          // Phase 2: Angry SUV Boss Chase toward the Elevated Ramp!
          const t = (introTimer - 1.3) / 1.2;
          cinemaCaption.textContent = '🚨 ANGRY BOSS CHASING! HIT THE RAMP!';
          playerRig.position.set(THREE.MathUtils.lerp(14.5, 12.5, t), -7.5 + t * 2.2, THREE.MathUtils.lerp(4, -6, t));
          rivalSuvMesh.position.set(14.8, -7.5, THREE.MathUtils.lerp(7.5, 2, t));
          bikeWheelieRig.rotation.z = 0.35;

          camera.position.lerp(new THREE.Vector3(19.0 + shakeX, 2.5 + shakeY, 16.0), delta * 6);
          camera.lookAt(12.5, -2.0, -12);
        } else if (introTimer < 3.85) {
          // Phase 3: Bollywood Slow-Mo Airborne Barrel Roll onto the Maglev Bullet Train Roof!
          const t = (introTimer - 2.5) / 1.35;
          if (!introJumpTriggered) {
            introJumpTriggered = true;
            SoundFX.bollywoodRampLaunch();
            SoundFX.autoHorn();
            cinemaCaption.textContent = '🎬 BOLLYWOOD SKY-STUNT ONTO THE MAGLEV!';
          }

          const arcX = THREE.MathUtils.lerp(12.5, LANES[1], t);
          const arcY = THREE.MathUtils.lerp(-5.0, LANE_Y[1], t) + Math.sin(t * Math.PI) * 14.5;
          const arcZ = THREE.MathUtils.lerp(-6, 0, t);
          playerRig.position.set(arcX, arcY, arcZ);

          // Dramatic 360-degree Bollywood Barrel Roll + Nose Pitch in mid-air!
          bikeWheelieRig.rotation.z = t * Math.PI * 2 + 0.32;
          bikeWheelieRig.rotation.x = Math.sin(t * Math.PI) * 0.35;

          camera.position.lerp(new THREE.Vector3(0, 19.5, 25.0), delta * 5);
          camera.lookAt(0, 2.5, -35);
        } else {
          finishBollywoodIntroAndStartRun();
        }
      }

      // =====================================================================
      // STATE 3: UNOBSTRUCTED HIGH-ANGLE PORTRAIT GAMEPLAY LOOP
      // =====================================================================
      if (gameState === 'PLAYING') {
        const targetFov = activePowerups.jetpack > 0 ? 68 : 60;
        if (Math.abs(camera.fov - targetFov) > 0.1) {
          camera.fov = THREE.MathUtils.lerp(camera.fov, targetFov, delta * 5);
          camera.updateProjectionMatrix();
        }

        // HIGH-ANGLE SUBWAY SURFERS CAMERA:
        // Sits at Y = 19.5 looking down at Y = 2.0 so the Auto stays in the bottom 22% of the screen
        // and NEVER blocks oncoming obstacles or Chai glasses!
        const camFollowX = playerRig.position.x * 0.42 + shakeX;
        camera.position.lerp(new THREE.Vector3(camFollowX, 19.5 + shakeY, 25.0), delta * 7);
        camera.lookAt(playerRig.position.x * 0.25, 2.0, -45);

        ['jetpack', 'magnet', 'sneakers', 'shield'].forEach(k => {
          if (activePowerups[k] > 0) activePowerups[k] = Math.max(0, activePowerups[k] - delta);
        });
        if (stumbleTimer > 0) {
          stumbleTimer = Math.max(0, stumbleTimer - delta);
          // Chasing SUV paces alongside on the parallel road when stumbleTimer is active!
          rivalSuvMesh.position.z = THREE.MathUtils.lerp(rivalSuvMesh.position.z, 10, delta * 3);
        } else {
          rivalSuvMesh.position.z = THREE.MathUtils.lerp(rivalSuvMesh.position.z, 26, delta * 2);
        }
        if (slideTimer > 0) slideTimer = Math.max(0, slideTimer - delta);
        updatePowerupHUD();

        if (isHoldingWheelie) {
          wheelieMeter += delta * 55;
        } else {
          wheelieMeter -= delta * 35;
        }
        wheelieMeter = Math.max(25, wheelieMeter);

        if (wheelieMeter >= 100) {
          wheelieMeter = 65;
          triggerGameOver('Tilted past the balance point and rolled off the Maglev roof!');
          return;
        }

        const inSweetSpot = wheelieMeter >= 55 && wheelieMeter <= 85;
        const mult = (inSweetSpot ? 2 : 1) * Math.max(1, currentLevelIdx);
        multBadge.textContent = `${mult}X`;
        wheelieBar.style.width = `${Math.min(100, wheelieMeter)}%`;

        score += delta * 22 * mult;
        scoreEl.textContent = Math.floor(score);
        fishEl.textContent = fishCount;

        for (let i = LEVELS.length - 1; i >= 0; i--) {
          if (score >= LEVELS[i].minScore && i > currentLevelIdx) {
            currentLevelIdx = i;
            const newLvl = LEVELS[currentLevelIdx];
            applyThemeVisuals(newLvl);
            hudLevelTxt.textContent = `ZONE ${newLvl.id} • ${newLvl.name}`;
            SoundFX.autoHorn();
            showToast(`🌆 ZONE ${newLvl.id}: ${newLvl.name}!`);
            break;
          }
        }

        const targetX = LANES[currentLane];
        const targetBaseY = LANE_Y[currentLane];
        const prevX = playerRig.position.x;
        playerRig.position.x = THREE.MathUtils.lerp(playerRig.position.x, targetX, delta * 13);
        const laneVelX = playerRig.position.x - prevX;

        if (activePowerups.jetpack > 0) {
          jumpY = THREE.MathUtils.lerp(jumpY, 9.5, delta * 8);
          isJumping = false;
        } else if (isJumping) {
          jumpY += jumpVel * delta;
          jumpVel -= 90 * delta;
          if (jumpY <= 0) {
            jumpY = 0;
            isJumping = false;
            cameraShake = 0.15;
            SoundFX.landImpact();
          }
        } else {
          jumpY = THREE.MathUtils.lerp(jumpY, 0, delta * 10);
        }

        playerRig.position.y = THREE.MathUtils.lerp(playerRig.position.y, targetBaseY, delta * 12) + jumpY;

        const targetScaleY = slideTimer > 0 ? 0.42 : 0.72;
        bikeWheelieRig.scale.y = THREE.MathUtils.lerp(bikeWheelieRig.scale.y, targetScaleY, delta * 16);

        bikeWheelieRig.rotation.z = (wheelieMeter / 100) * 0.44 - laneVelX * 0.45;
        bikeWheelieRig.rotation.y = 0.12 - laneVelX * 0.35;
        bikeWheelieRig.rotation.x = 0;

        const currentLvlObj = LEVELS[currentLevelIdx];
        spawnTimer -= delta;
        if (spawnTimer <= 0) {
          spawnWave(currentLvlObj);
          spawnTimer = Math.max(0.45, 1.02 - currentLevelIdx * 0.08);
        }

        const speed = (76 + currentLevelIdx * 11) * (activePowerups.jetpack > 0 ? 1.4 : 1.0);
        updateContinuousAudioLoops(delta, speed, activePowerups, currentLvlObj);

        for (let i = activeEntities.length - 1; i >= 0; i--) {
          const ent = activeEntities[i];
          ent.mesh.position.z += speed * delta;
          if (ent.type !== 'obstacle') ent.mesh.rotation.y += delta * 2.5;

          if (ent.active && ent.type === 'fish' && activePowerups.magnet > 0 && ent.mesh.position.z > -45) {
            ent.mesh.position.x = THREE.MathUtils.lerp(ent.mesh.position.x, playerRig.position.x, delta * 9);
            ent.mesh.position.y = THREE.MathUtils.lerp(ent.mesh.position.y, playerRig.position.y + 3.5, delta * 9);
          }

          if (!ent.passedSound && ent.type === 'obstacle' && ent.mesh.position.z > 12) {
            ent.passedSound = true;
            SoundFX.trainFlyBy();
          }

          // Hitbox check around Auto-Rickshaw Z position (Z = 6.5 to 13.5)
          if (ent.active && ent.mesh.position.z > 6.5 && ent.mesh.position.z < 13.5) {
            const xDist = Math.abs(playerRig.position.x - ent.mesh.position.x);
            if (xDist < 2.5) {
              if (ent.type === 'fish') {
                ent.active = false;
                fishCount++;
                comboFish++;
                const pts = 50 * mult;
                score += pts;
                SoundFX.chaiClink(comboFish);
                spawnPickupBurst(ent.mesh.position, 0xffbe0b);
                showFloatingComboText(`+${pts} ☕`);
                scene.remove(ent.mesh);
              } else if (ent.type === 'powerup') {
                ent.active = false;
                spawnPickupBurst(ent.mesh.position, 0x00f5d4);
                scene.remove(ent.mesh);
                let chosen = ent.pType;
                if (chosen === 'mystery') {
                  SoundFX.mysteryBoxFanfare();
                  const pool = ['jetpack', 'magnet', 'sneakers', 'shield'];
                  chosen = pool[Math.floor(Math.random() * pool.length)];
                } else {
                  SoundFX.autoHorn();
                }
                activePowerups[chosen] = 9.0;
                showToast(`⚡ ${chosen.toUpperCase()} ACTIVATED!`);
              } else if (ent.type === 'obstacle' && activePowerups.jetpack <= 0) {
                const hitHigh = ent.highBarrier && slideTimer <= 0;
                const hitLow = !ent.highBarrier && jumpY < 3.5;
                if (hitHigh || hitLow) {
                  ent.active = false;
                  scene.remove(ent.mesh);
                  triggerGameOver(ent.highBarrier ? 'Clipped an overhead Neon Laser Gate! (Swipe Down to Duck!)' : 'Hit a Floating Neon Hover-Barricade! (Swipe Up to Bunny-Hop!)');
                  return;
                }
              }
            }
          }

          if (ent.mesh.position.z > 30) {
            scene.remove(ent.mesh);
            activeEntities.splice(i, 1);
          }
        }
      }

      if (gameState !== 'PAUSED') {
        rearWheel.children.forEach(w => w.rotation.x -= delta * 24);
        frontWheel.rotation.x -= delta * 24;
        metalRoofTex.offset.y -= delta * 3.2;

        thrusterFlames.forEach(tf => {
          const pulse = 0.85 + Math.sin(elapsed * 42 + tf.phase) * 0.22;
          tf.outer.scale.set(pulse, 1.0 + Math.sin(elapsed * 30) * 0.35, pulse);
          tf.core.scale.set(pulse, pulse, pulse);
        });
        thrusterGlowLight.position.x = playerRig.position.x;

        trainSegments.forEach(seg => {
          seg.position.z += 68 * delta;
          if (seg.position.z > 40) seg.position.z -= 240;
        });

        ambientHoverPads.forEach(pad => {
          pad.mesh.position.z += pad.speed * delta;
          pad.mesh.position.y = pad.baseY + Math.sin(elapsed * 2.8 + pad.phase) * 0.55;
          if (pad.mesh.position.z > 32) pad.mesh.position.z -= 210;
        });

        cloudPuffs.forEach(cp => {
          cp.sprite.position.z += cp.speed * delta;
          if (cp.sprite.position.z > 35) cp.sprite.position.z -= 250;
        });

        cityStructures.forEach(c => {
          c.group.position.z += c.speed * delta;
          if (c.group.position.z > 40) c.group.position.z -= 280;
        });

        sparkParticles.forEach(sp => {
          if (sp.isScarf) {
            sp.mesh.position.y = sp.baseY + Math.sin(elapsed * 18 - sp.index * 0.65 + sp.tail) * (0.14 * sp.index);
            sp.mesh.position.z = sp.baseZ + Math.cos(elapsed * 14 - sp.index * 0.5) * (0.08 * sp.index);
          } else {
            const s = 0.5 + Math.sin(elapsed * 38 + sp.phase) * 0.45;
            sp.mesh.scale.set(s, s, s);
          }
        });

        for (let i = pickupBurstParticles.length - 1; i >= 0; i--) {
          const bp = pickupBurstParticles[i];
          bp.life -= delta;
          bp.mesh.position.addScaledVector(bp.vel, delta);
          bp.mesh.scale.setScalar(Math.max(0.01, bp.life * 2.2));
          if (bp.life <= 0) {
            scene.remove(bp.mesh);
            pickupBurstParticles.splice(i, 1);
          }
        }
      }

      if (composer && Settings.bloom) {
        composer.render();
      } else {
        renderer.render(scene, camera);
      }
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      if (composer) composer.setSize(window.innerWidth, window.innerHeight);
    });

    animate();
  </script>
</body>
</html>
