<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Cyber-Auto: Neon Velocity</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }
    body {
      overflow: hidden;
      background: linear-gradient(180deg, #050716 0%, #120e36 45%, #3b0d54 75%, #ff007f 100%);
      font-family: 'Courier New', Courier, monospace;
      color: #fff;
      transition: background 1.2s ease;
    }
    #canvas-container {
      width: 100vw;
      height: 100vh;
      display: block;
    }

    /* ==========================================
       EXACT CONCEPT ART HUD OVERLAY
       ========================================== */
    #hud {
      position: absolute;
      top: max(14px, env(safe-area-inset-top));
      left: 18px;
      right: 18px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      pointer-events: none;
      z-index: 15;
    }
    #hud.hidden { display: none; }

    .cyber-hud-box {
      background: rgba(8, 11, 24, 0.88);
      border: 3px solid #00f5d4;
      box-shadow: 0 0 14px rgba(0, 245, 212, 0.55), inset 0 0 10px rgba(0, 245, 212, 0.2);
      border-radius: 14px;
      padding: 10px 18px;
      pointer-events: auto;
      min-width: 240px;
    }
    .hud-top-label {
      font-size: 12px;
      font-weight: bold;
      color: #ffbe0b;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      margin-bottom: 4px;
    }
    .hud-top-label .cyan-mult {
      color: #00f5d4;
      margin-left: 6px;
    }
    .hud-score-num {
      font-family: 'Arial Black', Impact, sans-serif;
      font-size: 32px;
      line-height: 1.05;
      color: #ffffff;
      text-shadow: 2px 2px 0 #ff007f, 0 0 10px rgba(255, 0, 127, 0.7);
      margin-bottom: 6px;
    }
    #powerup-banners {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      min-height: 22px;
    }
    .alert-pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: linear-gradient(180deg, #e61919 0%, #990000 100%);
      border: 1.5px solid #ffffff;
      border-radius: 20px;
      padding: 3px 12px;
      font-size: 11px;
      font-weight: bold;
      color: #fff;
      text-transform: uppercase;
      box-shadow: 0 0 8px rgba(255, 0, 0, 0.6);
    }

    /* TOP RIGHT TILT BAR & PAUSE BUTTON */
    .hud-right-wrap {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      pointer-events: auto;
    }
    #wheelie-bar-wrap {
      width: 210px;
      height: 14px;
      background: #141829;
      border: 2px solid #ffffff;
      border-radius: 8px;
      margin: 6px 0 8px 0;
      overflow: hidden;
      position: relative;
    }
    #wheelie-bar {
      height: 100%;
      width: 65%;
      background: linear-gradient(90deg, #b57c1e 0%, #ffbe0b 60%, #fff3b0 100%);
      border-radius: 6px;
      transition: width 0.05s linear;
    }
    #wheelie-zone {
      position: absolute;
      left: 55%;
      width: 30%;
      top: 0;
      bottom: 0;
      border-left: 2px dashed #ffffff;
      border-right: 2px dashed #ffffff;
      background: rgba(255, 255, 255, 0.15);
    }
    .hud-stats-row {
      font-size: 12px;
      font-weight: bold;
      color: #ffbe0b;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .pause-btn-orange {
      width: 54px;
      height: 54px;
      background: linear-gradient(180deg, #ffaa00 0%, #ff5500 100%);
      border: 3px solid #ffffff;
      border-radius: 14px;
      color: #ffffff;
      font-family: 'Arial Black', sans-serif;
      font-size: 22px;
      font-weight: 900;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      box-shadow: 0 5px 0 #992200, 0 6px 14px rgba(0,0,0,0.5);
    }
    .pause-btn-orange:active {
      transform: translateY(3px);
      box-shadow: 0 2px 0 #992200;
    }

    /* ==========================================
       HOME SCREEN UI
       ========================================== */
    #home-screen {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: max(14px, env(safe-area-inset-top)) 18px max(16px, env(safe-area-inset-bottom)) 18px;
      z-index: 25;
      pointer-events: none;
    }
    #home-screen.hidden { display: none; }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      pointer-events: auto;
    }
    .top-left-group, .top-right-group {
      display: flex;
      gap: 10px;
      align-items: center;
    }
    .ss-pill-btn {
      background: rgba(8, 11, 24, 0.9);
      border: 2.5px solid #00f5d4;
      border-radius: 10px;
      padding: 8px 14px;
      color: #00f5d4;
      font-family: 'Arial Black', sans-serif;
      font-size: 12px;
      box-shadow: 0 0 10px rgba(0, 245, 212, 0.4);
      cursor: pointer;
    }
    .ss-icon-btn {
      width: 46px;
      height: 46px;
      background: linear-gradient(180deg, #ffaa00 0%, #ff5500 100%);
      border: 2.5px solid #fff;
      border-radius: 12px;
      color: #fff;
      font-size: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      position: relative;
      box-shadow: 0 4px 0 #992200;
    }
    .badge-count {
      position: absolute;
      bottom: -5px;
      right: -5px;
      background: #00f5d4;
      color: #000;
      font-size: 10px;
      padding: 1px 5px;
      border-radius: 6px;
      border: 1.5px solid #fff;
      font-weight: 900;
    }

    .home-center {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: center;
      pointer-events: auto;
      cursor: pointer;
      flex: 1;
      padding-left: 4vw;
    }
    .tour-tag {
      background: rgba(255, 0, 127, 0.9);
      color: #fff;
      padding: 4px 14px;
      border-radius: 20px;
      border: 2px solid #00f5d4;
      font-size: 11px;
      font-weight: bold;
      letter-spacing: 1.5px;
      margin-bottom: 6px;
    }
    .graffiti-title {
      font-family: 'Arial Black', Impact, sans-serif;
      font-size: clamp(28px, 5.5vw, 48px);
      line-height: 0.95;
      color: #ffbe0b;
      text-transform: uppercase;
      -webkit-text-stroke: 2px #000;
      text-shadow: 0 5px 0 #ff007f, 0 0 20px rgba(255, 0, 127, 0.7);
      margin-bottom: 8px;
    }
    .graffiti-sub {
      display: block;
      font-size: clamp(30px, 6vw, 52px);
      color: #00f5d4;
      -webkit-text-stroke: 2px #050716;
      text-shadow: 0 5px 0 #7209b7;
    }
    .high-score-banner {
      background: rgba(8, 11, 24, 0.9);
      border: 2px solid #00f5d4;
      padding: 6px 14px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: bold;
      color: #ffbe0b;
      margin-bottom: 14px;
    }
    .tap-to-play {
      font-family: 'Arial Black', Impact, sans-serif;
      font-size: clamp(18px, 3.5vw, 24px);
      color: #fff;
      background: linear-gradient(180deg, #ff007f 0%, #7209b7 100%);
      border: 3px solid #00f5d4;
      padding: 10px 26px;
      border-radius: 30px;
      box-shadow: 0 0 20px rgba(0, 245, 212, 0.7);
      animation: pulseTap 1s infinite alternate ease-in-out;
    }
    @keyframes pulseTap {
      from { transform: scale(1); }
      to { transform: scale(1.07); }
    }

    .bottom-dock {
      display: flex;
      justify-content: flex-start;
      padding-left: 4vw;
      gap: 14px;
      width: 100%;
      pointer-events: auto;
    }
    .dock-btn {
      background: rgba(8, 11, 24, 0.9);
      border: 2.5px solid #00f5d4;
      border-radius: 12px;
      padding: 6px 18px;
      text-align: center;
      box-shadow: 0 0 12px rgba(0, 245, 212, 0.35);
      cursor: pointer;
    }
    .dock-icon { font-size: 18px; display: block; }
    .dock-label { font-family: 'Arial Black', sans-serif; font-size: 11px; color: #ffbe0b; }

    /* TOAST & MODALS */
    #event-toast {
      position: absolute;
      top: 86px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(8, 11, 24, 0.95);
      border: 2.5px solid #00f5d4;
      padding: 8px 20px;
      border-radius: 20px;
      font-weight: bold;
      font-size: 13px;
      color: #ffbe0b;
      box-shadow: 0 0 15px rgba(0, 245, 212, 0.6);
      z-index: 18;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.3s ease;
    }
    #event-toast.show { opacity: 1; }

    .modal-backdrop {
      position: absolute;
      inset: 0;
      background: rgba(4, 6, 16, 0.86);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 30;
      padding: 16px;
    }
    .modal-backdrop.hidden { display: none; }
    .modal-card {
      background: rgba(10, 14, 30, 0.96);
      border: 3px solid #00f5d4;
      box-shadow: 0 0 25px rgba(0, 245, 212, 0.5);
      border-radius: 16px;
      padding: 20px;
      width: 100%;
      max-width: 380px;
      text-align: center;
      max-height: 88vh;
      overflow-y: auto;
    }
    .modal-card h2 {
      font-family: 'Arial Black', sans-serif;
      color: #ffbe0b;
      font-size: 20px;
      margin-bottom: 10px;
      text-shadow: 2px 2px 0 #ff007f;
    }
    .modal-card p {
      font-size: 12px;
      color: #e0e1dd;
      line-height: 1.5;
      margin-bottom: 14px;
      font-weight: bold;
    }
    .modal-btn-col { display: flex; flex-direction: column; gap: 10px; }
    .btn {
      background: linear-gradient(180deg, #ff007f 0%, #99004d 100%);
      color: #fff;
      border: 2px solid #fff;
      padding: 10px 18px;
      font-family: 'Arial Black', sans-serif;
      font-size: 14px;
      border-radius: 10px;
      cursor: pointer;
    }
    .btn.green { background: linear-gradient(180deg, #00b4d8 0%, #0077b6 100%); }
    .btn.blue { background: linear-gradient(180deg, #7209b7 0%, #3a0ca3 100%); }
    .setting-row, .level-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(0, 245, 212, 0.35);
      padding: 8px 12px;
      border-radius: 8px;
      margin-bottom: 8px;
      font-size: 12px;
      text-align: left;
    }
    .level-item.active { border: 2px solid #ffbe0b; background: rgba(255, 190, 11, 0.15); }
  </style>
  <script src="three.min.js" onerror="this.onerror=null;this.src='https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js';"></script>
</head>
<body>

  <!-- HOME SCREEN -->
  <div id="home-screen">
    <div class="top-bar">
      <div class="top-left-group">
        <button class="ss-pill-btn" id="btn-missions">📋 CONTRACTS</button>
        <button class="ss-pill-btn" id="btn-daily">☕ DAILY CHAI</button>
      </div>
      <div class="top-right-group">
        <button class="ss-icon-btn" id="btn-boost-info">
          🛡️<span class="badge-count" id="boost-count-badge">3</span>
        </button>
        <button class="ss-icon-btn" id="btn-home-settings">⚙️</button>
      </div>
    </div>

    <div class="home-center" id="tap-to-play-zone">
      <div class="tour-tag" id="home-event-label">TN 37 CAPY 001 • ZONE 2: BIO-JUNGLE OVERGROWTH</div>
      <div class="graffiti-title">
        CYBER-AUTO
        <span class="graffiti-sub">NEON VELOCITY</span>
      </div>
      <div class="high-score-banner">
        🏆 BEST: <span id="home-best-el">0</span> &nbsp;|&nbsp; ☕ CHAI BANK: <span id="home-fish-bank">0</span>
      </div>
      <div class="tap-to-play">TAP TO DRIFT!</div>
    </div>

    <div class="bottom-dock">
      <div class="dock-btn" id="btn-levels">
        <span class="dock-icon">🌆</span>
        <span class="dock-label">ZONES</span>
      </div>
      <div class="dock-btn" id="btn-me">
        <span class="dock-icon">🐹</span>
        <span class="dock-label">CAPY 001</span>
      </div>
      <div class="dock-btn" id="btn-shop">
        <span class="dock-icon">🛠️</span>
        <span class="dock-label">GARAGE</span>
      </div>
    </div>
  </div>

  <!-- CONCEPT-ART REPLICA HUD OVERLAY -->
  <div id="hud" class="hidden">
    <div class="cyber-hud-box">
      <div class="hud-top-label">
        <span id="hud-level-txt">ZONE 2 • BIO-JUNGLE OVERGROWTH</span> |
        <span class="cyan-mult" id="mult-badge">2X</span>
      </div>
      <div class="hud-score-num" id="score-el">765</div>
      <div id="powerup-banners">
        <span class="alert-pill">🚨 CYBER-COP READY</span>
      </div>
    </div>

    <div class="hud-right-wrap">
      <div class="cyber-hud-box">
        <div class="hud-top-label">2-WHEEL AUTO-TILT (HOLD/DBLTAP)</div>
        <div id="wheelie-bar-wrap">
          <div id="wheelie-zone"></div>
          <div id="wheelie-bar"></div>
        </div>
        <div class="hud-stats-row">
          <span>☕ CHAI: <strong id="fish-el" style="color:#fff;">0</strong></span>
          <span>|</span>
          <span>🛡️ BUMPERS: <strong id="hud-boosts" style="color:#fff;">3</strong></span>
        </div>
      </div>
      <button class="pause-btn-orange" id="btn-pause">||</button>
    </div>
  </div>

  <div id="event-toast">CHAI FUELS LEGENDS!</div>

  <div id="modal-backdrop" class="modal-backdrop hidden">
    <div class="modal-card" id="modal-content"></div>
  </div>

  <div id="canvas-container"></div>

  <script>
    // =========================================================================
    // 1. PROCEDURAL WEB AUDIO ENGINE (2-STROKE ENGINE + HORN + CHAI CLINK)
    // =========================================================================
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;

    const Settings = {
      sfx: true,
      loops: true,
      vibration: true,
      selectedEventIdx: 1 // Default to Zone 2 Bio-Jungle Overgrowth from concept art!
    };

    function ensureAudio() {
      try {
        if (!audioCtx) audioCtx = new AudioCtx();
        if (audioCtx.state === 'suspended') audioCtx.resume();
      } catch (e) {}
    }

    const SoundFX = {
      uiTap() { if (Settings.sfx) { ensureAudio(); this._tone(580, 'sine', 0.06, 820, 0.14); } },
      popupOpen() { if (Settings.sfx) { ensureAudio(); this._tone(380, 'triangle', 0.12, 720, 0.14); } },
      autoHorn() {
        if (!Settings.sfx) return;
        ensureAudio();
        [440, 587, 440, 659].forEach((f, idx) => {
          setTimeout(() => this._tone(f, 'sawtooth', 0.11, f * 1.06, 0.15), idx * 75);
        });
      },
      laneWhoosh() { if (Settings.sfx) { ensureAudio(); this._tone(310, 'sine', 0.09, 560, 0.15); } },
      jumpWhoosh(superJump = false) {
        if (!Settings.sfx) return;
        ensureAudio();
        this._tone(superJump ? 360 : 250, 'square', 0.18, superJump ? 1020 : 680, 0.14);
      },
      slideRoll() { if (Settings.sfx) { ensureAudio(); this._tone(440, 'sawtooth', 0.14, 140, 0.12); } },
      landImpact() { if (Settings.sfx) { ensureAudio(); this._tone(120, 'triangle', 0.09, 50, 0.22); } },
      stumbleAlert() {
        if (!Settings.sfx) return;
        ensureAudio();
        this._tone(180, 'sawtooth', 0.18, 95, 0.22);
        if (Settings.vibration && navigator.vibrate) navigator.vibrate(65);
      },
      trainFlyBy() { if (Settings.sfx) { ensureAudio(); this._tone(150, 'sawtooth', 0.22, 70, 0.1); } },
      chaiClink(combo = 0) {
        if (!Settings.sfx) return;
        ensureAudio();
        const base = 880 + Math.min(combo * 55, 550);
        this._tone(base, 'sine', 0.09, base * 1.5, 0.18);
      },
      mysteryBoxFanfare() {
        if (!Settings.sfx) return;
        ensureAudio();
        [493, 659, 784, 987].forEach((f, i) => {
          setTimeout(() => this._tone(f, 'square', 0.13, f * 1.1, 0.15), i * 65);
        });
      },
      policeSiren() {
        if (!Settings.sfx) return;
        ensureAudio();
        this._tone(660, 'sawtooth', 0.15, 920, 0.14);
        setTimeout(() => this._tone(920, 'sawtooth', 0.15, 660, 0.14), 150);
      },
      wipeoutCatch() {
        if (!Settings.sfx) return;
        ensureAudio();
        this._tone(210, 'sawtooth', 0.45, 45, 0.25);
        if (Settings.vibration && navigator.vibrate) navigator.vibrate([110, 50, 160]);
      },
      _tone(freq, type, duration, slideFreq, vol = 0.15) {
        if (!audioCtx) return;
        try {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = type;
          osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
          if (slideFreq) osc.frequency.exponentialRampToValueAtTime(slideFreq, audioCtx.currentTime + duration);
          gain.gain.setValueAtTime(vol, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start();
          osc.stop(audioCtx.currentTime + duration);
        } catch (e) {}
      }
    };

    let loopStepAccum = 0;
    function updateContinuousAudioLoops(delta, speed, activePowerups, currentEventTheme) {
      if (!Settings.loops || !Settings.sfx) return;
      loopStepAccum += delta;
      const interval = activePowerups.jetpack > 0 ? 0.08 : Math.max(0.09, 0.20 - speed * 0.0009);
      if (loopStepAccum >= interval) {
        loopStepAccum = 0;
        ensureAudio();
        if (jumpY <= 0.1 && activePowerups.jetpack <= 0) {
          const tiltPitch = Math.floor(wheelieMeter * 0.9);
          SoundFX._tone(75 + tiltPitch + currentEventTheme.audioBaseOffset, 'sawtooth', 0.04, 95 + tiltPitch, 0.04);
        }
        if (activePowerups.jetpack > 0) {
          SoundFX._tone(210 + Math.random() * 75, 'sawtooth', 0.07, 310, 0.06);
        }
        if (activePowerups.magnet > 0) {
          SoundFX._tone(480 + Math.sin(performance.now() * 0.012) * 90, 'sine', 0.05, 520, 0.04);
        }
      }
    }

    // =========================================================
    // 2. ZONES CONFIG
    // =========================================================
    const LEVELS = [
      {
        id: 1,
        name: 'NEON METRO 2099',
        minScore: 0,
        bg: 'linear-gradient(180deg, #050716 0%, #19103b 45%, #ff007f 100%)',
        fogHex: 0x19103b,
        obsColor: 0xff007f,
        audioBaseOffset: 0,
        desc: 'Maglev roof surfing through Neo-Cyberabad!'
      },
      {
        id: 2,
        name: 'BIO-JUNGLE OVERGROWTH',
        minScore: 450,
        bg: 'linear-gradient(180deg, #040814 0%, #121c36 50%, #3b0d54 80%, #ff007f 100%)',
        fogHex: 0x161838,
        obsColor: 0x00f5d4,
        audioBaseOffset: 20,
        desc: 'Cyber-waterfalls, palm towers & neon skybridges!'
      },
      {
        id: 3,
        name: 'SOLAR FLARE FOUNDRY',
        minScore: 1000,
        bg: 'linear-gradient(180deg, #1b0502 0%, #6b0918 50%, #ff9100 100%)',
        fogHex: 0x4a0814,
        obsColor: 0xffbe0b,
        audioBaseOffset: -15,
        desc: 'Molten reactor core & thermal plasma mines!'
      },
      {
        id: 4,
        name: 'HOLO-LASER GRID',
        minScore: 1700,
        bg: 'linear-gradient(180deg, #02042b 0%, #005082 55%, #00f5d4 100%)',
        fogHex: 0x03254c,
        obsColor: 0x00f5d4,
        audioBaseOffset: 50,
        desc: 'High-frequency security lasers—Jump or Duck!'
      },
      {
        id: 5,
        name: 'PHONK MIDNIGHT OVERDRIVE',
        minScore: 2500,
        bg: 'linear-gradient(180deg, #000000 0%, #240046 50%, #f72585 100%)',
        fogHex: 0x180030,
        obsColor: 0xf72585,
        audioBaseOffset: 80,
        desc: 'Maximum Mach velocity & 5x multiplier rewards!'
      }
    ];

    // =========================================================
    // 3. THREE.JS HIGH-GLOSS 3D SCENE SETUP
    // =========================================================
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x161838, 0.0038);

    const camera = new THREE.PerspectiveCamera(46, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    container.appendChild(renderer.domElement);

    // Cyberpunk Lighting (Warm Golden Key + Neon Cyan & Magenta Rim Lights)
    const ambientLight = new THREE.AmbientLight(0xd8c8ff, 0.75);
    scene.add(ambientLight);

    const sunLight = new THREE.DirectionalLight(0xffeaad, 1.35);
    sunLight.position.set(25, 60, 40);
    sunLight.castShadow = true;
    sunLight.shadow.mapSize.width = 1024;
    sunLight.shadow.mapSize.height = 1024;
    scene.add(sunLight);

    const cyanPoint = new THREE.PointLight(0x00f5d4, 2.2, 85);
    cyanPoint.position.set(-14, 10, 12);
    scene.add(cyanPoint);

    const pinkPoint = new THREE.PointLight(0xff007f, 2.2, 85);
    pinkPoint.position.set(14, 12, 10);
    scene.add(pinkPoint);

    function makeTextCanvasTexture(bgHex, borderHex, lines, width = 512, height = 256, textColor = '#000') {
      const c = document.createElement('canvas');
      c.width = width;
      c.height = height;
      const ctx = c.getContext('2d');
      ctx.fillStyle = bgHex;
      ctx.fillRect(0, 0, width, height);
      if (borderHex) {
        ctx.strokeStyle = borderHex;
        ctx.lineWidth = 14;
        ctx.strokeRect(7, 7, width - 14, height - 14);
      }
      ctx.fillStyle = textColor;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      const fontSize = Math.floor(height / (lines.length + 0.8));
      ctx.font = `900 ${fontSize}px "Arial Black", Impact, sans-serif`;
      lines.forEach((line, i) => {
        const y = ((i + 1) / (lines.length + 1)) * height;
        ctx.fillText(line, width / 2, y);
      });
      const tex = new THREE.CanvasTexture(c);
      tex.needsUpdate = true;
      return tex;
    }

    const hudBoosts = document.getElementById('hud-boosts');
    const homeBestEl = document.getElementById('home-best-el');
    const homeFishBankEl = document.getElementById('home-fish-bank');
    const boostCountBadge = document.getElementById('boost-count-badge');
    const homeEventLabel = document.getElementById('home-event-label');
    const eventToast = document.getElementById('event-toast');
    const modalBackdrop = document.getElementById('modal-backdrop');
    const modalContent = document.getElementById('modal-content');

    function syncHomeUI() {
      homeBestEl.textContent = bestScore;
      homeFishBankEl.textContent = fishBank;
      boostCountBadge.textContent = boostCount;
      hudBoosts.textContent = boostCount;
      const lvl = LEVELS[Settings.selectedEventIdx];
      homeEventLabel.textContent = `TN 37 CAPY 001 • ZONE ${lvl.id}: ${lvl.name}`;
      applyThemeVisuals(lvl);
    }

    function applyThemeVisuals(lvl) {
      document.body.style.background = lvl.bg;
      scene.fog.color.setHex(lvl.fogHex);
    }

    function showToast(msg) {
      eventToast.textContent = msg;
      eventToast.classList.add('show');
      setTimeout(() => eventToast.classList.remove('show'), 2300);
    }

    syncHomeUI();

    function switchLane(dir) {
      if (gameState !== 'PLAYING') return;
      const next = Math.max(0, Math.min(2, currentLane + dir));
      if (next !== currentLane) {
        currentLane = next;
        SoundFX.laneWhoosh();
      } else {
        triggerStumble();
      }
    }

    function triggerJump() {
      if (gameState !== 'PLAYING' || isJumping || activePowerups.jetpack > 0) return;
      isJumping = true;
      slideTimer = 0;
      const superJump = activePowerups.sneakers > 0;
      jumpVel = superJump ? 48 : 36;
      SoundFX.jumpWhoosh(superJump);
    }

    function triggerSlide() {
      if (gameState !== 'PLAYING') return;
      slideTimer = 0.65;
      if (isJumping) jumpVel = -55;
      SoundFX.slideRoll();
    }

    function triggerBoostShield() {
      if (gameState !== 'PLAYING' || activePowerups.shield > 0) return;
      if (boostCount > 0) {
        boostCount--;
        localStorage.setItem('cyberauto_boosts', boostCount);
        hudBoosts.textContent = boostCount;
        boostCountBadge.textContent = boostCount;
        activePowerups.shield = 8.0;
        SoundFX.autoHorn();
        showToast('🛡️ HOLO-BUMPER SHIELD ACTIVE (8S)!');
      }
    }

    function triggerStumble() {
      SoundFX.stumbleAlert();
      if (stumbleTimer > 0) {
        triggerGameOver('Busted by Cyber-Cop Enforcers after scraping the Maglev rail twice!');
      } else {
        stumbleTimer = 6.0;
        SoundFX.policeSiren();
        showToast('🚨 CYBER-COP LOCK-ON! WATCH THE RAILS!');
      }
    }

    let touchStartX = 0;
    let touchStartY = 0;
    let lastTapTime = 0;

    window.addEventListener('pointerdown', (e) => {
      if (e.target.closest('button') || e.target.closest('.dock-btn') || e.target.closest('.modal-card')) return;
      touchStartX = e.clientX;
      touchStartY = e.clientY;
      if (gameState === 'PLAYING') {
        isHoldingWheelie = true;
        const now = performance.now();
        if (now - lastTapTime < 260) triggerBoostShield();
        lastTapTime = now;
      }
    });

    window.addEventListener('pointerup', (e) => {
      isHoldingWheelie = false;
      if (gameState !== 'PLAYING') return;
      const dx = e.clientX - touchStartX;
      const dy = e.clientY - touchStartY;
      if (Math.abs(dx) > 28 && Math.abs(dx) > Math.abs(dy)) {
        switchLane(dx < 0 ? -1 : 1);
      } else if (Math.abs(dy) > 28 && Math.abs(dy) > Math.abs(dx)) {
        if (dy < 0) triggerJump();
        else triggerSlide();
      }
    });

    window.addEventListener('keydown', (e) => {
      if (e.code === 'Escape' || e.code === 'KeyP') {
        if (gameState === 'PLAYING') openPauseModal();
        else if (gameState === 'PAUSED') resumeGame();
      }
      if (gameState !== 'PLAYING') return;
      if (e.code === 'ArrowLeft' || e.code === 'KeyA') switchLane(-1);
      if (e.code === 'ArrowRight' || e.code === 'KeyD') switchLane(1);
      if (e.code === 'ArrowUp' || e.code === 'KeyW') triggerJump();
      if (e.code === 'ArrowDown' || e.code === 'KeyS') triggerSlide();
      if (e.code === 'KeyE') triggerBoostShield();
      if (e.code === 'Space') isHoldingWheelie = true;
    });

    window.addEventListener('keyup', (e) => {
      if (e.code === 'Space') isHoldingWheelie = false;
    });

    // =========================================================
    function closeModal() {
      SoundFX.uiTap();
      modalBackdrop.classList.add('hidden');
    }

    function startGame() {
      SoundFX.autoHorn();
      score = 0;
      fishCount = 0;
      comboFish = 0;
      currentLane = 2;
      currentLevelIdx = Settings.selectedEventIdx;
      playerRig.position.set(LANES[currentLane], LANE_Y[currentLane], 0);
      wheelieMeter = 62;
      jumpY = 0;
      isJumping = false;
      slideTimer = 0;
      stumbleTimer = 2.5; // Show iconic "CYBER-COP 2S" badge on launch like concept art!
      activePowerups.jetpack = 0;
      activePowerups.magnet = 0;
      activePowerups.sneakers = 0;
      activePowerups.shield = 0;

      activeEntities.forEach(ent => scene.remove(ent.mesh));
      activeEntities.length = 0;

      applyThemeVisuals(LEVELS[currentLevelIdx]);
      hudLevelTxt.textContent = `ZONE ${LEVELS[currentLevelIdx].id} • ${LEVELS[currentLevelIdx].name}`;

      homeScreen.classList.add('hidden');
      modalBackdrop.classList.add('hidden');
      hud.classList.remove('hidden');
      gameState = 'PLAYING';
      showToast(`🛺 ${LEVELS[currentLevelIdx].name} — CHAI FUELS LEGENDS!`);
    }

    function resumeGame() {
      SoundFX.uiTap();
      modalBackdrop.classList.add('hidden');

    // =========================================================
    // 10. MAIN ANIMATION & HERO CAMERA LOOP
    // =========================================================
    const clock = new THREE.Clock();

    function updatePowerupHUD() {
      const tags = [];
      if (stumbleTimer > 0) tags.push(`<span class="alert-pill">🚨 CYBER-COP ${Math.ceil(stumbleTimer)}S</span>`);
      if (activePowerups.jetpack > 0) tags.push(`<span class="alert-pill" style="background:#ff6d00">🚀 NITRO ${Math.ceil(activePowerups.jetpack)}S</span>`);
      if (activePowerups.magnet > 0) tags.push(`<span class="alert-pill" style="background:#00b4d8">🧲 MAGNET ${Math.ceil(activePowerups.magnet)}S</span>`);
      if (activePowerups.sneakers > 0) tags.push(`<span class="alert-pill" style="background:#38b000">🔩 SPRINGS ${Math.ceil(activePowerups.sneakers)}S</span>`);
      if (activePowerups.shield > 0) tags.push(`<span class="alert-pill" style="background:#7209b7">🛡️ BUMPER ${Math.ceil(activePowerups.shield)}S</span>`);
      powerupBanners.innerHTML = tags.join('');
    }

    function animate() {
      requestAnimationFrame(animate);
      const delta = Math.min(clock.getDelta(), 0.1);
      const elapsed = clock.getElapsedTime();

      // CONCEPT ART HERO CAMERA: Front-3/4 angle showing the Capybara & TN 37 CAPY 001 plate clearly while looking down the Maglev roof into the skyline!
      camera.position.lerp(new THREE.Vector3(-2.5, 9.5, 27.5), delta * 5);
      camera.lookAt(1.5, 4.5, -25);

      if (gameState === 'HOME') {
        playerRig.position.x = THREE.MathUtils.lerp(playerRig.position.x, LANES[2], delta * 6);
        playerRig.position.y = THREE.MathUtils.lerp(playerRig.position.y, LANE_Y[2], delta * 6);
        bikeWheelieRig.rotation.z = -0.34 + Math.sin(elapsed * 3) * 0.04;
        bikeWheelieRig.rotation.y = -0.28;
      }

      if (gameState === 'PLAYING') {
        ['jetpack', 'magnet', 'sneakers', 'shield'].forEach(k => {
          if (activePowerups[k] > 0) activePowerups[k] = Math.max(0, activePowerups[k] - delta);
        });
        if (stumbleTimer > 0) stumbleTimer = Math.max(0, stumbleTimer - delta);
        if (slideTimer > 0) slideTimer = Math.max(0, slideTimer - delta);
        updatePowerupHUD();

        if (isHoldingWheelie) {
          wheelieMeter += delta * 55;
        } else {
          wheelieMeter -= delta * 35;
        }
        wheelieMeter = Math.max(15, wheelieMeter); // Always keep a badass slight 2-wheel tilt!

        if (wheelieMeter >= 100) {
          wheelieMeter = 65;
          triggerGameOver('Tilted past the balance point and rolled off the Maglev roof!');
          return;
        }

        const inSweetSpot = wheelieMeter >= 55 && wheelieMeter <= 85;
        const mult = (inSweetSpot ? 2 : 1) * Math.max(1, currentLevelIdx);
        multBadge.textContent = `${mult}X`;
        wheelieBar.style.width = `${Math.min(100, wheelieMeter)}%`;

        score += delta * 22 * mult;
        scoreEl.textContent = Math.floor(score);
        fishEl.textContent = fishCount;

        for (let i = LEVELS.length - 1; i >= 0; i--) {
          if (score >= LEVELS[i].minScore && i > currentLevelIdx) {
            currentLevelIdx = i;
            const newLvl = LEVELS[currentLevelIdx];
            applyThemeVisuals(newLvl);
            hudLevelTxt.textContent = `ZONE ${newLvl.id} • ${newLvl.name}`;
            SoundFX.autoHorn();
            showToast(`🌆 ZONE ${newLvl.id}: ${newLvl.name}!`);
            break;
          }
        }

        const targetX = LANES[currentLane];
        const targetBaseY = LANE_Y[currentLane];
        playerRig.position.x = THREE.MathUtils.lerp(playerRig.position.x, targetX, delta * 12);

        if (activePowerups.jetpack > 0) {
          jumpY = THREE.MathUtils.lerp(jumpY, 12, delta * 8);
          isJumping = false;
        } else if (isJumping) {
          jumpY += jumpVel * delta;
          jumpVel -= 92 * delta;
          if (jumpY <= 0) {
            jumpY = 0;
            isJumping = false;
            SoundFX.landImpact();
          }
        } else {
          jumpY = THREE.MathUtils.lerp(jumpY, 0, delta * 10);
        }

        playerRig.position.y = THREE.MathUtils.lerp(playerRig.position.y, targetBaseY, delta * 12) + jumpY;

        const targetScaleY = slideTimer > 0 ? 0.55 : 1.0;
        bikeWheelieRig.scale.y = THREE.MathUtils.lerp(bikeWheelieRig.scale.y, targetScaleY, delta * 16);

        // Heroic 2-wheel side-tilt angle matching the concept art!
        bikeWheelieRig.rotation.z = -(wheelieMeter / 100) * 0.65;
        bikeWheelieRig.rotation.y = -0.24;

        const currentLvlObj = LEVELS[currentLevelIdx];
        spawnTimer -= delta;
        if (spawnTimer <= 0) {
          spawnWave(currentLvlObj);
          spawnTimer = Math.max(0.45, 1.05 - currentLevelIdx * 0.08);
        }

        const speed = (75 + currentLevelIdx * 11) * (activePowerups.jetpack > 0 ? 1.4 : 1.0);
        updateContinuousAudioLoops(delta, speed, activePowerups, currentLvlObj);

        // Entities spawn in the background skyline (-Z) and rush toward the foreground (+Z)
        for (let i = activeEntities.length - 1; i >= 0; i--) {
          const ent = activeEntities[i];
          ent.mesh.position.z += speed * delta;
          if (ent.type !== 'obstacle') ent.mesh.rotation.y += delta * 2.5;

          if (ent.active && ent.type === 'fish' && activePowerups.magnet > 0 && ent.mesh.position.z > -45) {
            ent.mesh.position.x = THREE.MathUtils.lerp(ent.mesh.position.x, playerRig.position.x, delta * 9);
            ent.mesh.position.y = THREE.MathUtils.lerp(ent.mesh.position.y, playerRig.position.y + 4, delta * 9);
          }

          if (!ent.passedSound && ent.type === 'obstacle' && ent.mesh.position.z > 12) {
            ent.passedSound = true;
            SoundFX.trainFlyBy();
          }

          // Hitbox check around Auto-Rickshaw Z position (Z = 6 to 14)
          if (ent.active && ent.mesh.position.z > 6.5 && ent.mesh.position.z < 14.5) {
            const xDist = Math.abs(playerRig.position.x - ent.mesh.position.x);
            if (xDist < 3.6) {
              if (ent.type === 'fish') {
                ent.active = false;
                fishCount++;
                comboFish++;
                score += 50 * mult;
                SoundFX.chaiClink(comboFish);
                scene.remove(ent.mesh);
              } else if (ent.type === 'powerup') {
                ent.active = false;
                scene.remove(ent.mesh);
                let chosen = ent.pType;
                if (chosen === 'mystery') {
                  SoundFX.mysteryBoxFanfare();
                  const pool = ['jetpack', 'magnet', 'sneakers', 'shield'];
                  chosen = pool[Math.floor(Math.random() * pool.length)];
                } else {
                  SoundFX.autoHorn();
                }
                activePowerups[chosen] = 9.0;
                showToast(`⚡ ${chosen.toUpperCase()} ACTIVATED!`);
              } else if (ent.type === 'obstacle' && activePowerups.jetpack <= 0) {
                const hitHigh = ent.highBarrier && slideTimer <= 0;
                const hitLow = !ent.highBarrier && jumpY < 4.2;
                if (hitHigh || hitLow) {
                  ent.active = false;
                  scene.remove(ent.mesh);
                  triggerGameOver(ent.highBarrier ? 'Clipped an overhead Neon Laser Gate! (Swipe Down to Duck!)' : 'Hit a Floating Neon Hover-Barricade! (Swipe Up to Bunny-Hop!)');
                  return;
                }
              }
            }
          }

          if (ent.mesh.position.z > 35) {
            scene.remove(ent.mesh);
            activeEntities.splice(i, 1);
          }
        }
      }

      if (gameState !== 'PAUSED') {
        rearWheel.children.forEach(w => w.rotation.x += delta * 22);
        frontWheel.rotation.x += delta * 22;

        // Animate Maglev roof ribs rushing toward foreground (+Z)
        trainSegments.forEach(seg => {
          seg.position.z += 65 * delta;
          if (seg.position.z > 50) seg.position.z -= 220;
        });

        // Animate Cyberpunk Skyline & Billboards
        cityStructures.forEach(c => {
          c.group.position.z += c.speed * delta;
          if (c.group.position.z > 45) c.group.position.z -= 280;
        });

        // Animate Tire Sparks & Flowing Pink Scarf
        sparkParticles.forEach(sp => {
          if (sp.isScarf) {
            sp.mesh.position.y = 2.1 + Math.sin(elapsed * 18 - sp.index * 0.6) * (0.14 * sp.index);
          } else {
            const s = 0.6 + Math.sin(elapsed * 35 + sp.phase) * 0.4;
            sp.mesh.scale.set(s, s, s);
          }
        });
      }

      renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    animate();
  </script>
</body>
</html>
