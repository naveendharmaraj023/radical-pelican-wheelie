<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Radical Pelican: Supersonic Wheelie</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }
    body {
      overflow: hidden;
      background: linear-gradient(180deg, #1a2a6c 0%, #b21f1f 50%, #fdbb2d 100%);
      font-family: 'Courier New', Courier, monospace;
      color: #fff;
    }
    #canvas-container {
      width: 100vw;
      height: 100vh;
      display: block;
    }
    /* HUD OVERLAY */
    #hud {
      position: absolute;
      top: 16px;
      left: 16px;
      right: 16px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      pointer-events: none;
      z-index: 10;
    }
    .hud-box {
      background: rgba(15, 20, 35, 0.85);
      border: 3px solid #fdbb2d;
      padding: 10px 14px;
      border-radius: 8px;
      box-shadow: 0 6px 0 rgba(0, 0, 0, 0.4);
    }
    .score-title {
      font-size: 11px;
      color: #fdbb2d;
      text-transform: uppercase;
    }
    .score-val {
      font-size: 24px;
      font-weight: bold;
      text-shadow: 2px 2px 0 #000;
    }
    #wheelie-bar-wrap {
      width: 150px;
      height: 14px;
      background: #222;
      border: 2px solid #fff;
      border-radius: 4px;
      margin-top: 6px;
      overflow: hidden;
      position: relative;
    }
    #wheelie-bar {
      height: 100%;
      width: 50%;
      background: #2ec4b6;
      transition: background 0.1s;
    }
    #wheelie-zone {
      position: absolute;
      left: 55%;
      width: 30%;
      top: 0;
      bottom: 0;
      border-left: 2px dashed #fdbb2d;
      border-right: 2px dashed #fdbb2d;
      background: rgba(253, 187, 45, 0.25);
    }
    /* MODAL OVERLAY */
    #overlay {
      position: absolute;
      inset: 0;
      background: rgba(10, 14, 26, 0.82);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 20;
      padding: 20px;
      text-align: center;
    }
    #overlay.hidden {
      display: none;
    }
    .card {
      background: #141b2d;
      border: 4px solid #fdbb2d;
      border-radius: 12px;
      padding: 24px;
      max-width: 360px;
      box-shadow: 0 10px 0 #000;
    }
    .card h1 {
      color: #fdbb2d;
      font-size: 26px;
      margin-bottom: 8px;
      text-shadow: 2px 2px 0 #e63946;
    }
    .card p {
      font-size: 13px;
      color: #d0d7de;
      line-height: 1.5;
      margin-bottom: 16px;
    }
    .btn {
      background: #e63946;
      color: #fff;
      border: 3px solid #fff;
      padding: 12px 24px;
      font-family: inherit;
      font-size: 16px;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      box-shadow: 0 5px 0 #80151e;
      text-transform: uppercase;
    }
    .btn:active {
      transform: translateY(5px);
      box-shadow: 0 0 0 #80151e;
    }
    #touch-hint {
      position: absolute;
      bottom: 18px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.65);
      padding: 6px 14px;
      border-radius: 16px;
      font-size: 11px;
      white-space: nowrap;
      pointer-events: none;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <!-- TOP HUD -->
  <div id="hud">
    <div class="hud-box">
      <div class="score-title">Score <span id="mult-badge" style="color:#2ec4b6;">1x</span></div>
      <div class="score-val" id="score-el">0</div>
      <div class="score-title" style="margin-top:4px;">Best: <span id="best-el">0</span></div>
    </div>
    <div class="hud-box">
      <div class="score-title">Wheelie Sweet Spot</div>
      <div id="wheelie-bar-wrap">
        <div id="wheelie-zone"></div>
        <div id="wheelie-bar"></div>
      </div>
      <div class="score-title" style="margin-top:6px;">Fish: <span id="fish-el">0</span></div>
    </div>
  </div>

  <!-- START / GAME OVER SCREEN -->
  <div id="overlay">
    <div class="card">
      <h1 id="modal-title">RADICAL PELICAN</h1>
      <p id="modal-desc">
        <strong>Swipe Left / Right:</strong> Hop Across Wings<br>
        <strong>Swipe Up:</strong> Bunny Hop Missiles<br>
        <strong>Hold Screen / Space:</strong> Pull Wheelie (2x Score! Don't flip over!)
      </p>
      <button class="btn" id="start-btn">LAUNCH MISSION</button>
    </div>
  </div>

  <div id="touch-hint">Swipe L/R: Switch Lanes | Swipe Up: Jump | Hold: Pull Wheelie</div>
  <div id="canvas-container"></div>

  <script>
    // --- WEB AUDIO SYNTHESIZER (No external audio files needed) ---
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;
    function playTone(freq, type, duration, slideFreq = null) {
      if (!audioCtx) audioCtx = new AudioCtx();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      if (slideFreq) {
        osc.frequency.exponentialRampToValueAtTime(slideFreq, audioCtx.currentTime + duration);
      }
      gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + duration);
    }

    // --- SCENE, CAMERA & RENDERER SETUP ---
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0xd46a4c, 0.003);

    const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
    // Arcade chase-cam angle behind and slightly to the side
    camera.position.set(0, 26, -38);
    camera.lookAt(0, 8, 12);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    container.appendChild(renderer.domElement);

    // --- LIGHTING ---
    const ambientLight = new THREE.AmbientLight(0xffd6b8, 0.7);
    scene.add(ambientLight);

    const sunLight = new THREE.DirectionalLight(0xfff5e4, 1.1);
    sunLight.position.set(40, 80, -30);
    sunLight.castShadow = true;
    sunLight.shadow.mapSize.width = 1024;
    sunLight.shadow.mapSize.height = 1024;
    const d = 35;
    sunLight.shadow.camera.left = -d;
    sunLight.shadow.camera.right = d;
    sunLight.shadow.camera.top = d;
    sunLight.shadow.camera.bottom = -d;
    scene.add(sunLight);

    // --- SHARED VOXEL GEOMETRY & MATERIAL CACHE ---
    const voxelGeo = new THREE.BoxGeometry(0.95, 0.95, 0.95);
    const materials = {};

    function getMaterial(colorHex, options = {}) {
      const key = `${colorHex}_${options.transparent || false}_${options.opacity || 1}_${options.emissive || 0}`;
      if (!materials[key]) {
        materials[key] = new THREE.MeshStandardMaterial({
          color: colorHex,
          roughness: options.roughness !== undefined ? options.roughness : 0.45,
          metalness: options.metalness !== undefined ? options.metalness : 0.1,
          transparent: options.transparent || false,
          opacity: options.opacity !== undefined ? options.opacity : 1.0,
          emissive: options.emissive || 0x000000,
          emissiveIntensity: options.emissiveIntensity || 1.0
        });
      }
      return materials[key];
    }

    function addVoxel(group, x, y, z, colorHex, options = {}) {
      const mat = getMaterial(colorHex, options);
      const mesh = new THREE.Mesh(voxelGeo, mat);
      mesh.position.set(x, y, z);
      mesh.castShadow = !options.transparent;
      mesh.receiveShadow = true;
      group.add(mesh);
      return mesh;
    }

    function addVoxelBox(group, x1, y1, z1, x2, y2, z2, colorHex, options = {}) {
      const minX = Math.min(x1, x2), maxX = Math.max(x1, x2);
      const minY = Math.min(y1, y2), maxY = Math.max(y1, y2);
      const minZ = Math.min(z1, z2), maxZ = Math.max(z1, z2);
      for (let x = minX; x <= maxX; x++) {
        for (let y = minY; y <= maxY; y++) {
          for (let z = minZ; z <= maxZ; z++) {
            addVoxel(group, x, y, z, colorHex, options);
          }
        }
      }
    }

    // --- PALETTE ---
    const PALETTE = {
      JET_BASE: 0x45505e,
      JET_DARK: 0x2b323b,
      JET_LIGHT: 0x6c7a89,
      JET_STRIPE: 0xe63946,
      JET_GOLD: 0xf4a261,
      CANOPY: 0x38bdf8,
      EXHAUST: 0x1a1e24,
      FLAME_CORE: 0xffffff,
      FLAME_MID: 0x00e5ff,
      FLAME_OUTER: 0xff6d00,
      BIKE_FRAME: 0xe63946,
      BIKE_METAL: 0xdbe4ee,
      BIKE_TIRE: 0x1e2229,
      PEL_WHITE: 0xf8f9fa,
      PEL_GREY: 0xd0d7de,
      PEL_WING_TIP: 0x343a40,
      PEL_BEAK: 0xffbe0b,
      PEL_POUCH: 0xfb8500,
      PEL_FEET: 0xff9f1c,
      SHADES_DARK: 0x0d1117,
      SHADES_SHINE: 0x90e0ef,
      SCARF: 0x2ec4b6
    };

    // --- HIERARCHY: masterRig -> jetGroup -> playerRig -> bikeWheelieRig -> pelicanGroup ---
    const masterRig = new THREE.Group();
    scene.add(masterRig);

    const jetGroup = new THREE.Group();
    masterRig.add(jetGroup);

    const playerRig = new THREE.Group();
    jetGroup.add(playerRig);

    // ==========================================
    // 1. BUILD THE VOXEL FIGHTER JET
    // ==========================================
    (function buildFighterJet() {
      addVoxelBox(jetGroup, -2, -1, -14, 2, 1, 10, PALETTE.JET_BASE);
      addVoxelBox(jetGroup, -1, 2, -12, 1, 2, 8, PALETTE.JET_LIGHT);
      addVoxelBox(jetGroup, -2, -2, -10, 2, -2, 8, PALETTE.JET_DARK);

      addVoxelBox(jetGroup, -2, -1, 11, 2, 1, 13, PALETTE.JET_BASE);
      addVoxelBox(jetGroup, -1, -1, 14, 1, 1, 17, PALETTE.JET_BASE);
      addVoxelBox(jetGroup, -1, 0, 18, 1, 0, 20, PALETTE.JET_DARK);
      addVoxelBox(jetGroup, 0, 0, 21, 0, 0, 24, PALETTE.JET_DARK);

      addVoxelBox(jetGroup, -4, -1, -10, -3, 1, 6, PALETTE.JET_BASE);
      addVoxelBox(jetGroup, 3, -1, -10, 4, 1, 6, PALETTE.JET_BASE);
      addVoxelBox(jetGroup, -4, -1, 7, -3, 0, 7, PALETTE.EXHAUST);
      addVoxelBox(jetGroup, 3, -1, 7, 4, 0, 7, PALETTE.EXHAUST);

      for (let z = 3; z <= 13; z++) {
        const width = (z >= 5 && z <= 11) ? 1 : 0;
        const height = (z >= 6 && z <= 10) ? 4 : 3;
        for (let x = -width; x <= width; x++) {
          for (let y = 2; y <= height; y++) {
            addVoxel(jetGroup, x, y, z, PALETTE.CANOPY, { transparent: true, opacity: 0.65 });
          }
        }
      }

      for (let x = 5; x <= 18; x++) {
        const zFront = Math.floor(4 - (x - 5) * 0.9);
        const zBack = Math.floor(-10 - (x - 5) * 0.25);
        for (let z = zBack; z <= zFront; z++) {
          let color = PALETTE.JET_BASE;
          if (z === zFront) color = PALETTE.JET_LIGHT;
          if (x >= 11 && x <= 12) color = PALETTE.JET_STRIPE; // Lane markers on wings
          addVoxel(jetGroup, x, 0, z, color);
          addVoxel(jetGroup, -x, 0, z, color);
        }
      }

      for (let y = 1; y <= 7; y++) {
        const zStart = Math.floor(-15 - y * 0.3);
        const zEnd = Math.floor(-9 - y * 0.6);
        const xShift = Math.floor(3 + y * 0.25);
        for (let z = zStart; z <= zEnd; z++) {
          const col = (y >= 6) ? PALETTE.JET_STRIPE : PALETTE.JET_DARK;
          addVoxel(jetGroup, xShift, y, z, col);
          addVoxel(jetGroup, -xShift, y, z, col);
        }
      }

      [-2, 2].forEach(ex => {
        addVoxelBox(jetGroup, ex - 1, -1, -16, ex + 1, 1, -15, PALETTE.EXHAUST);
      });
    })();

    // Afterburner flames
    const flameVoxels = [];
    [-2, 2].forEach(ex => {
      for (let i = 0; i < 16; i++) {
        const zOffset = -17 - Math.floor(i / 2);
        const color = i < 5 ? PALETTE.FLAME_CORE : (i < 11 ? PALETTE.FLAME_MID : PALETTE.FLAME_OUTER);
        const mesh = addVoxel(jetGroup, ex, 0, zOffset, color, { emissive: color, emissiveIntensity: 1.5 });
        flameVoxels.push({ mesh, baseX: ex, baseY: 0, baseZ: zOffset, phase: Math.random() * 6 });
      }
    });

    // ==========================================
    // 2. BUILD BMX & PELICAN INSIDE playerRig
    // ==========================================
    const bikeWheelieRig = new THREE.Group();
    bikeWheelieRig.position.set(0, 2.5, -5);
    playerRig.add(bikeWheelieRig);

    function createVoxelWheel() {
      const wheel = new THREE.Group();
      const rimCoords = [
        [0, 3], [1, 3], [2, 2], [3, 1], [3, 0], [3, -1], [2, -2], [1, -3],
        [0, -3], [-1, -3], [-2, -2], [-3, -1], [-3, 0], [-3, 1], [-2, 2], [-1, 3]
      ];
      rimCoords.forEach(([z, y]) => addVoxel(wheel, 0, y, z, PALETTE.BIKE_TIRE));
      addVoxel(wheel, 0, 0, 0, PALETTE.BIKE_METAL);
      for (let r = 1; r <= 2; r++) {
        addVoxel(wheel, 0, r, 0, PALETTE.BIKE_METAL);
        addVoxel(wheel, 0, -r, 0, PALETTE.BIKE_METAL);
        addVoxel(wheel, 0, 0, r, PALETTE.BIKE_METAL);
        addVoxel(wheel, 0, 0, -r, PALETTE.BIKE_METAL);
      }
      return wheel;
    }

    const rearWheel = createVoxelWheel();
    rearWheel.position.set(0, 3, 0);
    bikeWheelieRig.add(rearWheel);

    const frontWheel = createVoxelWheel();
    frontWheel.position.set(0, 3, 12);
    bikeWheelieRig.add(frontWheel);

    const bikeFrameGroup = new THREE.Group();
    bikeWheelieRig.add(bikeFrameGroup);

    (function buildBikeFrame() {
      for (let z = 0; z <= 5; z++) {
        addVoxel(bikeFrameGroup, -1, 3, z, PALETTE.BIKE_FRAME);
        addVoxel(bikeFrameGroup, 1, 3, z, PALETTE.BIKE_FRAME);
      }
      for (let i = 0; i <= 4; i++) {
        addVoxel(bikeFrameGroup, -1, 3 + i, i, PALETTE.BIKE_FRAME);
        addVoxel(bikeFrameGroup, 1, 3 + i, i, PALETTE.BIKE_FRAME);
      }
      for (let y = 4; y <= 8; y++) addVoxel(bikeFrameGroup, 0, y, 4, PALETTE.BIKE_FRAME);
      addVoxelBox(bikeFrameGroup, -1, 9, 3, 1, 9, 5, PALETTE.BIKE_TIRE);
      for (let i = 0; i <= 6; i++) {
        addVoxel(bikeFrameGroup, 0, 3 + Math.floor(i * 0.8), 5 + i, PALETTE.BIKE_FRAME);
        addVoxel(bikeFrameGroup, 0, 7 + Math.floor(i * 0.3), 4 + i, PALETTE.BIKE_FRAME);
      }
      for (let y = 3; y <= 7; y++) {
        addVoxel(bikeFrameGroup, -1, y, 12, PALETTE.BIKE_METAL);
        addVoxel(bikeFrameGroup, 1, y, 12, PALETTE.BIKE_METAL);
      }
      for (let y = 8; y <= 12; y++) addVoxel(bikeFrameGroup, 0, y, 11, PALETTE.BIKE_METAL);
      addVoxelBox(bikeFrameGroup, -5, 13, 11, 5, 13, 11, PALETTE.BIKE_METAL);
      addVoxelBox(bikeFrameGroup, -6, 13, 11, -5, 13, 11, PALETTE.BIKE_FRAME);
      addVoxelBox(bikeFrameGroup, 5, 13, 11, 6, 13, 11, PALETTE.BIKE_FRAME);
    })();

    const pelicanGroup = new THREE.Group();
    bikeWheelieRig.add(pelicanGroup);
    const scarfVoxels = [];

    (function buildPelican() {
      addVoxelBox(pelicanGroup, -2, 10, 2, 2, 14, 6, PALETTE.PEL_WHITE);
      addVoxelBox(pelicanGroup, -3, 11, 3, 3, 13, 5, PALETTE.PEL_WHITE);
      addVoxelBox(pelicanGroup, -2, 15, 3, 2, 15, 6, PALETTE.PEL_WHITE);
      addVoxelBox(pelicanGroup, -2, 11, 0, 2, 12, 1, PALETTE.PEL_GREY);

      for (let y = 5; y <= 9; y++) {
        addVoxel(pelicanGroup, 2, y, 4, PALETTE.PEL_FEET);
        addVoxel(pelicanGroup, -2, y, 5, PALETTE.PEL_FEET);
      }

      addVoxelBox(pelicanGroup, -1, 16, 4, 1, 22, 5, PALETTE.PEL_WHITE);
      addVoxelBox(pelicanGroup, -2, 22, 4, 2, 25, 7, PALETTE.PEL_WHITE);

      // Sunglasses
      addVoxelBox(pelicanGroup, -3, 24, 7, 3, 24, 8, PALETTE.SHADES_DARK);
      addVoxel(pelicanGroup, -2, 24, 8.1, PALETTE.SHADES_SHINE);
      addVoxel(pelicanGroup, 1, 24, 8.1, PALETTE.SHADES_SHINE);

      // Giant Pelican Beak & Pouch
      addVoxelBox(pelicanGroup, -2, 22, 8, 2, 23, 15, PALETTE.PEL_BEAK);
      for (let z = 8; z <= 14; z++) {
        addVoxelBox(pelicanGroup, -2, 18, z, 2, 21, z, PALETTE.PEL_POUCH);
      }

      [-1, 1].forEach(side => {
        addVoxelBox(pelicanGroup, side * 3, 13, 4, side * 5, 14, 11, PALETTE.PEL_WHITE);
      });

      addVoxelBox(pelicanGroup, -2, 16, 3, 2, 16, 6, PALETTE.SCARF);
      for (let i = 0; i < 8; i++) {
        const m = addVoxel(pelicanGroup, 1, 16, 2 - i, PALETTE.SCARF);
        scarfVoxels.push({ mesh: m, index: i });
      }
    })();

    // ==========================================
    // 3. OBSTACLES (DRONES) & COLLECTIBLES (FISH)
    // ==========================================
    const LANES = [11, 0, -11]; // Left Wing (+X), Center (0), Right Wing (-X)
    const LANE_Y = [-1.5, 0, -1.5]; // Wings sit slightly lower than top fuselage
    const activeEntities = [];

    function createObstacleMesh() {
      const g = new THREE.Group();
      addVoxelBox(g, -2, 0, -2, 2, 2, 2, PALETTE.JET_STRIPE, { emissive: 0x550000 });
      addVoxelBox(g, -3, 1, 0, 3, 1, 0, PALETTE.JET_DARK);
      return g;
    }

    function createFishMesh() {
      const g = new THREE.Group();
      addVoxelBox(g, -1, 0, -1, 1, 1, 2, PALETTE.SCARF, { emissive: 0x0a4f48 });
      addVoxel(g, 0, 0, -2, PALETTE.PEL_BEAK);
      return g;
    }

    function spawnWave() {
      const laneIdx = Math.floor(Math.random() * 3);
      const isFish = Math.random() < 0.42;
      const mesh = isFish ? createFishMesh() : createObstacleMesh();
      const x = LANES[laneIdx];
      const y = 4.5 + LANE_Y[laneIdx];
      mesh.position.set(x, y, 150);
      scene.add(mesh);
      activeEntities.push({ mesh, laneIdx, isFish, active: true });
    }

    // ==========================================
    // 4. GAME STATE & CONTROLS
    // ==========================================
    let gameState = 'MENU'; // MENU, PLAYING, GAMEOVER
    let currentLane = 1; // 0: Left, 1: Center, 2: Right
    let jumpY = 0;
    let jumpVel = 0;
    let isJumping = false;

    // Wheelie mechanics (0 = flat on deck, 100 = flip backwards wipeout)
    let wheelieMeter = 35;
    let isHoldingWheelie = false;

    let score = 0;
    let fishCount = 0;
    let bestScore = parseInt(localStorage.getItem('pelican_best') || '0', 10);
    let spawnTimer = 0;

    const scoreEl = document.getElementById('score-el');
    const bestEl = document.getElementById('best-el');
    const fishEl = document.getElementById('fish-el');
    const multBadge = document.getElementById('mult-badge');
    const wheelieBar = document.getElementById('wheelie-bar');
    const overlay = document.getElementById('overlay');
    const modalTitle = document.getElementById('modal-title');
    const modalDesc = document.getElementById('modal-desc');
    const startBtn = document.getElementById('start-btn');

    bestEl.textContent = bestScore;

    function switchLane(dir) {
      if (gameState !== 'PLAYING') return;
      const next = Math.max(0, Math.min(2, currentLane + dir));
      if (next !== currentLane) {
        currentLane = next;
        playTone(320, 'sine', 0.08, 480);
      }
    }

    function triggerJump() {
      if (gameState !== 'PLAYING' || isJumping) return;
      isJumping = true;
      jumpVel = 36;
      playTone(260, 'square', 0.15, 620);
    }

    // Touch gesture recognition
    let touchStartX = 0;
    let touchStartY = 0;

    window.addEventListener('pointerdown', (e) => {
      if (e.target === startBtn) return;
      touchStartX = e.clientX;
      touchStartY = e.clientY;
      isHoldingWheelie = true;
    });

    window.addEventListener('pointerup', (e) => {
      isHoldingWheelie = false;
      if (gameState !== 'PLAYING') return;
      const dx = e.clientX - touchStartX;
      const dy = e.clientY - touchStartY;
      if (Math.abs(dx) > 35 && Math.abs(dx) > Math.abs(dy)) {
        // Camera looks toward +Z, so screen left is +X (lane -1)
        switchLane(dx < 0 ? -1 : 1);
      } else if (dy < -35 && Math.abs(dy) > Math.abs(dx)) {
        triggerJump();
      }
    });

    // Keyboard support for desktop testing
    window.addEventListener('keydown', (e) => {
      if (e.code === 'ArrowLeft' || e.code === 'KeyA') switchLane(-1);
      if (e.code === 'ArrowRight' || e.code === 'KeyD') switchLane(1);
      if (e.code === 'ArrowUp' || e.code === 'KeyW') triggerJump();
      if (e.code === 'Space') isHoldingWheelie = true;
    });
    window.addEventListener('keyup', (e) => {
      if (e.code === 'Space') isHoldingWheelie = false;
    });

    function startGame() {
      score = 0;
      fishCount = 0;
      currentLane = 1;
      wheelieMeter = 40;
      jumpY = 0;
      isJumping = false;
      activeEntities.forEach(ent => scene.remove(ent.mesh));
      activeEntities.length = 0;
      overlay.classList.add('hidden');
      gameState = 'PLAYING';
      playTone(440, 'triangle', 0.2, 880);
    }

    function triggerGameOver(reason) {
      gameState = 'GAMEOVER';
      playTone(180, 'sawtooth', 0.4, 55);
      if (Math.floor(score) > bestScore) {
        bestScore = Math.floor(score);
        localStorage.setItem('pelican_best', bestScore);
        bestEl.textContent = bestScore;
      }
      modalTitle.textContent = 'WIPEOUT!';
      modalDesc.innerHTML = `${reason}<br><br><strong>Final Score: ${Math.floor(score)}</strong><br>Fish Caught: ${fishCount}`;
      startBtn.textContent = 'FLY AGAIN';
      overlay.classList.remove('hidden');
    }

    startBtn.addEventListener('click', startGame);

    // ==========================================
    // 5. MAIN GAME LOOP
    // ==========================================
    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const delta = Math.min(clock.getDelta(), 0.1);
      const elapsed = clock.getElapsedTime();

      if (gameState === 'PLAYING') {
        // 1. Wheelie Balance Physics
        if (isHoldingWheelie) {
          wheelieMeter += delta * 58;
        } else {
          wheelieMeter -= delta * 38;
        }
        wheelieMeter = Math.max(0, wheelieMeter);

        if (wheelieMeter >= 100) {
          triggerGameOver('You pulled back too hard and looped the BMX off the jet!');
        }

        // Sweet spot between 55% and 85% gives 2x multiplier
        const inSweetSpot = wheelieMeter >= 55 && wheelieMeter <= 85;
        const mult = inSweetSpot ? 2 : 1;
        multBadge.textContent = `${mult}x`;
        wheelieBar.style.width = `${Math.min(100, wheelieMeter)}%`;
        wheelieBar.style.background = wheelieMeter > 85 ? '#e63946' : (inSweetSpot ? '#fdbb2d' : '#2ec4b6');

        // Score increments
        score += delta * 15 * mult;
        scoreEl.textContent = Math.floor(score);
        fishEl.textContent = fishCount;

        // 2. Smooth Lane Lerp & Jump Physics
        const targetX = LANES[currentLane];
        const targetBaseY = LANE_Y[currentLane];
        playerRig.position.x = THREE.MathUtils.lerp(playerRig.position.x, targetX, delta * 12);

        if (isJumping) {
          jumpY += jumpVel * delta;
          jumpVel -= 95 * delta; // Gravity
          if (jumpY <= 0) {
            jumpY = 0;
            isJumping = false;
          }
        }
        playerRig.position.y = THREE.MathUtils.lerp(playerRig.position.y, targetBaseY, delta * 12) + jumpY;

        // Tilt bike based on wheelie meter
        bikeWheelieRig.rotation.x = -(wheelieMeter / 100) * 0.95;

        // 3. Spawn & Update Obstacles / Fish
        spawnTimer -= delta;
        if (spawnTimer <= 0) {
          spawnWave();
          spawnTimer = Math.max(0.45, 1.15 - score * 0.0005);
        }

        const speed = 75 + Math.min(50, score * 0.05);
        for (let i = activeEntities.length - 1; i >= 0; i--) {
          const ent = activeEntities[i];
          ent.mesh.position.z -= speed * delta;
          ent.mesh.rotation.y += delta * 3;

          // Collision check around player Z (-5 to +5)
          if (ent.active && ent.mesh.position.z < 4 && ent.mesh.position.z > -6) {
            if (ent.laneIdx === currentLane && jumpY < 4.5) {
              ent.active = false;
              if (ent.isFish) {
                fishCount++;
                score += 50 * mult;
                playTone(580, 'sine', 0.12, 920);
                scene.remove(ent.mesh);
              } else {
                triggerGameOver('Clipped an oncoming supersonic drone!');
              }
            }
          }

          if (ent.mesh.position.z < -45) {
            scene.remove(ent.mesh);
            activeEntities.splice(i, 1);
          }
        }
      }

      // Ambient animations (always active)
      rearWheel.rotation.x += delta * 18;
      frontWheel.rotation.x += delta * 9;

      scarfVoxels.forEach(({ mesh, index }) => {
        mesh.position.y = 16 + Math.sin(elapsed * 16 - index * 0.6) * (0.16 * index);
      });

      flameVoxels.forEach(f => {
        const s = 0.75 + Math.sin(elapsed * 25 + f.phase) * 0.25;
        f.mesh.scale.set(s, s, s);
      });

      renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    animate();
  </script>
</body>
</html>
