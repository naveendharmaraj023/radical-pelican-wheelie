<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Cyber-Auto: Neon Velocity</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }
    body {
      overflow: hidden;
      background: linear-gradient(180deg, #090014 0%, #240046 45%, #ff007f 100%);
      font-family: 'Arial Black', Impact, 'Courier New', sans-serif;
      color: #fff;
      transition: background 1.2s ease;
    }
    #canvas-container {
      width: 100vw;
      height: 100vh;
      display: block;
    }

    /* ==========================================
       SUBWAY SURFERS STYLE HOME SCREEN UI
       ========================================== */
    #home-screen {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: max(14px, env(safe-area-inset-top)) 18px max(16px, env(safe-area-inset-bottom)) 18px;
      z-index: 25;
      pointer-events: none;
    }
    #home-screen.hidden { display: none; }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      pointer-events: auto;
    }
    .top-left-group, .top-right-group {
      display: flex;
      gap: 10px;
      align-items: center;
    }
    .ss-pill-btn {
      background: linear-gradient(180deg, #00f5d4 0%, #0077b6 100%);
      border: 3px solid #fff;
      border-radius: 10px;
      padding: 8px 14px;
      color: #03071e;
      font-size: 13px;
      font-weight: 900;
      text-shadow: 0 1px 0 #fff;
      box-shadow: 0 5px 0 #03045e, 0 6px 10px rgba(0,0,0,0.5);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .ss-pill-btn:active { transform: translateY(3px); box-shadow: 0 2px 0 #03045e; }

    .ss-icon-btn {
      width: 44px;
      height: 44px;
      background: linear-gradient(180deg, #ffbe0b 0%, #fb5607 100%);
      border: 3px solid #fff;
      border-radius: 10px;
      color: #fff;
      font-size: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 5px 0 #7f1d1d, 0 6px 10px rgba(0,0,0,0.5);
      cursor: pointer;
      position: relative;
    }
    .ss-icon-btn:active { transform: translateY(3px); box-shadow: 0 2px 0 #7f1d1d; }
    .badge-count {
      position: absolute;
      bottom: -4px;
      right: -4px;
      background: #00f5d4;
      color: #000;
      font-size: 10px;
      padding: 1px 5px;
      border-radius: 6px;
      border: 1.5px solid #fff;
      font-weight: 900;
    }

    /* CENTER LOGO & TAP TO PLAY */
    .home-center {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      pointer-events: auto;
      cursor: pointer;
      flex: 1;
    }
    .tour-tag {
      background: #ff007f;
      color: #fff;
      padding: 4px 14px;
      border-radius: 20px;
      border: 2px solid #00f5d4;
      font-size: 12px;
      letter-spacing: 2px;
      text-transform: uppercase;
      text-shadow: 1px 1px 0 #000;
      box-shadow: 0 4px 0 #590d22;
      margin-bottom: 6px;
    }
    .graffiti-title {
      font-size: clamp(28px, 6vw, 48px);
      line-height: 0.95;
      text-align: center;
      color: #ffbe0b;
      text-transform: uppercase;
      -webkit-text-stroke: 2px #000;
      text-shadow: 0 5px 0 #ff007f, 0 8px 15px rgba(0,0,0,0.7);
      transform: rotate(-3deg);
      margin-bottom: 8px;
    }
    .graffiti-sub {
      display: block;
      font-size: clamp(30px, 6.5vw, 54px);
      color: #00f5d4;
      -webkit-text-stroke: 2.5px #03045e;
      text-shadow: 0 6px 0 #7209b7, 0 10px 18px rgba(0,0,0,0.8);
    }
    .high-score-banner {
      background: rgba(15, 10, 35, 0.88);
      border: 2px solid #00f5d4;
      padding: 5px 16px;
      border-radius: 8px;
      font-size: 13px;
      color: #fff;
      text-shadow: 1px 1px 0 #000;
      margin-bottom: 18px;
    }
    .tap-to-play {
      font-size: clamp(19px, 4vw, 27px);
      color: #03071e;
      text-transform: uppercase;
      text-shadow: 0 1px 0 #fff;
      animation: pulseTap 1.05s infinite alternate ease-in-out;
      background: linear-gradient(180deg, #ffbe0b 0%, #fb5607 100%);
      border: 3px solid #fff;
      padding: 10px 28px;
      border-radius: 30px;
      box-shadow: 0 6px 0 #7f1d1d, 0 0 20px #ff007f;
    }
    @keyframes pulseTap {
      from { transform: scale(1); }
      to { transform: scale(1.08); }
    }

    /* BOTTOM DOCK (LEVELS / DRIVER / GARAGE) */
    .bottom-dock {
      display: flex;
      justify-content: center;
      gap: 16px;
      width: 100%;
      pointer-events: auto;
    }
    .dock-btn {
      background: linear-gradient(180deg, #7209b7 0%, #3a0ca3 100%);
      border: 3px solid #fff;
      border-radius: 14px;
      padding: 8px 20px;
      min-width: 105px;
      text-align: center;
      box-shadow: 0 6px 0 #10002b, 0 8px 14px rgba(0,0,0,0.5);
      cursor: pointer;
    }
    .dock-btn.green { background: linear-gradient(180deg, #00f5d4 0%, #0077b6 100%); box-shadow: 0 6px 0 #03045e; }
    .dock-btn.orange { background: linear-gradient(180deg, #ff007f 0%, #7209b7 100%); box-shadow: 0 6px 0 #3c096c; }
    .dock-btn:active { transform: translateY(4px); }
    .dock-icon { font-size: 20px; display: block; margin-bottom: 2px; }
    .dock-label {
      font-size: 13px;
      color: #ffbe0b;
      text-shadow: 1px 2px 0 #000;
      letter-spacing: 0.5px;
    }

    /* ==========================================
       IN-GAME HUD OVERLAY
       ========================================== */
    #hud {
      position: absolute;
      top: max(12px, env(safe-area-inset-top));
      left: 16px;
      right: 16px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      pointer-events: none;
      z-index: 15;
    }
    #hud.hidden { display: none; }
    .hud-box {
      background: rgba(12, 8, 28, 0.88);
      border: 3px solid #00f5d4;
      padding: 8px 12px;
      border-radius: 10px;
      box-shadow: 0 5px 0 rgba(0, 0, 0, 0.55);
      pointer-events: auto;
    }
    .score-title {
      font-size: 10px;
      color: #ffbe0b;
      text-transform: uppercase;
    }
    .score-val {
      font-size: 22px;
      font-weight: bold;
      color: #fff;
      text-shadow: 2px 2px 0 #ff007f;
    }
    #wheelie-bar-wrap {
      width: 145px;
      height: 12px;
      background: #1a1a2e;
      border: 2px solid #fff;
      border-radius: 4px;
      margin-top: 4px;
      overflow: hidden;
      position: relative;
    }
    #wheelie-bar {
      height: 100%;
      width: 50%;
      background: #00f5d4;
    }
    #wheelie-zone {
      position: absolute;
      left: 55%;
      width: 30%;
      top: 0;
      bottom: 0;
      border-left: 2px dashed #ffbe0b;
      border-right: 2px dashed #ffbe0b;
      background: rgba(255, 190, 11, 0.3);
    }
    #powerup-banners {
      display: flex;
      gap: 6px;
      margin-top: 6px;
      flex-wrap: wrap;
    }
    .p-tag {
      font-size: 10px;
      padding: 2px 7px;
      border-radius: 6px;
      border: 1.5px solid #fff;
      background: #ff007f;
      color: #fff;
      text-transform: uppercase;
    }

    /* LEVEL UP BANNER */
    #event-toast {
      position: absolute;
      top: 78px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(18, 10, 42, 0.94);
      border: 3px solid #00f5d4;
      padding: 8px 20px;
      border-radius: 20px;
      font-size: 14px;
      color: #ffbe0b;
      text-shadow: 1px 2px 0 #000;
      z-index: 18;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.35s ease;
      white-space: nowrap;
    }
    #event-toast.show { opacity: 1; }

    /* ==========================================
       MODALS
       ========================================== */
    .modal-backdrop {
      position: absolute;
      inset: 0;
      background: rgba(6, 4, 18, 0.86);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 30;
      padding: 16px;
    }
    .modal-backdrop.hidden { display: none; }
    .modal-card {
      background: linear-gradient(180deg, #191038 0%, #0a0618 100%);
      border: 4px solid #00f5d4;
      border-radius: 16px;
      padding: 20px;
      width: 100%;
      max-width: 375px;
      box-shadow: 0 10px 0 #000;
      text-align: center;
      max-height: 88vh;
      overflow-y: auto;
    }
    .modal-card h2 {
      color: #ffbe0b;
      font-size: 22px;
      margin-bottom: 10px;
      text-shadow: 2px 2px 0 #ff007f;
      text-transform: uppercase;
    }
    .modal-card p {
      font-size: 12px;
      color: #e0e1dd;
      line-height: 1.45;
      margin-bottom: 14px;
      font-family: 'Courier New', monospace;
      font-weight: bold;
    }
    .modal-btn-col {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .btn {
      background: #ff007f;
      color: #fff;
      border: 3px solid #fff;
      padding: 10px 18px;
      font-family: inherit;
      font-size: 15px;
      font-weight: 900;
      border-radius: 10px;
      cursor: pointer;
      box-shadow: 0 5px 0 #590d22;
      text-transform: uppercase;
    }
    .btn.green { background: #00b4d8; box-shadow: 0 5px 0 #03045e; }
    .btn.blue { background: #7209b7; box-shadow: 0 5px 0 #240046; }
    .btn:active { transform: translateY(4px); box-shadow: 0 1px 0 #000; }

    .setting-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(255,255,255,0.07);
      padding: 8px 12px;
      border-radius: 8px;
      margin-bottom: 8px;
      font-size: 13px;
    }
    .level-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(255,255,255,0.08);
      border: 2px solid #7209b7;
      padding: 8px 12px;
      border-radius: 10px;
      margin-bottom: 8px;
      cursor: pointer;
      text-align: left;
    }
    .level-item.active { border-color: #00f5d4; background: rgba(0, 245, 212, 0.18); }
  </style>
  <script src="three.min.js" onerror="this.onerror=null;this.src='https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js';"></script>
</head>
<body>

  <!-- ==========================================
       1. HOME SCREEN (CYBER-AUTO CAPYBARA EDITION)
       ========================================== -->
  <div id="home-screen">
    <div class="top-bar">
      <div class="top-left-group">
        <button class="ss-pill-btn" id="btn-missions">📋 Contracts</button>
        <button class="ss-pill-btn" id="btn-daily">🍊 Daily Chai</button>
      </div>
      <div class="top-right-group">
        <button class="ss-icon-btn" id="btn-boost-info" title="Holo-Bumper Shields">
          🛺<span class="badge-count" id="boost-count-badge">3</span>
        </button>
        <button class="ss-icon-btn" id="btn-home-settings" title="Settings">⚙️</button>
      </div>
    </div>

    <div class="home-center" id="tap-to-play-zone">
      <div class="tour-tag" id="home-event-label">CAPYBARA DRIFT • ZONE 1: NEON METRO</div>
      <div class="graffiti-title">
        CYBER-AUTO
        <span class="graffiti-sub">NEON VELOCITY</span>
      </div>
      <div class="high-score-banner">
        🏆 TOP METER: <span id="home-best-el">0</span> &nbsp;|&nbsp; ☕ CHAI BANK: <span id="home-fish-bank">0</span>
      </div>
      <div class="tap-to-play">TAP TO DRIFT!</div>
    </div>

    <div class="bottom-dock">
      <div class="dock-btn" id="btn-levels">
        <span class="dock-icon">🌆</span>
        <span class="dock-label">ZONES</span>
      </div>
      <div class="dock-btn green" id="btn-me">
        <span class="dock-icon">🐹</span>
        <span class="dock-label">CAPY</span>
      </div>
      <div class="dock-btn orange" id="btn-shop">
        <span class="dock-icon">🛠️</span>
        <span class="dock-label">GARAGE</span>
      </div>
    </div>
  </div>

  <!-- ==========================================
       2. IN-GAME HUD OVERLAY
       ========================================== -->
  <div id="hud" class="hidden">
    <div class="hud-box">
      <div class="score-title">
        <span id="hud-level-txt">ZONE 1 • NEON METRO</span> |
        <span id="mult-badge" style="color:#00f5d4;">1x</span>
      </div>
      <div class="score-val" id="score-el">0</div>
      <div id="powerup-banners"></div>
    </div>

    <div style="display:flex; gap:10px; align-items:flex-start;">
      <div class="hud-box">
        <div class="score-title">2-Wheel Auto-Tilt (Hold/DblTap)</div>
        <div id="wheelie-bar-wrap">
          <div id="wheelie-zone"></div>
          <div id="wheelie-bar"></div>
        </div>
        <div class="score-title" style="margin-top:5px;">
          ☕ Chai: <span id="fish-el">0</span> &nbsp;|&nbsp; 🛡️ Bumpers: <span id="hud-boosts">3</span>
        </div>
      </div>
      <button class="ss-icon-btn" id="btn-pause" style="pointer-events:auto;">⏸️</button>
    </div>
  </div>

  <div id="event-toast">ZONE UPGRADE!</div>

  <!-- ==========================================
       3. MODALS
       ========================================== -->
  <div id="modal-backdrop" class="modal-backdrop hidden">
    <div class="modal-card" id="modal-content"></div>
  </div>

  <div id="canvas-container"></div>

  <script>
    // =========================================================================
    // 1. MULTI-CHANNEL PROCEDURAL WEB AUDIO ENGINE (2-STROKE AUTO + HORN + CHAI)
    // =========================================================================
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;

    const Settings = {
      sfx: true,
      loops: true,
      vibration: true,
      selectedEventIdx: 0
    };

    function ensureAudio() {
      try {
        if (!audioCtx) audioCtx = new AudioCtx();
        if (audioCtx.state === 'suspended') audioCtx.resume();
      } catch (e) {}
    }

    const SoundFX = {
      uiTap() {
        if (!Settings.sfx) return;
        ensureAudio();
        this._tone(580, 'sine', 0.06, 820, 0.14);
      },
      popupOpen() {
        if (!Settings.sfx) return;
        ensureAudio();
        this._tone(380, 'triangle', 0.12, 720, 0.14);
      },
      // Iconic Deshi Auto-Rickshaw Double Bulb Horn ("Pom-Pom!")
      autoHorn() {
        if (!Settings.sfx) return;
        ensureAudio();
        [440, 587, 440, 659].forEach((f, idx) => {
          setTimeout(() => this._tone(f, 'sawtooth', 0.11, f * 1.06, 0.16), idx * 75);
        });
      },
      laneWhoosh() {
        if (!Settings.sfx) return;
        ensureAudio();
        this._tone(310, 'sine', 0.09, 560, 0.15);
      },
      jumpWhoosh(superJump = false) {
        if (!Settings.sfx) return;
        ensureAudio();
        this._tone(superJump ? 360 : 250, 'square', 0.18, superJump ? 1020 : 680, 0.14);
      },
      slideRoll() {
        if (!Settings.sfx) return;
        ensureAudio();
        this._tone(440, 'sawtooth', 0.14, 140, 0.12);
      },
      landImpact() {
        if (!Settings.sfx) return;
        ensureAudio();
        this._tone(120, 'triangle', 0.09, 50, 0.22);
      },
      stumbleAlert() {
        if (!Settings.sfx) return;
        ensureAudio();
        this._tone(180, 'sawtooth', 0.18, 95, 0.22);
        if (Settings.vibration && navigator.vibrate) navigator.vibrate(65);
      },
      trainFlyBy() {
        if (!Settings.sfx) return;
        ensureAudio();
        this._tone(150, 'sawtooth', 0.24, 70, 0.12);
      },
      // Cutting Chai Glass Clink-Ding
      chaiClink(combo = 0) {
        if (!Settings.sfx) return;
        ensureAudio();
        const base = 880 + Math.min(combo * 55, 550);
        this._tone(base, 'sine', 0.09, base * 1.5, 0.18);
      },
      mysteryBoxFanfare() {
        if (!Settings.sfx) return;
        ensureAudio();
        [493, 659, 784, 987].forEach((f, i) => {
          setTimeout(() => this._tone(f, 'square', 0.13, f * 1.1, 0.15), i * 65);
        });
      },
      policeSiren() {
        if (!Settings.sfx) return;
        ensureAudio();
        this._tone(660, 'sawtooth', 0.15, 920, 0.14);
        setTimeout(() => this._tone(920, 'sawtooth', 0.15, 660, 0.14), 150);
      },
      wipeoutCatch() {
        if (!Settings.sfx) return;
        ensureAudio();
        this._tone(210, 'sawtooth', 0.45, 45, 0.25);
        if (Settings.vibration && navigator.vibrate) navigator.vibrate([110, 50, 160]);
      },
      _tone(freq, type, duration, slideFreq, vol = 0.15) {
        if (!audioCtx) return;
        try {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = type;
          osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
          if (slideFreq) {
            osc.frequency.exponentialRampToValueAtTime(slideFreq, audioCtx.currentTime + duration);
          }
          gain.gain.setValueAtTime(vol, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start();
          osc.stop(audioCtx.currentTime + duration);
        } catch (e) {}
      }
    };

    // 2-Stroke Auto-Rickshaw Engine Brap Loop + Nitro / Magnet Hum
    let loopStepAccum = 0;
    function updateContinuousAudioLoops(delta, speed, activePowerups, currentEventTheme) {
      if (!Settings.loops || !Settings.sfx) return;
      loopStepAccum += delta;
      const interval = activePowerups.jetpack > 0 ? 0.08 : Math.max(0.09, 0.20 - speed * 0.0009);
      if (loopStepAccum >= interval) {
        loopStepAccum = 0;
        ensureAudio();
        // 2-stroke auto engine chug ("Brap-brap-brap") pitches up when tilting on 2 wheels!
        if (jumpY <= 0.1 && activePowerups.jetpack <= 0) {
          const tiltPitch = Math.floor(wheelieMeter * 0.9);
          SoundFX._tone(75 + tiltPitch + currentEventTheme.audioBaseOffset, 'sawtooth', 0.04, 95 + tiltPitch, 0.045);
        }
        // Nitro Flight Roar
        if (activePowerups.jetpack > 0) {
          SoundFX._tone(210 + Math.random() * 75, 'sawtooth', 0.07, 310, 0.07);
        }
        // Chai Magnet Bass Hum
        if (activePowerups.magnet > 0) {
          SoundFX._tone(480 + Math.sin(performance.now() * 0.012) * 90, 'sine', 0.05, 520, 0.04);
        }
      }
    }

    // =========================================================================
    // 2. CYBERPUNK ZONES & ROTATING EVENTS CONFIG
    // =========================================================================
    const LEVELS = [
      {
        id: 1,
        name: 'NEON METRO 2099',
        minScore: 0,
        bg: 'linear-gradient(180deg, #090014 0%, #240046 45%, #ff007f 100%)',
        fogHex: 0x3c096c,
        obsColor: 0xff007f,
        audioBaseOffset: 0,
        desc: 'Maglev roof surfing through Neo-Cyberabad!'
      },
      {
        id: 2,
        name: 'BIO-JUNGLE OVERGROWTH',
        minScore: 450,
        bg: 'linear-gradient(180deg, #04151f 0%, #183a37 50%, #00f5d4 100%)',
        fogHex: 0x0f4c5c,
        obsColor: 0x52b788,
        audioBaseOffset: 25,
        desc: 'Mutant cyber-vines & hydroponic drones!'
      },
      {
        id: 3,
        name: 'SOLAR FLARE FOUNDRY',
        minScore: 1000,
        bg: 'linear-gradient(180deg, #2b0902 0%, #9d0208 50%, #ffbe0b 100%)',
        fogHex: 0xd00000,
        obsColor: 0xffbe0b,
        audioBaseOffset: -15,
        desc: 'Molten reactor core & thermal plasma mines!'
      },
      {
        id: 4,
        name: 'HOLO-LASER GRID',
        minScore: 1700,
        bg: 'linear-gradient(180deg, #03045e 0%, #0077b6 50%, #00f5d4 100%)',
        fogHex: 0x023e8a,
        obsColor: 0x90e0ef,
        audioBaseOffset: 55,
        desc: 'High-frequency security lasers—Jump or Duck!'
      },
      {
        id: 5,
        name: 'PHONK MIDNIGHT OVERDRIVE',
        minScore: 2500,
        bg: 'linear-gradient(180deg, #000000 0%, #3a0ca3 50%, #f72585 100%)',
        fogHex: 0x240046,
        obsColor: 0xf72585,
        audioBaseOffset: 85,
        desc: 'Maximum Mach velocity & 5x multiplier rewards!'
      }
    ];

    // =========================================================================
    // 3. THREE.JS SCENE, CAMERA & RENDERER
    // =========================================================================
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x3c096c, 0.003);

    const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    container.appendChild(renderer.domElement);

    const ambientLight = new THREE.AmbientLight(0xf1e4ff, 0.78);
    scene.add(ambientLight);

    const sunLight = new THREE.DirectionalLight(0xfff0d4, 1.15);
    sunLight.position.set(40, 80, -30);
    sunLight.castShadow = true;
    sunLight.shadow.mapSize.width = 1024;
    sunLight.shadow.mapSize.height = 1024;
    const d = 35;
    sunLight.shadow.camera.left = -d;
    sunLight.shadow.camera.right = d;
    sunLight.shadow.camera.top = d;
    sunLight.shadow.camera.bottom = -d;
    scene.add(sunLight);

    // --- SHARED VOXEL GEOMETRY & MATERIAL CACHE ---
    const voxelGeo = new THREE.BoxGeometry(0.95, 0.95, 0.95);
    const materials = {};

    function getMaterial(colorHex, options = {}) {
      const key = `${colorHex}_${options.transparent || false}_${options.opacity || 1}_${options.emissive || 0}`;
      if (!materials[key]) {
        materials[key] = new THREE.MeshStandardMaterial({
          color: colorHex,
          roughness: options.roughness !== undefined ? options.roughness : 0.4,
          metalness: options.metalness !== undefined ? options.metalness : 0.15,
          transparent: options.transparent || false,
          opacity: options.opacity !== undefined ? options.opacity : 1.0,
          emissive: options.emissive || 0x000000,
          emissiveIntensity: options.emissiveIntensity || 1.0
        });
      }
      return materials[key];
    }

    function addVoxel(group, x, y, z, colorHex, options = {}) {
      const mat = getMaterial(colorHex, options);
      const mesh = new THREE.Mesh(voxelGeo, mat);
      mesh.position.set(x, y, z);
      mesh.castShadow = !options.transparent;
      mesh.receiveShadow = true;
      group.add(mesh);
      return mesh;
    }

    function addVoxelBox(group, x1, y1, z1, x2, y2, z2, colorHex, options = {}) {
      const minX = Math.min(x1, x2), maxX = Math.max(x1, x2);
      const minY = Math.min(y1, y2), maxY = Math.max(y1, y2);
      const minZ = Math.min(z1, z2), maxZ = Math.max(z1, z2);
      for (let x = minX; x <= maxX; x++) {
        for (let y = minY; y <= maxY; y++) {
          for (let z = minZ; z <= maxZ; z++) {
            addVoxel(group, x, y, z, colorHex, options);
          }
        }
      }
    }

    // --- CYBER-AUTO & CAPYBARA PALETTE ---
    const PALETTE = {
      TRAIN_DARK: 0x161a28,
      TRAIN_MID: 0x283044,
      TRAIN_LIGHT: 0x45506b,
      NEON_CYAN: 0x00f5d4,
      NEON_PINK: 0xff007f,
      AUTO_YELLOW: 0xffbe0b,
      AUTO_GREEN: 0x06d6a0,
      AUTO_BLACK: 0x141619,
      CHROME: 0xe2e8f0,
      GLASS: 0x48cae4,
      TIRE: 0x111317,
      CAPY_FUR: 0xa66c38,
      CAPY_SNOUT: 0x6f4518,
      TANGERINE: 0xff6d00,
      LEAF_GREEN: 0x38b000,
      CHAI_GLASS: 0xfff3b0,
      CHAI_TEA: 0xd48c46
    };

    // --- HIERARCHY: masterRig -> jetGroup -> playerRig -> bikeWheelieRig -> pelicanGroup ---
    const masterRig = new THREE.Group();
    scene.add(masterRig);

    const jetGroup = new THREE.Group(); // Cyberpunk 3-Lane Maglev Bullet Train
    masterRig.add(jetGroup);

    const playerRig = new THREE.Group();
    jetGroup.add(playerRig);

    // =========================================================
    // 1. BUILD THE 3-LANE CYBERPUNK MAGLEV BULLET TRAIN
    // =========================================================
    (function buildFighterJet() {
      // Center High-Speed Bullet Train Roof Deck (Lane 1: X = -4 to 4)
      addVoxelBox(jetGroup, -4, -2, -16, 4, 1, 14, PALETTE.TRAIN_MID);
      addVoxelBox(jetGroup, -3, 2, -15, 3, 2, 12, PALETTE.TRAIN_LIGHT);
      // Aerodynamic Shinkansen Nose Cone
      addVoxelBox(jetGroup, -3, -1, 15, 3, 1, 19, PALETTE.TRAIN_MID);
      addVoxelBox(jetGroup, -2, -1, 20, 2, 0, 24, PALETTE.TRAIN_DARK);
      // Glowing Cockpit Visor on Train Nose
      addVoxelBox(jetGroup, -3, 1, 14, 3, 1, 17, PALETTE.NEON_CYAN, { emissive: PALETTE.NEON_CYAN, emissiveIntensity: 0.9 });

      // Left & Right Magnetic Hover-Rails (Lanes 0 and 2: X = ±7 to ±15)
      [-1, 1].forEach(side => {
        // Structural laser struts connecting center train to side mag-rails
        addVoxelBox(jetGroup, side * 5, 0, -10, side * 6, 0, -7, PALETTE.NEON_PINK, { emissive: PALETTE.NEON_PINK, emissiveIntensity: 0.8 });
        addVoxelBox(jetGroup, side * 5, 0, 2, side * 6, 0, 5, PALETTE.NEON_PINK, { emissive: PALETTE.NEON_PINK, emissiveIntensity: 0.8 });

        // Side Maglev Deck Surface (Y = 0)
        addVoxelBox(jetGroup, side * 7, -1, -15, side * 15, 0, 12, PALETTE.TRAIN_DARK);
        // Neon Cyan Lane Guide Stripes at X = ±11
        addVoxelBox(jetGroup, side * 11, 0.1, -14, side * 11, 0.1, 11, PALETTE.NEON_CYAN, { emissive: PALETTE.NEON_CYAN, emissiveIntensity: 0.7 });
        // Outer Neon Pink Edge Guardrails
        addVoxelBox(jetGroup, side * 15, 1, -15, side * 15, 1, 11, PALETTE.NEON_PINK, { emissive: PALETTE.NEON_PINK, emissiveIntensity: 0.8 });
      });

      // Rear Maglev Thruster Housings
      [-11, 0, 11].forEach(tx => {
        addVoxelBox(jetGroup, tx - 2, -1, -17, tx + 2, 1, -16, PALETTE.AUTO_BLACK);
      });
    })();

    const flameVoxels = [];
    // Maglev Rear Thruster Plasma Flames + Auto-Rickshaw Dual Booster Flames
    [-11, 0, 11].forEach(ex => {
      for (let i = 0; i < 10; i++) {
        const zOffset = -18 - Math.floor(i / 2);
        const color = i < 4 ? 0xffffff : (i < 7 ? PALETTE.NEON_CYAN : PALETTE.NEON_PINK);
        const mesh = addVoxel(jetGroup, ex + (i % 2 === 0 ? -0.5 : 0.5), 0, zOffset, color, { emissive: color, emissiveIntensity: 1.4 });
        flameVoxels.push({ mesh, phase: Math.random() * 6 });
      }
    });

    // =========================================================
    // 2. BUILD ROCKET AUTO-RICKSHAW & CAPYBARA DRIVER
    // =========================================================
    const bikeWheelieRig = new THREE.Group();
    bikeWheelieRig.position.set(0, 2.5, -4);
    playerRig.add(bikeWheelieRig);

    function createVoxelWheel() {
      const wheel = new THREE.Group();
      addVoxelBox(wheel, 0, -1, -1, 0, 1, 1, PALETTE.TIRE);
      addVoxel(wheel, 0.2, 0, 0, PALETTE.CHROME);
      addVoxel(wheel, -0.2, 0, 0, PALETTE.CHROME);
      return wheel;
    }

    // 3 Auto-Rickshaw Wheels (Rear Axle + Single Front Fork Wheel)
    const rearWheel = new THREE.Group();
    rearWheel.position.set(0, 1.5, -3);
    const rwLeft = createVoxelWheel();
    rwLeft.position.set(3.2, 0, 0);
    const rwRight = createVoxelWheel();
    rwRight.position.set(-3.2, 0, 0);
    rearWheel.add(rwLeft, rwRight);
    bikeWheelieRig.add(rearWheel);

    const frontWheel = createVoxelWheel();
    frontWheel.position.set(0, 1.5, 5);
    bikeWheelieRig.add(frontWheel);

    const bikeFrameGroup = new THREE.Group();
    bikeWheelieRig.add(bikeFrameGroup);

    (function buildBikeFrame() {
      // Neon Cyan Underglow Chassis
      addVoxelBox(bikeFrameGroup, -3, 1, -4, 3, 1, 4, PALETTE.NEON_CYAN, { emissive: PALETTE.NEON_CYAN, emissiveIntensity: 0.9 });

      // Classic Green & Yellow Auto-Rickshaw Lower Body
      addVoxelBox(bikeFrameGroup, -3, 2, -4, 3, 3, 2, PALETTE.AUTO_GREEN);
      addVoxelBox(bikeFrameGroup, -2, 2, 3, 2, 4, 5, PALETTE.AUTO_YELLOW);

      // Side Body Panels & Rear Engine Cowling
      addVoxelBox(bikeFrameGroup, -3, 4, -4, 3, 6, -2, PALETTE.AUTO_YELLOW);
      addVoxelBox(bikeFrameGroup, -3, 4, -1, -3, 5, 2, PALETTE.AUTO_YELLOW);
      addVoxelBox(bikeFrameGroup, 3, 4, -1, 3, 5, 2, PALETTE.AUTO_YELLOW);

      // Single Cyber Cyclops Headlight + Front Mudguard
      addVoxelBox(bikeFrameGroup, -1, 3, 6, 1, 4, 6, PALETTE.NEON_CYAN, { emissive: 0xffffff, emissiveIntensity: 1.5 });
      addVoxelBox(bikeFrameGroup, -1, 2, 5, 1, 2, 6, PALETTE.AUTO_BLACK);

      // Clear Front Windshield & Side Canopy Pillars
      addVoxelBox(bikeFrameGroup, -2, 5, 4, 2, 8, 4, PALETTE.GLASS, { transparent: true, opacity: 0.55 });
      [-3, 3].forEach(px => {
        for (let y = 5; y <= 11; y++) {
          addVoxel(bikeFrameGroup, px, y, 3, PALETTE.AUTO_BLACK);
          addVoxel(bikeFrameGroup, px, y, -3, PALETTE.AUTO_BLACK);
        }
      });

      // Iconic Black/Yellow Striped Canopy Roof (Opened in the center so Capybara pops out!)
      addVoxelBox(bikeFrameGroup, -3, 12, -4, 3, 12, -2, PALETTE.AUTO_BLACK);
      addVoxelBox(bikeFrameGroup, -3, 12, 2, 3, 12, 4, PALETTE.AUTO_YELLOW);
      addVoxelBox(bikeFrameGroup, -3, 12, -1, -2, 12, 1, PALETTE.AUTO_BLACK);
      addVoxelBox(bikeFrameGroup, 2, 12, -1, 3, 12, 1, PALETTE.AUTO_BLACK);

      // Twin Rear Rocket Thruster Nozzles on the Auto-Rickshaw!
      [-2, 2].forEach(rx => {
        addVoxelBox(bikeFrameGroup, rx, 3, -6, rx, 4, -5, PALETTE.CHROME);
        const fMesh = addVoxel(bikeFrameGroup, rx, 3.5, -7, PALETTE.NEON_PINK, { emissive: PALETTE.NEON_PINK, emissiveIntensity: 1.5 });
        flameVoxels.push({ mesh: fMesh, phase: Math.random() * 5 });
      });
    })();

    const pelicanGroup = new THREE.Group(); // Capybara Driver Group
    bikeWheelieRig.add(pelicanGroup);
    const scarfVoxels = [];

    (function buildPelican() {
      // Plump Brown Capybara Torso Seated in Driver Seat
      addVoxelBox(pelicanGroup, -2, 4, -1, 2, 9, 2, PALETTE.CAPY_FUR);

      // Giant Iconic Boxy Capybara Head & Blunt Snout Facing Forward (+Z)
      addVoxelBox(pelicanGroup, -2, 10, -1, 2, 14, 3, PALETTE.CAPY_FUR);
      addVoxelBox(pelicanGroup, -2, 10, 4, 2, 13, 6, PALETTE.CAPY_SNOUT);
      // Cute nostrils & calm line mouth
      addVoxel(pelicanGroup, -1, 13, 6.2, PALETTE.AUTO_BLACK);
      addVoxel(pelicanGroup, 1, 13, 6.2, PALETTE.AUTO_BLACK);

      // Little Rounded Capybara Ears on Back Top Corners
      addVoxel(pelicanGroup, -2, 15, 0, PALETTE.CAPY_SNOUT);
      addVoxel(pelicanGroup, 2, 15, 0, PALETTE.CAPY_SNOUT);

      // Cyberpunk Neon Visor Shades on the Capybara!
      addVoxelBox(pelicanGroup, -2.5, 13, 3, 2.5, 14, 4.2, PALETTE.AUTO_BLACK);
      addVoxelBox(pelicanGroup, -2, 13.5, 4.4, 2, 13.5, 4.4, PALETTE.NEON_CYAN, { emissive: PALETTE.NEON_CYAN, emissiveIntensity: 1.1 });

      // Iconic Yuzu Tangerine / Orange Balanced on Top of Capybara's Head!
      addVoxelBox(pelicanGroup, -1, 15, 1, 1, 16, 2, PALETTE.TANGERINE);
      addVoxel(pelicanGroup, 0, 17, 1.5, PALETTE.LEAF_GREEN);

      // Capybara Paws Reaching Forward to Grip the Auto Handlebars
      [-2, 2].forEach(side => {
        addVoxelBox(pelicanGroup, side, 8, 2, side, 9, 4, PALETTE.CAPY_FUR);
      });

      // Flowing Neon Pink Cyber-Scarf Trailing in the Wind
      addVoxelBox(pelicanGroup, -2, 9.5, -1, 2, 9.5, 2, PALETTE.NEON_PINK, { emissive: PALETTE.NEON_PINK, emissiveIntensity: 0.5 });
      for (let i = 0; i < 8; i++) {
        const m = addVoxel(pelicanGroup, 1, 10, -2 - i, PALETTE.NEON_PINK, { emissive: PALETTE.NEON_PINK, emissiveIntensity: 0.7 });
        scarfVoxels.push({ mesh: m, index: i });
      }
    })();

    // ==========================================
    // 3. FLOATING HOLO-SIGNS & NEON SPEED STREAKS
    // ==========================================
    const clouds = [];
    for (let i = 0; i < 18; i++) {
      const cGroup = new THREE.Group();
      const x = (Math.random() - 0.5) * 160;
      const safeX = Math.abs(x) < 25 ? (x < 0 ? x - 30 : x + 30) : x;
      cGroup.position.set(safeX, -22 + Math.random() * 45, (Math.random() - 0.5) * 220);
      const holoCol = i % 2 === 0 ? PALETTE.NEON_CYAN : PALETTE.NEON_PINK;
      addVoxelBox(cGroup, -3, 0, -3, 3, 1, 3, PALETTE.TRAIN_DARK);
      addVoxelBox(cGroup, -2, 2, -2, 2, 2, 2, holoCol, { emissive: holoCol, emissiveIntensity: 0.6 });
      scene.add(cGroup);
      clouds.push({ group: cGroup, speed: 40 + Math.random() * 25 });
    }

    const speedLines = [];
    const streakGeo = new THREE.BoxGeometry(0.18, 0.18, 9);
    const streakMat = new THREE.MeshBasicMaterial({ color: 0x00f5d4, transparent: true, opacity: 0.45 });
    for (let i = 0; i < 28; i++) {
      const line = new THREE.Mesh(streakGeo, streakMat);
      line.position.set((Math.random() - 0.5) * 80, (Math.random() - 0.5) * 50, (Math.random() - 0.5) * 180);
      scene.add(line);
      speedLines.push({ mesh: line, speed: 105 + Math.random() * 45 });
    }

    // ==========================================
    // 4. OBSTACLES (BARRICADES/BEAMS) & COLLECTIBLES (CUTTING CHAI)
    // ==========================================
    const LANES = [11, 0, -11];
    const LANE_Y = [-1.5, 0, -1.5];
    const activeEntities = [];

    function createObstacleMesh(highBarrier = false, colorHex = PALETTE.NEON_PINK) {
      const g = new THREE.Group();
      if (highBarrier) {
        // Overhead Neon Toll / Laser Billboard (Swipe Down to Duck!)
        addVoxelBox(g, -3, 7, -1, 3, 10, 1, colorHex, { emissive: colorHex, emissiveIntensity: 0.8 });
        addVoxelBox(g, -3, 0, 0, -3, 7, 0, PALETTE.TRAIN_LIGHT);
        addVoxelBox(g, 3, 0, 0, 3, 7, 0, PALETTE.TRAIN_LIGHT);
      } else {
        // Low Cyber-Police Drone Barricade (Swipe Up to Bunny-Hop!)
        addVoxelBox(g, -2, 0, -2, 2, 2, 2, colorHex, { emissive: colorHex, emissiveIntensity: 0.6 });
        addVoxelBox(g, -3, 1, 0, 3, 1, 0, PALETTE.AUTO_YELLOW);
      }
      return g;
    }

    // Steaming Cutting Chai Glass Collectible!
    function createFishMesh() {
      const g = new THREE.Group();
      addVoxelBox(g, -1, 0, -1, 1, 2, 1, PALETTE.CHAI_TEA, { emissive: 0x6f4518, emissiveIntensity: 0.5 });
      addVoxelBox(g, -1, 2.2, -1, 1, 2.5, 1, PALETTE.CHAI_GLASS, { emissive: 0xffbe0b, emissiveIntensity: 0.8 });
      // Floating steam puff
      addVoxel(g, 0, 4, 0, 0xffffff, { transparent: true, opacity: 0.75 });
      return g;
    }

    function createPowerupMesh(pType) {
      const g = new THREE.Group();
      const colors = {
        jetpack: 0xff6d00,
        magnet: 0x00f5d4,
        sneakers: 0x38b000,
        mystery: 0xff007f
      };
      const c = colors[pType] || 0xffbe0b;
      addVoxelBox(g, -1, 0, -1, 1, 2, 1, c, { emissive: c, emissiveIntensity: 0.8 });
      addVoxel(g, 0, 3, 0, 0xffffff);
      return g;
    }

    function spawnWave(levelObj) {
      const laneIdx = Math.floor(Math.random() * 3);
      const roll = Math.random();
      let type = 'obstacle';
      let pType = null;
      let highBarrier = false;
      let mesh = null;

      if (roll < 0.43) {
        type = 'fish';
        mesh = createFishMesh();
      } else if (roll < 0.55) {
        type = 'powerup';
        const pList = ['jetpack', 'magnet', 'sneakers', 'mystery'];
        pType = pList[Math.floor(Math.random() * pList.length)];
        mesh = createPowerupMesh(pType);
      } else {
        type = 'obstacle';
        highBarrier = Math.random() < 0.32;
        mesh = createObstacleMesh(highBarrier, levelObj.obsColor);
      }

      const x = LANES[laneIdx];
      const y = 4.5 + LANE_Y[laneIdx] + (activePowerups.jetpack > 0 && type === 'fish' ? 14 : 0);
      mesh.position.set(x, y, 155);
      scene.add(mesh);
      activeEntities.push({ mesh, laneIdx, type, pType, highBarrier, passedSound: false, active: true });
    }

    // ==========================================
    // 5. GAME STATE, POWERUPS & STORAGE
    // ==========================================
    let gameState = 'HOME';
    let currentLane = 1;
    let jumpY = 0;
    let jumpVel = 0;
    let isJumping = false;
    let slideTimer = 0;
    let stumbleTimer = 0;

    let wheelieMeter = 40;
    let isHoldingWheelie = false;

    let score = 0;
    let fishCount = 0;
    let comboFish = 0;
    let currentLevelIdx = 0;

    let bestScore = parseInt(localStorage.getItem('cyberauto_best') || '0', 10);
    let fishBank = parseInt(localStorage.getItem('cyberauto_chai_bank') || '0', 10);
    let boostCount = parseInt(localStorage.getItem('cyberauto_boosts') || '3', 10);

    const activePowerups = {
      jetpack: 0,
      magnet: 0,
      sneakers: 0,
      shield: 0
    };

    let spawnTimer = 0;

    const homeScreen = document.getElementById('home-screen');
    const hud = document.getElementById('hud');
    const scoreEl = document.getElementById('score-el');
    const fishEl = document.getElementById('fish-el');
    const multBadge = document.getElementById('mult-badge');
    const wheelieBar = document.getElementById('wheelie-bar');
    const powerupBanners = document.getElementById('powerup-banners');
    const hudLevelTxt = document.getElementById('hud-level-txt');
    const hudBoosts = document.getElementById('hud-boosts');
    const homeBestEl = document.getElementById('home-best-el');
    const homeFishBankEl = document.getElementById('home-fish-bank');
    const boostCountBadge = document.getElementById('boost-count-badge');
    const homeEventLabel = document.getElementById('home-event-label');
    const eventToast = document.getElementById('event-toast');
    const modalBackdrop = document.getElementById('modal-backdrop');
    const modalContent = document.getElementById('modal-content');

    function syncHomeUI() {
      homeBestEl.textContent = bestScore;
      homeFishBankEl.textContent = fishBank;
      boostCountBadge.textContent = boostCount;
      hudBoosts.textContent = boostCount;
      const lvl = LEVELS[Settings.selectedEventIdx];
      homeEventLabel.textContent = `CAPYBARA DRIFT • ZONE ${lvl.id}: ${lvl.name}`;
      applyThemeVisuals(lvl);
    }

    function applyThemeVisuals(lvl) {
      document.body.style.background = lvl.bg;
      scene.fog.color.setHex(lvl.fogHex);
    }

    function showToast(msg) {
      eventToast.textContent = msg;
      eventToast.classList.add('show');
      setTimeout(() => eventToast.classList.remove('show'), 2300);
    }

    syncHomeUI();

    // ==========================================
    // 6. MOVEMENT & CONTROLS
    // ==========================================
    function switchLane(dir) {
      if (gameState !== 'PLAYING') return;
      const next = Math.max(0, Math.min(2, currentLane + dir));
      if (next !== currentLane) {
        currentLane = next;
        SoundFX.laneWhoosh();
      } else {
        triggerStumble();
      }
    }

    function triggerJump() {
      if (gameState !== 'PLAYING' || isJumping || activePowerups.jetpack > 0) return;
      isJumping = true;
      slideTimer = 0;
      const superJump = activePowerups.sneakers > 0;
      jumpVel = superJump ? 50 : 37;
      SoundFX.jumpWhoosh(superJump);
    }

    function triggerSlide() {
      if (gameState !== 'PLAYING') return;
      slideTimer = 0.65;
      if (isJumping) {
        jumpVel = -55;
      }
      SoundFX.slideRoll();
    }

    function triggerBoostShield() {
      if (gameState !== 'PLAYING' || activePowerups.shield > 0) return;
      if (boostCount > 0) {
        boostCount--;
        localStorage.setItem('cyberauto_boosts', boostCount);
        hudBoosts.textContent = boostCount;
        boostCountBadge.textContent = boostCount;
        activePowerups.shield = 8.0;
        SoundFX.autoHorn();
        showToast('🛺 HOLO-BUMPER SHIELD ACTIVE (8s)!');
      }
    }

    function triggerStumble() {
      SoundFX.stumbleAlert();
      if (stumbleTimer > 0) {
        triggerGameOver('Busted by Cyber-Traffic Enforcers after scraping the rail twice!');
      } else {
        stumbleTimer = 6.0;
        SoundFX.policeSiren();
        showToast('🚨 CYBER-COP LOCK-ON! WATCH THE RAILS!');
      }
    }

    let touchStartX = 0;
    let touchStartY = 0;
    let lastTapTime = 0;

    window.addEventListener('pointerdown', (e) => {
      if (e.target.closest('button') || e.target.closest('.dock-btn') || e.target.closest('.modal-card')) return;
      touchStartX = e.clientX;
      touchStartY = e.clientY;
      if (gameState === 'PLAYING') {
        isHoldingWheelie = true;
        const now = performance.now();
        if (now - lastTapTime < 260) {
          triggerBoostShield();
        }
        lastTapTime = now;
      }
    });

    window.addEventListener('pointerup', (e) => {
      isHoldingWheelie = false;
      if (gameState !== 'PLAYING') return;
      const dx = e.clientX - touchStartX;
      const dy = e.clientY - touchStartY;
      if (Math.abs(dx) > 28 && Math.abs(dx) > Math.abs(dy)) {
        switchLane(dx < 0 ? -1 : 1);
      } else if (Math.abs(dy) > 28 && Math.abs(dy) > Math.abs(dx)) {
        if (dy < 0) triggerJump();
        else triggerSlide();
      }
    });

    window.addEventListener('keydown', (e) => {
      if (e.code === 'Escape' || e.code === 'KeyP') {
        if (gameState === 'PLAYING') openPauseModal();
        else if (gameState === 'PAUSED') resumeGame();
      }
      if (gameState !== 'PLAYING') return;
      if (e.code === 'ArrowLeft' || e.code === 'KeyA') switchLane(-1);
      if (e.code === 'ArrowRight' || e.code === 'KeyD') switchLane(1);
      if (e.code === 'ArrowUp' || e.code === 'KeyW') triggerJump();
      if (e.code === 'ArrowDown' || e.code === 'KeyS') triggerSlide();
      if (e.code === 'KeyE') triggerBoostShield();
      if (e.code === 'Space') isHoldingWheelie = true;
    });

    window.addEventListener('keyup', (e) => {
      if (e.code === 'Space') isHoldingWheelie = false;
    });

    // ==========================================
    // 7. HOME, PAUSE, RESUME & MODAL HANDLERS
    // ==========================================
    function closeModal() {
      SoundFX.uiTap();
      modalBackdrop.classList.add('hidden');
    }

    function startGame() {
      SoundFX.autoHorn();
      score = 0;
      fishCount = 0;
      comboFish = 0;
      currentLane = 1;
      currentLevelIdx = Settings.selectedEventIdx;
      playerRig.position.set(0, 0, 0);
      playerRig.rotation.set(0, 0, 0);
      wheelieMeter = 45;
      jumpY = 0;
      isJumping = false;
      slideTimer = 0;
      stumbleTimer = 0;
      activePowerups.jetpack = 0;
      activePowerups.magnet = 0;
      activePowerups.sneakers = 0;
      activePowerups.shield = 0;

      activeEntities.forEach(ent => scene.remove(ent.mesh));
      activeEntities.length = 0;

      applyThemeVisuals(LEVELS[currentLevelIdx]);
      hudLevelTxt.textContent = `ZONE ${LEVELS[currentLevelIdx].id} • ${LEVELS[currentLevelIdx].name}`;

      homeScreen.classList.add('hidden');
      modalBackdrop.classList.add('hidden');
      hud.classList.remove('hidden');
      gameState = 'PLAYING';
      showToast(`🛺 ${LEVELS[currentLevelIdx].name} — FULL THROTTLE!`);
    }

    function resumeGame() {
      SoundFX.uiTap();
      modalBackdrop.classList.add('hidden');
      gameState = 'PLAYING';
    }

    function returnToHome() {
      SoundFX.uiTap();
      activeEntities.forEach(ent => scene.remove(ent.mesh));
      activeEntities.length = 0;
      playerRig.position.set(0, 0, 0);
      bikeWheelieRig.rotation.set(0, 0, 0.35);
      hud.classList.add('hidden');
      modalBackdrop.classList.add('hidden');
      homeScreen.classList.remove('hidden');
      gameState = 'HOME';
      syncHomeUI();
    }

    function openPauseModal() {
      if (gameState !== 'PLAYING') return;
      gameState = 'PAUSED';
      isHoldingWheelie = false;
      SoundFX.popupOpen();
      modalContent.innerHTML = `
        <h2>⏸️ AUTO-METER PAUSED</h2>
        <p>Current Score: ${Math.floor(score)} | Cutting Chai: ${fishCount}</p>
        <div class="setting-row">
          <span>🔊 Horn & Movement SFX</span>
          <button class="btn blue" id="tog-sfx" style="padding:4px 12px; font-size:12px;">${Settings.sfx ? 'ON' : 'OFF'}</button>
        </div>
        <div class="setting-row">
          <span>🎵 2-Stroke Engine & Loops</span>
          <button class="btn blue" id="tog-loops" style="padding:4px 12px; font-size:12px;">${Settings.loops ? 'ON' : 'OFF'}</button>
        </div>
        <div class="modal-btn-col" style="margin-top:14px;">
          <button class="btn green" id="btn-resume-now">▶️ RESUME DRIFT</button>
          <button class="btn blue" id="btn-restart-now">🔄 RESTART</button>
          <button class="btn" id="btn-quit-home">🏠 HOME MENU</button>
        </div>
      `;
      modalBackdrop.classList.remove('hidden');

      document.getElementById('tog-sfx').onclick = (e) => {
        Settings.sfx = !Settings.sfx;
        e.target.textContent = Settings.sfx ? 'ON' : 'OFF';
        SoundFX.uiTap();
      };
      document.getElementById('tog-loops').onclick = (e) => {
        Settings.loops = !Settings.loops;
        e.target.textContent = Settings.loops ? 'ON' : 'OFF';
        SoundFX.uiTap();
      };
      document.getElementById('btn-resume-now').onclick = resumeGame;
      document.getElementById('btn-restart-now').onclick = startGame;
      document.getElementById('btn-quit-home').onclick = returnToHome;
    }

    function openSettingsModal() {
      SoundFX.popupOpen();
      modalContent.innerHTML = `
        <h2>⚙️ GARAGE SETTINGS</h2>
        <div class="setting-row">
          <span>🔊 Auto Horn & Drift Audio</span>
          <button class="btn blue" id="set-sfx" style="padding:4px 12px; font-size:12px;">${Settings.sfx ? 'ON' : 'OFF'}</button>
        </div>
        <div class="setting-row">
          <span>🎵 2-Stroke Engine & Loops</span>
          <button class="btn blue" id="set-loops" style="padding:4px 12px; font-size:12px;">${Settings.loops ? 'ON' : 'OFF'}</button>
        </div>
        <div class="setting-row">
          <span>📳 Haptic Vibration</span>
          <button class="btn blue" id="set-vib" style="padding:4px 12px; font-size:12px;">${Settings.vibration ? 'ON' : 'OFF'}</button>
        </div>
        <p style="margin-top:10px;">Hold screen to tilt Auto on 2 wheels (2x Score)! Double-tap for Holo-Bumper Shield!</p>
        <div class="modal-btn-col">
          <button class="btn green" id="close-settings-btn">✔️ DONE</button>
        </div>
      `;
      modalBackdrop.classList.remove('hidden');

      document.getElementById('set-sfx').onclick = (e) => {
        Settings.sfx = !Settings.sfx;
        e.target.textContent = Settings.sfx ? 'ON' : 'OFF';
        SoundFX.uiTap();
      };
      document.getElementById('set-loops').onclick = (e) => {
        Settings.loops = !Settings.loops;
        e.target.textContent = Settings.loops ? 'ON' : 'OFF';
        SoundFX.uiTap();
      };
      document.getElementById('set-vib').onclick = (e) => {
        Settings.vibration = !Settings.vibration;
        e.target.textContent = Settings.vibration ? 'ON' : 'OFF';
        SoundFX.uiTap();
      };
      document.getElementById('close-settings-btn').onclick = closeModal;
    }

    function openLevelsModal() {
      SoundFX.popupOpen();
      const itemsHtml = LEVELS.map((lvl, idx) => `
        <div class="level-item ${Settings.selectedEventIdx === idx ? 'active' : ''}" data-idx="${idx}">
          <div>
            <div style="color:#ffbe0b; font-size:13px;">ZONE ${lvl.id}: ${lvl.name}</div>
            <div style="font-size:10px; color:#ccc; font-family:monospace;">${lvl.desc}</div>
          </div>
          <span style="font-size:12px; color:#00f5d4;">${Settings.selectedEventIdx === idx ? 'ACTIVE' : 'SELECT'}</span>
        </div>
      `).join('');

      modalContent.innerHTML = `
        <h2>🌆 CYBERPUNK ZONES</h2>
        <p>Select your starting Maglev Line (zones also upgrade automatically as your meter climbs!):</p>
        <div>${itemsHtml}</div>
        <div class="modal-btn-col" style="margin-top:12px;">
          <button class="btn green" id="close-lvl-btn">✔️ LOCK ZONE</button>
        </div>
      `;
      modalBackdrop.classList.remove('hidden');

      modalContent.querySelectorAll('.level-item').forEach(el => {
        el.onclick = () => {
          Settings.selectedEventIdx = parseInt(el.dataset.idx, 10);
          SoundFX.autoHorn();
          syncHomeUI();
          openLevelsModal();
        };
      });
      document.getElementById('close-lvl-btn').onclick = closeModal;
    }

    function openShopModal() {
      SoundFX.popupOpen();
      modalContent.innerHTML = `
        <h2>🛠️ CHAI & AUTO GARAGE</h2>
        <p>☕ Cutting Chai Bank: <strong>${fishBank}</strong></p>
        <div class="setting-row">
          <span>🛺 Holo-Bumper Shield (+1)</span>
          <button class="btn green" id="buy-boost" style="padding:6px 12px; font-size:12px;">25 ☕</button>
        </div>
        <div class="setting-row">
          <span>🎁 Neon Mystery Crate</span>
          <button class="btn blue" id="buy-mystery" style="padding:6px 12px; font-size:12px;">40 ☕</button>
        </div>
        <div class="modal-btn-col" style="margin-top:14px;">
          <button class="btn" id="close-shop-btn">CLOSE</button>
        </div>
      `;
      modalBackdrop.classList.remove('hidden');

      document.getElementById('buy-boost').onclick = () => {
        if (fishBank >= 25) {
          fishBank -= 25;
          boostCount++;
          localStorage.setItem('cyberauto_chai_bank', fishBank);
          localStorage.setItem('cyberauto_boosts', boostCount);
          SoundFX.autoHorn();
          syncHomeUI();
          openShopModal();
        } else {
          SoundFX.stumbleAlert();
        }
      };
      document.getElementById('buy-mystery').onclick = () => {
        if (fishBank >= 40) {
          fishBank -= 40;
          const bonusBoosts = 1 + Math.floor(Math.random() * 3);
          boostCount += bonusBoosts;
          localStorage.setItem('cyberauto_chai_bank', fishBank);
          localStorage.setItem('cyberauto_boosts', boostCount);
          SoundFX.mysteryBoxFanfare();
          syncHomeUI();
          openShopModal();
        } else {
          SoundFX.stumbleAlert();
        }
      };
      document.getElementById('close-shop-btn').onclick = closeModal;
    }

    function openInfoModal(title, bodyText) {
      SoundFX.popupOpen();
      modalContent.innerHTML = `
        <h2>${title}</h2>
        <p>${bodyText}</p>
        <div class="modal-btn-col">
          <button class="btn green" id="info-ok-btn">CHILL! 🍊</button>
        </div>
      `;
      modalBackdrop.classList.remove('hidden');
      document.getElementById('info-ok-btn').onclick = closeModal;
    }

    function triggerGameOver(reason) {
      if (activePowerups.shield > 0) {
        activePowerups.shield = 0;
        SoundFX.landImpact();
        showToast('🛡️ HOLO-BUMPER SAVED YOUR AUTO!');
        return;
      }
      gameState = 'GAMEOVER';
      isHoldingWheelie = false;
      SoundFX.wipeoutCatch();

      fishBank += fishCount;
      localStorage.setItem('cyberauto_chai_bank', fishBank);

      if (Math.floor(score) > bestScore) {
        bestScore = Math.floor(score);
        localStorage.setItem('cyberauto_best', bestScore);
      }

      modalContent.innerHTML = `
        <h2>💥 AUTO FLIPPED!</h2>
        <p>${reason}<br><br>
        <strong>Meter Fare: ${Math.floor(score)}</strong> (Best: ${bestScore})<br>
        ☕ Cutting Chai Collected: +${fishCount} (Bank: ${fishBank})</p>
        <div class="modal-btn-col">
          <button class="btn green" id="go-retry-btn">🔄 DRIFT AGAIN</button>
          <button class="btn blue" id="go-home-btn">🏠 HOME GARAGE</button>
        </div>
      `;
      modalBackdrop.classList.remove('hidden');
      document.getElementById('go-retry-btn').onclick = startGame;
      document.getElementById('go-home-btn').onclick = returnToHome;
    }

    document.getElementById('tap-to-play-zone').onclick = startGame;
    document.getElementById('btn-pause').onclick = openPauseModal;
    document.getElementById('btn-home-settings').onclick = openSettingsModal;
    document.getElementById('btn-levels').onclick = openLevelsModal;
    document.getElementById('btn-shop').onclick = openShopModal;
    document.getElementById('btn-missions').onclick = () => openInfoModal(
      '📋 CAPYBARA CONTRACTS',
      '1. Hold 2-Wheel Auto-Tilt in the Gold Zone for 5s (2x Fare)<br>2. Collect 15 Cutting Chai glasses in one run<br>3. Reach 1,000 pts to unlock SOLAR FLARE FOUNDRY!'
    );
    document.getElementById('btn-daily').onclick = () => openInfoModal(
      '🍊 DAILY CHAI CHALLENGE',
      'Grab a Neon Mystery Crate on the Maglev rails to trigger Nitro Flight, Chai Magnet, or Hydraulic Bounce Springs!'
    );
    document.getElementById('btn-boost-info').onclick = () => openInfoModal(
      '🛺 HOLO-BUMPER SHIELDS',
      `You have ${boostCount} Holo-Bumpers! Double-tap anywhere while driving (or press E) for 8 seconds of crash protection!`
    );
    document.getElementById('btn-me').onclick = () => {
      SoundFX.autoHorn();
      openInfoModal(
        '🐹 CAPYBARA DRIVER PROFILE',
        'Headgear: Lucky Yuzu Tangerine + Cyber Visor Shades<br>Ride: Twin-Rocket Yellow & Green Cyber-Auto<br>Vibe: 100% Unbothered at 300 km/h'
      );
    };

    // ==========================================
    // 8. MAIN ANIMATION & GAME LOOP
    // ==========================================
    const clock = new THREE.Clock();

    function updatePowerupHUD() {
      const tags = [];
      if (activePowerups.jetpack > 0) tags.push(`<span class="p-tag" style="background:#ff6d00">🚀 NITRO FLIGHT ${Math.ceil(activePowerups.jetpack)}s</span>`);
      if (activePowerups.magnet > 0) tags.push(`<span class="p-tag" style="background:#00b4d8">🧲 CHAI MAGNET ${Math.ceil(activePowerups.magnet)}s</span>`);
      if (activePowerups.sneakers > 0) tags.push(`<span class="p-tag" style="background:#38b000">🔩 HYDRAULICS ${Math.ceil(activePowerups.sneakers)}s</span>`);
      if (activePowerups.shield > 0) tags.push(`<span class="p-tag" style="background:#7209b7">🛺 BUMPER ${Math.ceil(activePowerups.shield)}s</span>`);
      if (stumbleTimer > 0) tags.push(`<span class="p-tag" style="background:#d00000">🚨 CYBER-COP ${Math.ceil(stumbleTimer)}s</span>`);
      powerupBanners.innerHTML = tags.join('');
    }

    function animate() {
      requestAnimationFrame(animate);
      const delta = Math.min(clock.getDelta(), 0.1);
      const elapsed = clock.getElapsedTime();

      // Dynamic Camera: Orbiting Capybara & Auto on HOME, Chase Cam in PLAYING
      if (gameState === 'HOME') {
        const camX = Math.sin(elapsed * 0.55) * 9 + 17;
        camera.position.lerp(new THREE.Vector3(camX, 17, 20), delta * 4);
        camera.lookAt(0, 10, -2);
        // Iconic 2-Wheel Side-Tilt ("Auto-Skiing") showcase on Home Screen!
        bikeWheelieRig.rotation.z = 0.36 + Math.sin(elapsed * 3) * 0.05;
        bikeWheelieRig.rotation.x = -0.10;
      } else {
        camera.position.lerp(new THREE.Vector3(0, 26, -38), delta * 6);
        camera.lookAt(0, 8, 12);
      }

      if (gameState === 'PLAYING') {
        ['jetpack', 'magnet', 'sneakers', 'shield'].forEach(k => {
          if (activePowerups[k] > 0) activePowerups[k] = Math.max(0, activePowerups[k] - delta);
        });
        if (stumbleTimer > 0) stumbleTimer = Math.max(0, stumbleTimer - delta);
        if (slideTimer > 0) slideTimer = Math.max(0, slideTimer - delta);
        updatePowerupHUD();

        // 2-Wheel Side-Tilt ("Auto-Skiing") Balance Physics
        if (isHoldingWheelie) {
          wheelieMeter += delta * 56;
        } else {
          wheelieMeter -= delta * 36;
        }
        wheelieMeter = Math.max(0, wheelieMeter);

        if (wheelieMeter >= 100) {
          wheelieMeter = 70;
          triggerGameOver('You tilted the Cyber-Auto past 90 degrees and rolled off the Maglev!');
          return;
        }

        const inSweetSpot = wheelieMeter >= 55 && wheelieMeter <= 85;
        const mult = (inSweetSpot ? 2 : 1) * (currentLevelIdx + 1);
        multBadge.textContent = `${mult}x`;
        wheelieBar.style.width = `${Math.min(100, wheelieMeter)}%`;
        wheelieBar.style.background = wheelieMeter > 85 ? '#ff007f' : (inSweetSpot ? '#ffbe0b' : '#00f5d4');

        score += delta * 18 * mult;
        scoreEl.textContent = Math.floor(score);
        fishEl.textContent = fishCount;

        for (let i = LEVELS.length - 1; i >= 0; i--) {
          if (score >= LEVELS[i].minScore && i > currentLevelIdx) {
            currentLevelIdx = i;
            const newLvl = LEVELS[currentLevelIdx];
            applyThemeVisuals(newLvl);
            hudLevelTxt.textContent = `ZONE ${newLvl.id} • ${newLvl.name}`;
            SoundFX.autoHorn();
            showToast(`🌆 ZONE ${newLvl.id}: ${newLvl.name}!`);
            break;
          }
        }

        const targetX = LANES[currentLane];
        const targetBaseY = LANE_Y[currentLane];
        playerRig.position.x = THREE.MathUtils.lerp(playerRig.position.x, targetX, delta * 13);

        if (activePowerups.jetpack > 0) {
          jumpY = THREE.MathUtils.lerp(jumpY, 14, delta * 8);
          isJumping = false;
        } else if (isJumping) {
          jumpY += jumpVel * delta;
          jumpVel -= 95 * delta;
          if (jumpY <= 0) {
            jumpY = 0;
            isJumping = false;
            SoundFX.landImpact();
          }
        } else {
          jumpY = THREE.MathUtils.lerp(jumpY, 0, delta * 10);
        }

        playerRig.position.y = THREE.MathUtils.lerp(playerRig.position.y, targetBaseY, delta * 12) + jumpY;

        // Low-rider squash when ducking under laser gates
        const targetScaleY = slideTimer > 0 ? 0.55 : 1.0;
        bikeWheelieRig.scale.y = THREE.MathUtils.lerp(bikeWheelieRig.scale.y, targetScaleY, delta * 16);

        // Tilt the Auto-Rickshaw sideways onto 2 wheels (Z-axis roll) + slight nose lift!
        bikeWheelieRig.rotation.z = (wheelieMeter / 100) * 0.78;
        bikeWheelieRig.rotation.x = -(wheelieMeter / 100) * 0.25;

        const currentLvlObj = LEVELS[currentLevelIdx];
        spawnTimer -= delta;
        if (spawnTimer <= 0) {
          spawnWave(currentLvlObj);
          spawnTimer = Math.max(0.42, 1.08 - currentLevelIdx * 0.1);
        }

        const speed = (78 + currentLevelIdx * 12) * (activePowerups.jetpack > 0 ? 1.45 : 1.0);
        updateContinuousAudioLoops(delta, speed, activePowerups, currentLvlObj);

        for (let i = activeEntities.length - 1; i >= 0; i--) {
          const ent = activeEntities[i];
          ent.mesh.position.z -= speed * delta;
          if (ent.type !== 'obstacle') ent.mesh.rotation.y += delta * 3.5;

          if (ent.active && ent.type === 'fish' && activePowerups.magnet > 0 && ent.mesh.position.z < 55) {
            ent.mesh.position.x = THREE.MathUtils.lerp(ent.mesh.position.x, playerRig.position.x, delta * 9);
            ent.mesh.position.y = THREE.MathUtils.lerp(ent.mesh.position.y, playerRig.position.y + 5, delta * 9);
          }

          if (!ent.passedSound && ent.type === 'obstacle' && ent.mesh.position.z < -2) {
            ent.passedSound = true;
            SoundFX.trainFlyBy();
          }

          if (ent.active && ent.mesh.position.z < 4.2 && ent.mesh.position.z > -6.2) {
            const xDist = Math.abs(playerRig.position.x - ent.mesh.position.x);
            if (xDist < 3.6) {
              if (ent.type === 'fish') {
                ent.active = false;
                fishCount++;
                comboFish++;
                score += 50 * mult;
                SoundFX.chaiClink(comboFish);
                scene.remove(ent.mesh);
              } else if (ent.type === 'powerup') {
                ent.active = false;
                scene.remove(ent.mesh);
                let chosen = ent.pType;
                if (chosen === 'mystery') {
                  SoundFX.mysteryBoxFanfare();
                  const pool = ['jetpack', 'magnet', 'sneakers', 'shield'];
                  chosen = pool[Math.floor(Math.random() * pool.length)];
                } else {
                  SoundFX.autoHorn();
                }
                activePowerups[chosen] = 9.0;
                const labels = {
                  jetpack: '🚀 NITRO FLIGHT',
                  magnet: '🧲 CHAI MAGNET',
                  sneakers: '🔩 HYDRAULIC SPRINGS',
                  shield: '🛺 HOLO-BUMPER'
                };
                showToast(`${labels[chosen] || chosen} ACTIVE!`);
              } else if (ent.type === 'obstacle' && activePowerups.jetpack <= 0) {
                const hitHigh = ent.highBarrier && slideTimer <= 0;
                const hitLow = !ent.highBarrier && jumpY < 4.5;
                if (hitHigh || hitLow) {
                  ent.active = false;
                  scene.remove(ent.mesh);
                  triggerGameOver(ent.highBarrier ? 'Clipped an overhead Neon Toll Laser! (Swipe Down to Duck!)' : 'Smashed into a Cyber-Cop Barricade! (Swipe Up to Bunny-Hop!)');
                  return;
                }
              }
            }
          }

          if (ent.mesh.position.z < -45) {
            scene.remove(ent.mesh);
            activeEntities.splice(i, 1);
          }
        }
      }

      if (gameState !== 'PAUSED') {
        masterRig.position.y = Math.sin(elapsed * 2.5) * 0.35;
        rearWheel.rotation.x += delta * 20;
        frontWheel.rotation.x += delta * 20;

        scarfVoxels.forEach(({ mesh, index }) => {
          mesh.position.y = 10 + Math.sin(elapsed * 18 - index * 0.6) * (0.16 * index);
        });

        flameVoxels.forEach(f => {
          const s = (0.75 + Math.sin(elapsed * 28 + f.phase) * 0.25) * (activePowerups.jetpack > 0 ? 1.5 : 1.0);
          f.mesh.scale.set(s, s, s);
        });

        clouds.forEach(c => {
          c.group.position.z -= c.speed * delta;
          if (c.group.position.z < -90) c.group.position.z = 130;
        });

        speedLines.forEach(line => {
          line.mesh.position.z -= line.speed * delta;
          if (line.mesh.position.z < -70) line.mesh.position.z = 110;
        });
      }

      renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    animate();
  </script>
</body>
</html>
