<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Cyber-Auto: Neon Velocity</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Outfit:wght@700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --neon-cyan: #00f5d4;
      --neon-pink: #ff007f;
      --neon-gold: #ffbe0b;
      --glass-bg: rgba(10, 14, 32, 0.68);
      --glass-border: rgba(0, 245, 212, 0.42);
      --bpm-scale: 1;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      overflow: hidden;
      background: #050716;
      font-family: 'Outfit', system-ui, -apple-system, sans-serif;
      color: #fff;
    }
    #canvas-container {
      width: 100vw;
      height: 100vh;
      display: block;
    }

    /* =================================================================
       2026 DYNAMIC CYBER-ISLAND HUD (TOP CENTER MORPHING PILL)
       ================================================================= */
    #hud {
      position: absolute;
      top: max(12px, env(safe-area-inset-top));
      left: 12px;
      right: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      pointer-events: none;
      z-index: 15;
    }
    #hud.hidden { display: none; }

    .hud-top-row {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    /* Morphing Dynamic Island Pill */
    #dynamic-island {
      flex: 1;
      max-width: 340px;
      margin: 0 auto;
      background: var(--glass-bg);
      backdrop-filter: blur(20px) saturate(190%);
      -webkit-backdrop-filter: blur(20px) saturate(190%);
      border: 1.5px solid var(--glass-border);
      box-shadow: 0 8px 28px rgba(0, 0, 0, 0.55), 0 0 18px rgba(0, 245, 212, 0.25), inset 0 1px 0 rgba(255, 255, 255, 0.25);
      border-radius: 999px;
      padding: 7px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      pointer-events: auto;
      transform: scale(var(--bpm-scale));
      transition: border-color 0.3s ease, box-shadow 0.3s ease, transform 0.08s ease;
    }

    .island-left {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .mult-orb {
      background: linear-gradient(135deg, #00f5d4 0%, #00bbf9 100%);
      color: #03071e;
      font-family: 'Fredoka', sans-serif;
      font-size: 13px;
      font-weight: 700;
      padding: 3px 9px;
      border-radius: 999px;
      box-shadow: 0 0 12px rgba(0, 245, 212, 0.7);
    }
    .zone-micro-tag {
      font-size: 10px;
      font-weight: 800;
      color: rgba(255, 255, 255, 0.75);
      letter-spacing: 0.8px;
      text-transform: uppercase;
    }

    /* Rolling Odometer Score Display */
    .island-score {
      font-family: 'Fredoka', sans-serif;
      font-size: 26px;
      font-weight: 700;
      letter-spacing: 0.5px;
      color: #ffffff;
      text-shadow: 0 2px 10px rgba(255, 0, 127, 0.75);
      font-variant-numeric: tabular-nums;
      transition: transform 0.08s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .island-score.bump {
      transform: scale(1.18);
      color: #ffbe0b;
    }

    .island-right {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      font-weight: 800;
      color: #ffbe0b;
    }

    .glass-pause-btn {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: var(--glass-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1.5px solid rgba(255, 255, 255, 0.3);
      color: #fff;
      font-weight: 900;
      font-size: 14px;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      pointer-events: auto;
      box-shadow: 0 6px 18px rgba(0,0,0,0.45);
    }
    .glass-pause-btn:active { transform: scale(0.92); }

    /* Sub-Island Morphing Power-Up & Proximity Pills */
    #powerup-banners {
      display: flex;
      gap: 6px;
      margin-top: 8px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .spatial-pill {
      background: rgba(12, 16, 36, 0.82);
      backdrop-filter: blur(12px);
      border: 1.5px solid #00f5d4;
      border-radius: 999px;
      padding: 4px 12px;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.6px;
      color: #fff;
      text-transform: uppercase;
      box-shadow: 0 4px 14px rgba(0,0,0,0.4);
      animation: popIn 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    @keyframes popIn {
      from { transform: scale(0.6); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    /* =================================================================
       2026 SPATIAL HOME SCREEN (THUMB-ZONE ARC + 360° TURNTABLE)
       ================================================================= */
    #home-screen {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: max(14px, env(safe-area-inset-top)) 16px max(20px, env(safe-area-inset-bottom)) 16px;
      z-index: 25;
      pointer-events: none;
    }
    #home-screen.hidden { display: none; }

    /* Minimalist Top Status Pill */
    .home-top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      pointer-events: auto;
    }
    .currency-glass-pill {
      background: var(--glass-bg);
      backdrop-filter: blur(18px) saturate(180%);
      border: 1.5px solid var(--glass-border);
      border-radius: 999px;
      padding: 6px 14px;
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 12px;
      font-weight: 800;
      color: #fff;
      box-shadow: 0 6px 20px rgba(0,0,0,0.45);
    }
    .currency-glass-pill span {
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .brand-header {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      margin-top: 1vh;
      pointer-events: none;
    }
    .logo-badge {
      width: 58px;
      height: 58px;
      border-radius: 16px;
      border: 2px solid #00f5d4;
      box-shadow: 0 0 18px rgba(0, 245, 212, 0.65);
      margin-bottom: 6px;
      object-fit: cover;
    }
    .Zone-pill-badge {
      background: rgba(255, 0, 127, 0.22);
      border: 1px solid #ff007f;
      color: #ff99c8;
      padding: 3px 12px;
      border-radius: 999px;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      margin-bottom: 6px;
    }
    .modern-title {
      font-family: 'Fredoka', sans-serif;
      font-size: clamp(30px, 8.5vw, 44px);
      line-height: 0.96;
      color: #ffffff;
      text-transform: uppercase;
      text-shadow: 0 4px 20px rgba(0, 245, 212, 0.55);
      letter-spacing: 0.5px;
    }
    .modern-title .sub-glow {
      display: block;
      font-size: clamp(22px, 6.2vw, 32px);
      background: linear-gradient(90deg, #00f5d4 0%, #ffbe0b 50%, #ff007f 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 2px 10px rgba(255, 0, 127, 0.45));
    }

    /* Interactive 360° Turntable Drag Zone in the Middle */
    #turntable-drag-zone {
      flex: 1;
      width: 100%;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: center;
      padding-bottom: 14px;
      pointer-events: auto;
      cursor: grab;
    }
    .turntable-hint {
      background: rgba(8, 12, 28, 0.55);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 999px;
      padding: 4px 12px;
      font-size: 10px;
      font-weight: 700;
      color: rgba(255, 255, 255, 0.8);
      letter-spacing: 0.8px;
      margin-bottom: 12px;
    }

    /* Lower 35% Thumb-Zone Ergonomic Controls */
    .thumb-zone-footer {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      width: 100%;
      pointer-events: auto;
    }

    .launch-run-btn {
      width: 100%;
      max-width: 310px;
      background: linear-gradient(135deg, #00f5d4 0%, #00bbf9 50%, #7209b7 100%);
      border: 2px solid #ffffff;
      border-radius: 999px;
      padding: 15px 28px;
      font-family: 'Fredoka', sans-serif;
      font-size: 20px;
      font-weight: 700;
      color: #03071e;
      letter-spacing: 1px;
      text-align: center;
      box-shadow: 0 8px 25px rgba(0, 245, 212, 0.55), inset 0 2px 0 rgba(255, 255, 255, 0.6);
      cursor: pointer;
      transform: scale(var(--bpm-scale));
      transition: transform 0.08s ease;
    }
    .launch-run-btn:active { transform: scale(0.95); }

    /* Floating Glass Bottom Dock */
    .floating-glass-dock {
      display: flex;
      justify-content: center;
      gap: 10px;
      width: 100%;
      max-width: 360px;
      background: var(--glass-bg);
      backdrop-filter: blur(20px) saturate(190%);
      -webkit-backdrop-filter: blur(20px) saturate(190%);
      border: 1.5px solid var(--glass-border);
      border-radius: 24px;
      padding: 8px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.6);
    }
    .dock-pill-item {
      flex: 1;
      border-radius: 16px;
      padding: 8px 6px;
      text-align: center;
      cursor: pointer;
      transition: background 0.2s ease, transform 0.1s ease;
    }
    .dock-pill-item:active {
      background: rgba(0, 245, 212, 0.18);
      transform: scale(0.94);
    }
    .dock-pill-icon { font-size: 18px; display: block; margin-bottom: 2px; }
    .dock-pill-txt {
      font-size: 10px;
      font-weight: 800;
      color: #e2e8f0;
      letter-spacing: 0.6px;
      text-transform: uppercase;
    }

    /* =================================================================
       SWIPE-TO-DISMISS BOTTOM DRAWER SHEETS (NO TINY 'X' BUTTONS)
       ================================================================= */
    .modal-backdrop {
      position: absolute;
      inset: 0;
      background: rgba(3, 5, 14, 0.72);
      backdrop-filter: blur(8px);
      display: flex;
      justify-content: center;
      align-items: flex-end;
      z-index: 30;
      transition: opacity 0.25s ease;
    }
    .modal-backdrop.hidden { display: none; }

    .bottom-sheet-card {
      background: linear-gradient(180deg, rgba(18, 24, 52, 0.94) 0%, rgba(7, 10, 24, 0.98) 100%);
      backdrop-filter: blur(24px) saturate(200%);
      border-top: 2px solid #00f5d4;
      box-shadow: 0 -10px 40px rgba(0, 245, 212, 0.35);
      border-radius: 28px 28px 0 0;
      padding: 12px 22px max(24px, env(safe-area-inset-bottom)) 22px;
      width: 100%;
      max-width: 440px;
      text-align: center;
      max-height: 84vh;
      overflow-y: auto;
      animation: slideUpSheet 0.28s cubic-bezier(0.16, 1, 0.3, 1);
    }
    @keyframes slideUpSheet {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }
    .sheet-drag-handle {
      width: 44px;
      height: 5px;
      background: rgba(255, 255, 255, 0.3);
      border-radius: 999px;
      margin: 0 auto 14px auto;
    }
    .bottom-sheet-card h2 {
      font-family: 'Fredoka', sans-serif;
      color: #ffbe0b;
      font-size: 21px;
      margin-bottom: 8px;
      letter-spacing: 0.5px;
    }
    .bottom-sheet-card p {
      font-size: 13px;
      color: #cbd5e1;
      line-height: 1.5;
      margin-bottom: 16px;
    }
    .sheet-btn-col { display: flex; flex-direction: column; gap: 10px; }
    .sheet-btn {
      background: linear-gradient(135deg, #00f5d4 0%, #00bbf9 100%);
      color: #03071e;
      border: none;
      padding: 13px 20px;
      font-family: 'Fredoka', sans-serif;
      font-size: 15px;
      font-weight: 700;
      border-radius: 16px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(0, 245, 212, 0.4);
    }
    .sheet-btn.pink {
      background: linear-gradient(135deg, #ff007f 0%, #7209b7 100%);
      color: #fff;
      box-shadow: 0 4px 15px rgba(255, 0, 127, 0.4);
    }
    .sheet-btn.ghost {
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.2);
      box-shadow: none;
    }
    .setting-row, .level-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(0, 245, 212, 0.28);
      padding: 10px 14px;
      border-radius: 14px;
      margin-bottom: 8px;
      font-size: 13px;
      font-weight: 700;
      text-align: left;
    }
    .level-item.active {
      border: 2px solid #00f5d4;
      background: rgba(0, 245, 212, 0.14);
    }
    .livery-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 14px;
    }
    .livery-swatch {
      background: rgba(255,255,255,0.06);
      border: 2px solid rgba(255,255,255,0.18);
      border-radius: 14px;
      padding: 10px 6px;
      cursor: pointer;
      font-size: 11px;
      font-weight: 800;
      color: #fff;
    }
    .livery-swatch.active { border-color: #00f5d4; background: rgba(0, 245, 212, 0.18); }

    /* FLOATING POPUPS & TOAST */
    #floating-popups {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 16;
      overflow: hidden;
    }
    .combo-pop {
      position: absolute;
      left: 50%;
      top: 52%;
      font-family: 'Fredoka', sans-serif;
      font-size: 24px;
      font-weight: 700;
      color: #ffbe0b;
      text-shadow: 0 3px 12px rgba(255, 0, 127, 0.9);
      animation: floatUpFade 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    @keyframes floatUpFade {
      0% { transform: translate(-50%, 0) scale(0.6); opacity: 1; }
      50% { transform: translate(-50%, -38px) scale(1.2); opacity: 1; }
      100% { transform: translate(-50%, -72px) scale(0.95); opacity: 0; }
    }
    #event-toast {
      position: absolute;
      top: 96px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--glass-bg);
      backdrop-filter: blur(16px);
      border: 1.5px solid #00f5d4;
      padding: 7px 18px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 800;
      color: #ffbe0b;
      z-index: 18;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.25s ease;
      white-space: nowrap;
    }
    #event-toast.show { opacity: 1; }
  </style>

  <script src="three.min.js" onerror="this.onerror=null;this.src='https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js';"></script>
  <script src="CopyShader.js" onerror="this.onerror=null;this.src='https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js';"></script>
  <script src="LuminosityHighPassShader.js" onerror="this.onerror=null;this.src='https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js';"></script>
  <script src="EffectComposer.js" onerror="this.onerror=null;this.src='https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js';"></script>
  <script src="RenderPass.js" onerror="this.onerror=null;this.src='https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js';"></script>
  <script src="ShaderPass.js" onerror="this.onerror=null;this.src='https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js';"></script>
  <script src="UnrealBloomPass.js" onerror="this.onerror=null;this.src='https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js';"></script>
</head>
<body>

  <!-- 2026 SPATIAL HOME SCREEN -->
  <div id="home-screen">
    <div class="home-top-bar">
      <div class="currency-glass-pill">
        <span>🏆 <strong id="home-best-el">765</strong></span>
        <span>☕ <strong id="home-fish-bank">12</strong></span>
        <span>🛡️ <strong id="boost-count-badge">3</strong></span>
      </div>
      <button class="glass-pause-btn" id="btn-home-settings" title="Settings">⚙️</button>
    </div>

    <div class="brand-header">
      <img src="logo.png" alt="Cyber Capy Logo" class="logo-badge" onerror="this.style.display='none'">
      <div class="Zone-pill-badge" id="home-event-label">TN 41 CAPY 001 • ZONE 2: BIO-JUNGLE</div>
      <div class="modern-title">
        CYBER-AUTO
        <span class="sub-glow">NEON VELOCITY</span>
      </div>
    </div>

    <!-- 360° Interactive Turntable Drag Area -->
    <div id="turntable-drag-zone">
      <div class="turntable-hint">↺ DRAG TO SPIN 360° • SWIPE UP TO LAUNCH</div>

    <!-- Thumb-Zone Ergonomic Dock -->
    <div class="thumb-zone-footer">
      <button class="launch-run-btn" id="tap-to-play-zone">▶ TAP OR SWIPE UP TO DRIFT</button>

      <div class="floating-glass-dock">
        <div class="dock-pill-item" id="btn-levels">
          <span class="dock-pill-icon">🌆</span>
          <span class="dock-pill-txt">Zones</span>
        </div>
        <div class="dock-pill-item" id="btn-shop">
          <span class="dock-pill-icon">🎨</span>
          <span class="dock-pill-txt">Garage</span>
        </div>
        <div class="dock-pill-item" id="btn-missions">
          <span class="dock-pill-icon">📋</span>
          <span class="dock-pill-txt">Quests</span>
        </div>
        <div class="dock-pill-item" id="btn-me">
          <span class="dock-pill-icon">🐹</span>
          <span class="dock-pill-txt">Capy 001</span>

  <!-- 2026 DYNAMIC CYBER-ISLAND HUD -->
  <div id="hud" class="hidden">

        <div class="island-right">
          <span>☕ <strong id="fish-el">3</strong></span>
          <span>🛡️ <strong id="hud-boosts">3</strong></span>
        </div>
      </div>
      <button class="glass-pause-btn" id="btn-pause">||</button>
    </div>
    <div id="powerup-banners"></div>
  </div>

  <div id="floating-popups"></div>
  <div id="event-toast">CHAI FUELS LEGENDS!</div>

  <!-- SWIPE-DOWN BOTTOM DRAWER SHEET -->
  <div id="modal-backdrop" class="modal-backdrop hidden">
    <div class="bottom-sheet-card" id="modal-content"></div>
  </div>

  <div id="canvas-container"></div>

  <script>
    // =========================================================================
    // 1. 132 BPM SUBWAY GROOVE SEQUENCER + BPM UI PULSE + HAPTIC AUDIO
    // =========================================================================
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;

    const Settings = {
      bgm: true,
      sfx: true,
      loops: true,
      bloom: true,
      vibration: true,
      selectedEventIdx: 1,
      liveryIdx: 0
    };

    const LIVERIES = [
      { name: 'Classic Yellow', hex: 0xffbe0b, accent: '#ffbe0b' },
      { name: 'Tokyo Magenta', hex: 0xff007f, accent: '#ff007f' },
      { name: 'Hyper Cyan', hex: 0x00f5d4, accent: '#00f5d4' }
    ];

    function ensureAudio() {
      try {
        if (!audioCtx) audioCtx = new AudioCtx();
        if (audioCtx.state === 'suspended') audioCtx.resume();
      } catch (e) {}
    }

    let bpmPulseValue = 1.0;
    const SubwayBGM = {
      step: 0,
      accum: 0,
      stepDuration: 60 / 132 / 4,
      bassNotes: [110, 0, 110, 130.8, 146.8, 0, 146.8, 164.8, 130.8, 0, 130.8, 146.8, 164.8, 0, 196.0, 164.8],
      leadNotes: [440, 0, 523.2, 587.3, 659.2, 0, 587.3, 523.2, 440, 523.2, 659.2, 0, 784.0, 659.2, 587.3, 0],
      update(delta, isFast = false) {
        bpmPulseValue = THREE.MathUtils.lerp(bpmPulseValue, 1.0, delta * 14);
        document.documentElement.style.setProperty('--bpm-scale', bpmPulseValue.toFixed(3));

        if (!Settings.bgm || !audioCtx) return;
        this.accum += delta * (isFast ? 1.16 : 1.0);
        if (this.accum < this.stepDuration) return;
        this.accum -= this.stepDuration;

        const s = this.step % 16;
        // 4-on-the-floor Kick triggers BPM UI Pulse!
        if (s === 0 || s === 4 || s === 8 || s === 12) {
          bpmPulseValue = 1.035;
          SoundFX._tone(130, 'sine', 0.11, 36, 0.14);
        }
        if (s === 4 || s === 12) {
          this._playNoiseHit(0.08, 0.07);
          SoundFX._tone(210, 'triangle', 0.06, 110, 0.08);
        }
        if (s % 2 === 1) this._playNoiseHit(0.025, 0.03);
        const b = this.bassNotes[s];
        if (b > 0) SoundFX._tone(b, 'sawtooth', 0.09, b * 0.98, 0.055);
        const l = this.leadNotes[s];

        shader.uniforms.uCurveY = worldCurveUniforms.uCurveY;
        shader.uniforms.uCurveX = worldCurveUniforms.uCurveX;
        shader.vertexShader = `uniform float uCurveY;\nuniform float uCurveX;\n` + shader.vertexShader;
        shader.vertexShader = shader.vertexShader.replace(
          '#include <project_vertex>',
          `
          vec4 mvPosition = modelViewMatrix * vec4( transformed, 1.0 );
          float zDist = max(0.0, -mvPosition.z - 14.0);
          mvPosition.y += uCurveY * zDist * zDist;
          mvPosition.x += uCurveX * zDist * zDist;
          gl_Position = projectionMatrix * mvPosition;
          `
        );
      };
      return material;
    }

    // =========================================================================

    const cityStructures = [], cloudPuffs = [];
    (function buildRichCyberpunkWorld() {

    // =========================================================================
    // 7. NON-BLOWOUT CHAI CUPS, HOVER-PADS & OBSTACLES
    // =========================================================================
    const LANES = [-4.2, 0, 4.2];
    const LANE_Y = [-0.25, 0.45, -0.25];
    const activeEntities = [];
    const ambientHoverPads = [];

    const darkChassisMat = applySubwaySurfersCurveShader(new THREE.MeshStandardMaterial({ color: 0x151928, metalness: 0.75, roughness: 0.28 }));
    const cyanPadMat = applySubwaySurfersCurveShader(new THREE.MeshBasicMaterial({ color: 0x00f5d4 }));
    const pinkPadMat = applySubwaySurfersCurveShader(new THREE.MeshBasicMaterial({ color: 0xff007f }));

    (function buildSparseFloatingHoverPads() {
      for (let i = 0; i < 8; i++) {

        const side = i < 4 ? -1 : 1;
        const chassis = new THREE.Mesh(new THREE.BoxGeometry(4.8, 0.85, 4.8), darkChassisMat);

        glowPad.position.y = 0.48;
        pad.add(chassis, glowPad);
        pad.position.set(side * (11.5 + (i % 3) * 4.5), 1.5 + (i % 3) * 2.5, -180 + i * 26);

    // Rich Warm Masala Chai Material (Zero White Blowout!)
    const glassOuterMat = applySubwaySurfersCurveShader(new THREE.MeshStandardMaterial({ color: 0xd8f3dc, transparent: true, opacity: 0.42, roughness: 0.12 }));
    const chaiLiquidMat = applySubwaySurfersCurveShader(new THREE.MeshStandardMaterial({ color: 0xc87a28, roughness: 0.35, metalness: 0.1 }));
    const goldRimMat = applySubwaySurfersCurveShader(new THREE.MeshStandardMaterial({ color: 0xffbe0b, metalness: 0.6, roughness: 0.2 }));
    const steamWispMat = applySubwaySurfersCurveShader(new THREE.MeshBasicMaterial({ color: 0x99e6ff, transparent: true, opacity: 0.42 }));

    function createChaiCupMesh() {
      const g = new THREE.Group();
      const glassOuter = new THREE.Mesh(new THREE.CylinderGeometry(0.95, 0.7, 2.3, 18), glassOuterMat);
      const chaiLiquid = new THREE.Mesh(new THREE.CylinderGeometry(0.86, 0.64, 1.85, 16), chaiLiquidMat);
      chaiLiquid.position.y = -0.1;
      const foamRim = new THREE.Mesh(new THREE.CylinderGeometry(0.92, 0.90, 0.22, 16), goldRimMat);
      foamRim.position.y = 0.85;

      for (let s = 0; s < 2; s++) {
        const wisp = new THREE.Mesh(new THREE.TorusGeometry(0.28 + s * 0.1, 0.05, 8, 14, Math.PI), steamWispMat);
        wisp.position.set((s - 0.5) * 0.2, 1.55 + s * 0.55, 0);
        g.add(wisp);
      }
      g.add(glassOuter, chaiLiquid, foamRim);
      return g;
    }

    function createObstacleMesh(highBarrier = false, colorHex = 0xff007f) {
      const g = new THREE.Group();
      const glowMat = applySubwaySurfersCurveShader(new THREE.MeshBasicMaterial({ color: colorHex }));
      if (highBarrier) {
        const beam = new THREE.Mesh(new THREE.BoxGeometry(4.4, 1.5, 1.0), glowMat);
        beam.position.y = 6.8;
        const pL = new THREE.Mesh(new THREE.CylinderGeometry(0.22, 0.22, 7.2, 10), darkChassisMat); pL.position.set(-2.0, 3.6, 0);
        const pR = new THREE.Mesh(new THREE.CylinderGeometry(0.22, 0.22, 7.2, 10), darkChassisMat); pR.position.set(2.0, 3.6, 0);
        g.add(beam, pL, pR);
      } else {
        const base = new THREE.Mesh(new THREE.BoxGeometry(3.5, 0.95, 3.4), darkChassisMat); base.position.y = 0.8;
        const neonTop = new THREE.Mesh(new THREE.BoxGeometry(2.9, 0.42, 2.8), glowMat); neonTop.position.y = 1.38;
        g.add(base, neonTop);
      }
      return g;
    }

    function createPowerupMesh(pType) {
      const g = new THREE.Group();
      const colors = { jetpack: 0xff6d00, magnet: 0x00f5d4, sneakers: 0x38b000, mystery: 0xff007f };
      const c = colors[pType] || 0xffbe0b;
      const orbMat = applySubwaySurfersCurveShader(new THREE.MeshStandardMaterial({ color: c, roughness: 0.2, metalness: 0.6 }));
      const orb = new THREE.Mesh(new THREE.OctahedronGeometry(1.15, 1), orbMat);
      const ring = new THREE.Mesh(new THREE.TorusGeometry(1.55, 0.12, 10, 24), cyanPadMat);
      g.add(orb, ring);
      return g;
    }

    function spawnPickupBurst(worldPos, colorHex = 0xffbe0b) {
      const mat = new THREE.MeshBasicMaterial({ color: colorHex });
      for (let i = 0; i < 8; i++) {
        const p = new THREE.Mesh(new THREE.OctahedronGeometry(0.24, 0), mat);
        p.position.copy(worldPos);
        const angle = (i / 8) * Math.PI * 2;
        const vel = new THREE.Vector3(Math.cos(angle) * 8, 4 + Math.random() * 6, Math.sin(angle) * 8);
        scene.add(p);
        pickupBurstParticles.push({ mesh: p, vel, life: 0.4 });
      }
    }

    function showFloatingComboText(txt) {
      const containerEl = document.getElementById('floating-popups');

      el.className = 'combo-pop';
      el.textContent = txt;
      containerEl.appendChild(el);
      setTimeout(() => el.remove(), 700);
    }

    function spawnWave(levelObj) {
      const laneIdx = Math.floor(Math.random() * 3);
      const roll = Math.random();
      let type = 'obstacle', pType = null, highBarrier = false, mesh = null;

      if (roll < 0.52) {
        type = 'fish'; mesh = createChaiCupMesh();
      } else if (roll < 0.64) {
        type = 'powerup';
        const pList = ['jetpack', 'magnet', 'sneakers', 'mystery'];
        pType = pList[Math.floor(Math.random() * pList.length)];
        mesh = createPowerupMesh(pType);
      } else {
        type = 'obstacle';
        highBarrier = Math.random() < 0.32;
        mesh = createObstacleMesh(highBarrier, levelObj.obsColor);
      }

      const x = LANES[laneIdx];
      const y = 3.2 + LANE_Y[laneIdx] + (activePowerups.jetpack > 0 && type === 'fish' ? 10 : 0);
      mesh.position.set(x, y, -175);
      scene.add(mesh);
      activeEntities.push({ mesh, laneIdx, type, pType, highBarrier, passedSound: false, active: true });
    }

    // =========================================================================
    // 8. STATE, 360° TURNTABLE GESTURES & ROLLING ODOMETER
    // =========================================================================
    let gameState = 'HOME'; // HOME -> PLAYING -> PAUSED -> GAMEOVER
    let currentLane = 1;
    let jumpY = 0, jumpVel = 0, isJumping = false, slideTimer = 0, stumbleTimer = 0, cameraShake = 0;
    let wheelieMeter = 68, isHoldingWheelie = false;
    let turntableAngle = 0.45, isDraggingTurntable = false, dragLastX = 0;

    let score = 0, displayedScore = 0, fishCount = 0, comboFish = 0, currentLevelIdx = 1;
    let bestScore = parseInt(localStorage.getItem('cyberauto_best') || '765', 10);
    let fishBank = parseInt(localStorage.getItem('cyberauto_chai_bank') || '12', 10);
    let boostCount = parseInt(localStorage.getItem('cyberauto_boosts') || '3', 10);

    const activePowerups = { jetpack: 0, magnet: 0, sneakers: 0, shield: 0 };
    let spawnTimer = 0;

    const homeScreen = document.getElementById('home-screen');
    const hud = document.getElementById('hud');
    const dynamicIsland = document.getElementById('dynamic-island');
    const scoreEl = document.getElementById('score-el');
    const fishEl = document.getElementById('fish-el');
    const multBadge = document.getElementById('mult-badge');
    const powerupBanners = document.getElementById('powerup-banners');

    const hudBoosts = document.getElementById('hud-boosts');
    const homeBestEl = document.getElementById('home-best-el');
    const homeFishBankEl = document.getElementById('home-fish-bank');
    const boostCountBadge = document.getElementById('boost-count-badge');
    const homeEventLabel = document.getElementById('home-event-label');
    const eventToast = document.getElementById('event-toast');
    const modalBackdrop = document.getElementById('modal-backdrop');
    const modalContent = document.getElementById('modal-content');

    function syncHomeUI() {
      homeBestEl.textContent = bestScore;
      homeFishBankEl.textContent = fishBank;
      boostCountBadge.textContent = boostCount;
      hudBoosts.textContent = boostCount;
      const lvl = LEVELS[Settings.selectedEventIdx];
      homeEventLabel.textContent = `TN 41 CAPY 001 • ZONE ${lvl.id}: ${lvl.name}`;
      applyThemeVisuals(lvl);
    }

    function applyThemeVisuals(lvl) {
      updateSkyDomeTexture(lvl.skyTop, lvl.skyMid, lvl.skyBot);
      scene.fog.color.setHex(lvl.fogHex);
    }

    function showToast(msg) {
      eventToast.textContent = msg;
      eventToast.classList.add('show');
      setTimeout(() => eventToast.classList.remove('show'), 2200);
    }

    function seedShowcaseChaiLine() {
      activeEntities.forEach(ent => scene.remove(ent.mesh));
      activeEntities.length = 0;
      [-18, -32, -46, -60].forEach((zPos) => {
        const mesh = createChaiCupMesh();
        mesh.position.set(0, 3.4, zPos);
        scene.add(mesh);
        activeEntities.push({ mesh, laneIdx: 1, type: 'fish', pType: null, highBarrier: false, passedSound: false, active: true });
      });
    }

    syncHomeUI();
    seedShowcaseChaiLine();

    function switchLane(dir) {
      if (gameState !== 'PLAYING') return;
      const next = Math.max(0, Math.min(2, currentLane + dir));
      if (next !== currentLane) {
        currentLane = next;
        SoundFX.laneWhoosh();
      } else {
        triggerStumble();
      }
    }

    function triggerJump() {
      if (gameState !== 'PLAYING' || isJumping || activePowerups.jetpack > 0) return;
      isJumping = true;
      slideTimer = 0;
      const superJump = activePowerups.sneakers > 0;
      jumpVel = superJump ? 46 : 34;
      SoundFX.jumpWhoosh(superJump);
    }

    function triggerSlide() {
      if (gameState !== 'PLAYING') return;
      slideTimer = 0.65;
      if (isJumping) jumpVel = -55;
      SoundFX.slideRoll();
    }

    function triggerBoostShield() {
      if (gameState !== 'PLAYING' || activePowerups.shield > 0) return;
      if (boostCount > 0) {
        boostCount--;
        localStorage.setItem('cyberauto_boosts', boostCount);
        hudBoosts.textContent = boostCount;
        boostCountBadge.textContent = boostCount;
        activePowerups.shield = 8.0;
        cameraShake = 0.3;
        SoundFX.autoHorn();
        showToast('🛡️ HOLO-BUMPER SHIELD ACTIVE (8S)!');
      }
    }

    function triggerStumble() {
      cameraShake = 0.4;
      SoundFX.stumbleAlert();
      if (stumbleTimer > 0) {
        triggerGameOver('Scraped the Maglev rail twice at supersonic speed!');
      } else {
        stumbleTimer = 5.0;
        showToast('⚠️ RAIL SCRAPE! HOLD STEADY!');
      }
    }

    // Gesture-First Input (360° Turntable Drag on Home, Swipe Up to Launch, Swipe Down to Dismiss Sheets)
    let touchStartX = 0, touchStartY = 0, lastTapTime = 0;

    window.addEventListener('pointerdown', (e) => {
      ensureAudio();
      touchStartX = e.clientX;
      touchStartY = e.clientY;
      dragLastX = e.clientX;

      if (e.target.closest('button') || e.target.closest('.dock-pill-item') || e.target.closest('.bottom-sheet-card')) return;

      if (gameState === 'HOME') {
        isDraggingTurntable = true;
      } else if (gameState === 'PLAYING') {
        isHoldingWheelie = true;
        const now = performance.now();
        if (now - lastTapTime < 260) triggerBoostShield();
        lastTapTime = now;
      }
    });

    window.addEventListener('pointermove', (e) => {
      if (gameState === 'HOME' && isDraggingTurntable) {
        const dx = e.clientX - dragLastX;
        dragLastX = e.clientX;
        turntableAngle += dx * 0.012;
      }
    });

    window.addEventListener('pointerup', (e) => {
      isDraggingTurntable = false;
      isHoldingWheelie = false;

      const dx = e.clientX - touchStartX;
      const dy = e.clientY - touchStartY;

      // Swipe Down on any open Bottom Sheet to dismiss it!
      if (!modalBackdrop.classList.contains('hidden') && dy > 55) {
        if (gameState === 'PAUSED') resumeGame();
        else if (gameState !== 'GAMEOVER') closeModal();
        return;
      }

      // Swipe Up on Home Screen to Launch Run immediately!
      if (gameState === 'HOME' && dy < -45 && Math.abs(dy) > Math.abs(dx)) {
        startGame();
        return;
      }

      // Swipe Up on Game Over to Instant-Reboot Run!
      if (gameState === 'GAMEOVER' && dy < -45) {
        startGame();
        return;
      }

      if (gameState !== 'PLAYING') return;
      if (Math.abs(dx) > 24 && Math.abs(dx) > Math.abs(dy)) {
        switchLane(dx < 0 ? -1 : 1);
      } else if (Math.abs(dy) > 24 && Math.abs(dy) > Math.abs(dx)) {
        if (dy < 0) triggerJump();
        else triggerSlide();
      }
    });

    window.addEventListener('keydown', (e) => {
      if (e.code === 'Escape' || e.code === 'KeyP') {
        if (gameState === 'PLAYING') openPauseModal();
        else if (gameState === 'PAUSED') resumeGame();
      }
      if (gameState !== 'PLAYING') return;
      if (e.code === 'ArrowLeft' || e.code === 'KeyA') switchLane(-1);
      if (e.code === 'ArrowRight' || e.code === 'KeyD') switchLane(1);
      if (e.code === 'ArrowUp' || e.code === 'KeyW') triggerJump();
      if (e.code === 'ArrowDown' || e.code === 'KeyS') triggerSlide();
      if (e.code === 'KeyE') triggerBoostShield();
      if (e.code === 'Space') isHoldingWheelie = true;
    });

    window.addEventListener('keyup', (e) => {
      if (e.code === 'Space') isHoldingWheelie = false;
    });

    // =========================================================================
    // 9. BOTTOM DRAWER SHEETS & ZERO-WAIT NAVIGATION

    function closeModal() {
      SoundFX.uiTap();
      modalBackdrop.classList.add('hidden');
    }

    modalBackdrop.addEventListener('pointerdown', (e) => {
      if (e.target === modalBackdrop && gameState === 'HOME') closeModal();
    });

    function startGame() {
      ensureAudio();
      SoundFX.autoHorn();
      score = 0; displayedScore = 0; fishCount = 0; comboFish = 0;
      currentLane = 1;
      currentLevelIdx = Settings.selectedEventIdx;
      playerRig.position.set(LANES[1], LANE_Y[1], 0);
      wheelieMeter = 68; jumpY = 0; isJumping = false; slideTimer = 0; stumbleTimer = 0;
      activePowerups.jetpack = 0; activePowerups.magnet = 0; activePowerups.sneakers = 0; activePowerups.shield = 0;

      turntableRing.visible = false;
      diegeticTiltArc.visible = true;
      seedShowcaseChaiLine();

      applyThemeVisuals(LEVELS[currentLevelIdx]);
      hudLevelTxt.textContent = `ZONE ${LEVELS[currentLevelIdx].id}`;

      homeScreen.classList.add('hidden');
      modalBackdrop.classList.add('hidden');
      hud.classList.remove('hidden');
      gameState = 'PLAYING';
      showToast(`🛺 ${LEVELS[currentLevelIdx].name} — FULL THROTTLE!`);
    }

    function resumeGame() {
      SoundFX.uiTap();
      modalBackdrop.classList.add('hidden');
      gameState = 'PLAYING';
    }

    function returnToHome() {
      SoundFX.uiTap();
      turntableRing.visible = true;
      diegeticTiltArc.visible = false;
      seedShowcaseChaiLine();
      hud.classList.add('hidden');
      modalBackdrop.classList.add('hidden');
      homeScreen.classList.remove('hidden');
      gameState = 'HOME';
      syncHomeUI();
    }

    function openPauseModal() {
      if (gameState !== 'PLAYING') return;
      gameState = 'PAUSED';
      isHoldingWheelie = false;
      SoundFX.popupOpen();
      modalContent.innerHTML = `
        <div class="sheet-drag-handle"></div>
        <h2>⏸️ SYSTEM PAUSED</h2>
        <p>Meter Fare: ${Math.floor(score)} &nbsp;|&nbsp; ☕ Chai: ${fishCount}</p>
        <div class="setting-row">
          <span>🎵 132 BPM Subway Groove</span>
          <button class="sheet-btn" id="tog-bgm" style="padding:6px 14px; font-size:12px;">${Settings.bgm ? 'ON' : 'OFF'}</button>
        </div>

    function openInfoModal(title, bodyText) {

    function triggerGameOver(reason) {
      if (activePowerups.shield > 0) {
        activePowerups.shield = 0;
        cameraShake = 0.45;
        SoundFX.landImpact();
        showToast('🛡️ HOLO-BUMPER SAVED YOUR AUTO!');
        return;
      }
      cameraShake = 0.65;
      gameState = 'GAMEOVER';
      isHoldingWheelie = false;
      SoundFX.wipeoutCatch();

      fishBank += fishCount;
      localStorage.setItem('cyberauto_chai_bank', fishBank);
      if (Math.floor(score) > bestScore) {
        bestScore = Math.floor(score);
        localStorage.setItem('cyberauto_best', bestScore);
      }

      modalContent.innerHTML = `
        <div class="sheet-drag-handle"></div>
        <h2>💥 RUN TERMINATED</h2>
        <p>${reason}<br><br>
        <strong style="font-size:18px; color:#fff;">Fare: ${Math.floor(score)}</strong> &nbsp;(Best: ${bestScore})<br>
        ☕ Chai Collected: +${fishCount} &nbsp;(Bank: ${fishBank})</p>
        <div class="sheet-btn-col">
          <button class="sheet-btn" id="go-retry-btn">▶ SWIPE UP OR TAP TO RETRY</button>
          <button class="sheet-btn ghost" id="go-home-btn">🏠 360° GARAGE</button>
        </div>
      `;
      modalBackdrop.classList.remove('hidden');
      document.getElementById('go-retry-btn').onclick = startGame;
      document.getElementById('go-home-btn').onclick = returnToHome;
    }

    document.getElementById('tap-to-play-zone').onclick = startGame;
    document.getElementById('btn-pause').onclick = openPauseModal;
    document.getElementById('btn-home-settings').onclick = openSettingsModal;
    document.getElementById('btn-levels').onclick = openLevelsModal;
    document.getElementById('btn-shop').onclick = openShopModal;
    document.getElementById('btn-missions').onclick = () => openInfoModal('📋 ACTIVE CONTRACTS', '1. Hold 2-Wheel Auto-Tilt in the Gold Zone for 2X Score<br>2. Collect Steaming Cutting Chai glasses<br>3. Double-tap in flight for Holo-Bumper Shield!');
    document.getElementById('btn-me').onclick = () => {
      SoundFX.autoHorn();
      openInfoModal('🐹 TN 41 CAPY 001 TELEMETRY', 'Driver: Chill Capybara + Yuzu Tangerine + Pixel Visor<br>Top Speed: Mach 0.42 &nbsp;|&nbsp; Handling: 98%<br>Motto: Chai Fuels Legends!');
    };

    // =========================================================================
    // 10. MAIN ANIMATION, 360° TURNTABLE & UNOBSTRUCTED HIGH-ANGLE CHASE LOOP
    // =========================================================================
    const clock = new THREE.Clock();

    function updatePowerupHUD() {
      const tags = [];
      if (stumbleTimer > 0) tags.push(`<span class="spatial-pill" style="border-color:#ff2a2a;">⚠️ RAIL WARNING ${Math.ceil(stumbleTimer)}S</span>`);
      if (activePowerups.jetpack > 0) tags.push(`<span class="spatial-pill" style="border-color:#ff6d00;">🚀 NITRO ${Math.ceil(activePowerups.jetpack)}S</span>`);
      if (activePowerups.magnet > 0) tags.push(`<span class="spatial-pill" style="border-color:#00f5d4;">🧲 MAGNET ${Math.ceil(activePowerups.magnet)}S</span>`);
      if (activePowerups.sneakers > 0) tags.push(`<span class="spatial-pill" style="border-color:#38b000;">🔩 SPRINGS ${Math.ceil(activePowerups.sneakers)}S</span>`);
      if (activePowerups.shield > 0) tags.push(`<span class="spatial-pill" style="border-color:#ff007f;">🛡️ BUMPER ${Math.ceil(activePowerups.shield)}S</span>`);
      powerupBanners.innerHTML = tags.join('');
    }

    function animate() {
      requestAnimationFrame(animate);
      const delta = Math.min(clock.getDelta(), 0.1);
      const elapsed = clock.getElapsedTime();

      worldCurveUniforms.uCurveX.value = Math.sin(elapsed * 0.35) * 0.00009;
      SubwayBGM.update(delta, activePowerups.jetpack > 0);

      if (cameraShake > 0) cameraShake = Math.max(0, cameraShake - delta * 2.2);
      const shakeX = (Math.random() - 0.5) * cameraShake * 1.2;
      const shakeY = (Math.random() - 0.5) * cameraShake * 1.2;

      // =====================================================================
      // STATE 1: 360° INTERACTIVE TURNTABLE SHOWCASE (HOME SCREEN)
      // =====================================================================
      if (gameState === 'HOME') {
        turntableRing.visible = true;
        diegeticTiltArc.visible = false;
        if (!isDraggingTurntable) turntableAngle += delta * 0.45;
        playerRig.position.x = THREE.MathUtils.lerp(playerRig.position.x, 0, delta * 6);
        playerRig.position.y = THREE.MathUtils.lerp(playerRig.position.y, 0.45, delta * 6);
        bikeWheelieRig.rotation.y = turntableAngle;
        bikeWheelieRig.rotation.z = 0.24 + Math.sin(elapsed * 3.0) * 0.03;
        turntableRing.rotation.z = elapsed * 1.5;

        // Showcase camera framing the Capybara & Auto in the center turntable
        camera.position.lerp(new THREE.Vector3(0, 8.2, 20.5), delta * 5);
        camera.lookAt(0, 4.8, 6.5);
      }

      // =====================================================================
      // STATE 2: UNOBSTRUCTED HIGH-ANGLE PORTRAIT CHASE CAMERA (PLAYING)
      // =====================================================================
      if (gameState === 'PLAYING') {
        const targetFov = activePowerups.jetpack > 0 ? 64 : 56;
        if (Math.abs(camera.fov - targetFov) > 0.1) {
          camera.fov = THREE.MathUtils.lerp(camera.fov, targetFov, delta * 5);
          camera.updateProjectionMatrix();
        }

        // High-Angle Subway Surfers Portrait Camera:
        // Sits at Y = 14.5, Z = 21.5 looking far ahead at Y = 2.5, Z = -55!
        // Auto-Rickshaw & Capybara stay cleanly in the bottom 20% of the screen!
        const camFollowX = playerRig.position.x * 0.45 + shakeX;
        camera.position.lerp(new THREE.Vector3(camFollowX, 14.5 + shakeY, 21.5), delta * 7);
        camera.lookAt(playerRig.position.x * 0.25, 2.5, -55);

        ['jetpack', 'magnet', 'sneakers', 'shield'].forEach(k => {
          if (activePowerups[k] > 0) activePowerups[k] = Math.max(0, activePowerups[k] - delta);
        });
        if (stumbleTimer > 0) stumbleTimer = Math.max(0, stumbleTimer - delta);
        if (slideTimer > 0) slideTimer = Math.max(0, slideTimer - delta);
        updatePowerupHUD();

        if (isHoldingWheelie) wheelieMeter += delta * 54;
        else wheelieMeter -= delta * 34;
        wheelieMeter = Math.max(25, wheelieMeter);

        if (wheelieMeter >= 100) {
          wheelieMeter = 65;
          triggerGameOver('Tilted past the balance point and rolled off the Maglev roof!');
          return;
        }

        const inSweetSpot = wheelieMeter >= 55 && wheelieMeter <= 85;
        const mult = (inSweetSpot ? 2 : 1) * Math.max(1, currentLevelIdx);
        multBadge.textContent = `${mult}X`;

        // Update Diegetic 3D Holographic Tilt Ring Color & Scale right behind the Auto!
        diegeticTiltArc.material.color.setHex(wheelieMeter > 85 ? 0xff007f : (inSweetSpot ? 0xffbe0b : 0x00f5d4));
        const arcScale = 0.65 + (wheelieMeter / 100) * 0.55;
        diegeticTiltArc.scale.set(arcScale, arcScale, 1);

        // Emissive Rim-Lighting on Dynamic Island HUD
        dynamicIsland.style.borderColor = inSweetSpot ? 'rgba(255, 190, 11, 0.75)' : 'rgba(0, 245, 212, 0.45)';

        // Rolling Odometer Score Counter + Haptic Audio Blips
        score += delta * 24 * mult;
        if (Math.floor(score) > displayedScore) {
          const diff = Math.floor(score) - displayedScore;
          displayedScore += Math.max(1, Math.ceil(diff * 0.25));
          scoreEl.textContent = String(displayedScore).padStart(5, '0');
        }
        fishEl.textContent = fishCount;

        for (let i = LEVELS.length - 1; i >= 0; i--) {
          if (score >= LEVELS[i].minScore && i > currentLevelIdx) {
            currentLevelIdx = i;
            const newLvl = LEVELS[currentLevelIdx];
            applyThemeVisuals(newLvl);
            hudLevelTxt.textContent = `ZONE ${newLvl.id}`;
            SoundFX.autoHorn();
            showToast(`🌆 ZONE ${newLvl.id}: ${newLvl.name}!`);
            break;
          }
        }

        const targetX = LANES[currentLane];
        const targetBaseY = LANE_Y[currentLane];
        const prevX = playerRig.position.x;
        playerRig.position.x = THREE.MathUtils.lerp(playerRig.position.x, targetX, delta * 13);
        const laneVelX = playerRig.position.x - prevX;

        if (activePowerups.jetpack > 0) {
          jumpY = THREE.MathUtils.lerp(jumpY, 9.5, delta * 8);
          isJumping = false;
        } else if (isJumping) {
          jumpY += jumpVel * delta;
          jumpVel -= 90 * delta;
          if (jumpY <= 0) {
            jumpY = 0;
            isJumping = false;
            cameraShake = 0.14;
            SoundFX.landImpact();
          }
        } else {
          jumpY = THREE.MathUtils.lerp(jumpY, 0, delta * 10);
        }

        playerRig.position.y = THREE.MathUtils.lerp(playerRig.position.y, targetBaseY, delta * 12) + jumpY;

        const targetScaleY = slideTimer > 0 ? 0.42 : 0.66;
        bikeWheelieRig.scale.y = THREE.MathUtils.lerp(bikeWheelieRig.scale.y, targetScaleY, delta * 16);

        bikeWheelieRig.rotation.z = (wheelieMeter / 100) * 0.42 - laneVelX * 0.45;
        bikeWheelieRig.rotation.y = 0.14 - laneVelX * 0.35;

        const currentLvlObj = LEVELS[currentLevelIdx];
        spawnTimer -= delta;
        if (spawnTimer <= 0) {
          spawnWave(currentLvlObj);
          spawnTimer = Math.max(0.45, 1.0 - currentLevelIdx * 0.08);
        }

        const speed = (78 + currentLevelIdx * 11) * (activePowerups.jetpack > 0 ? 1.4 : 1.0);
        updateContinuousAudioLoops(delta, speed, activePowerups, currentLvlObj);

        for (let i = activeEntities.length - 1; i >= 0; i--) {
          const ent = activeEntities[i];
          ent.mesh.position.z += speed * delta;
          if (ent.type !== 'obstacle') ent.mesh.rotation.y += delta * 2.5;

          if (ent.active && ent.type === 'fish' && activePowerups.magnet > 0 && ent.mesh.position.z > -45) {
            ent.mesh.position.x = THREE.MathUtils.lerp(ent.mesh.position.x, playerRig.position.x, delta * 9);
            ent.mesh.position.y = THREE.MathUtils.lerp(ent.mesh.position.y, playerRig.position.y + 3.5, delta * 9);
          }

          if (!ent.passedSound && ent.type === 'obstacle' && ent.mesh.position.z > 12) {
            ent.passedSound = true;
            SoundFX.trainFlyBy();
          }

          if (ent.active && ent.mesh.position.z > 6.0 && ent.mesh.position.z < 13.0) {
            const xDist = Math.abs(playerRig.position.x - ent.mesh.position.x);
            if (xDist < 2.4) {
              if (ent.type === 'fish') {
                ent.active = false;
                fishCount++;
                comboFish++;
                const pts = 50 * mult;
                score += pts;
                scoreEl.classList.add('bump');
                setTimeout(() => scoreEl.classList.remove('bump'), 110);
                SoundFX.chaiClink(comboFish);
                SoundFX.odoTick();
                spawnPickupBurst(ent.mesh.position, 0xffbe0b);
                showFloatingComboText(`+${pts} ☕`);
                scene.remove(ent.mesh);
              } else if (ent.type === 'powerup') {
                ent.active = false;
                spawnPickupBurst(ent.mesh.position, 0x00f5d4);
                scene.remove(ent.mesh);
                let chosen = ent.pType;
                if (chosen === 'mystery') {
                  SoundFX.mysteryBoxFanfare();
                  const pool = ['jetpack', 'magnet', 'sneakers', 'shield'];
                  chosen = pool[Math.floor(Math.random() * pool.length)];
                } else {
                  SoundFX.autoHorn();
                }
                activePowerups[chosen] = 9.0;
                showToast(`⚡ ${chosen.toUpperCase()} ACTIVATED!`);
              } else if (ent.type === 'obstacle' && activePowerups.jetpack <= 0) {
                const hitHigh = ent.highBarrier && slideTimer <= 0;
                const hitLow = !ent.highBarrier && jumpY < 3.4;
                if (hitHigh || hitLow) {
                  ent.active = false;
                  scene.remove(ent.mesh);
                  triggerGameOver(ent.highBarrier ? 'Clipped an overhead Neon Laser Gate! (Swipe Down to Duck!)' : 'Hit a Floating Neon Hover-Barricade! (Swipe Up to Bunny-Hop!)');
                  return;
                }
              }
            }
          }

          if (ent.mesh.position.z > 30) {
            scene.remove(ent.mesh);
            activeEntities.splice(i, 1);
          }
        }
      }

      if (gameState !== 'PAUSED') {
        rearWheel.children.forEach(w => w.rotation.x -= delta * 24);
        frontWheel.rotation.x -= delta * 24;
        metalRoofTex.offset.y -= delta * 3.2;

        thrusterFlames.forEach(tf => {
          const pulse = 0.85 + Math.sin(elapsed * 42 + tf.phase) * 0.2;
          tf.outer.scale.set(pulse, 1.0 + Math.sin(elapsed * 30) * 0.3, pulse);
          tf.core.scale.set(pulse, pulse, pulse);
        });

        trainSegments.forEach(seg => {
          seg.position.z += 68 * delta;
          if (seg.position.z > 40) seg.position.z -= 240;
        });

        ambientHoverPads.forEach(pad => {
          pad.mesh.position.z += pad.speed * delta;
          pad.mesh.position.y = pad.baseY + Math.sin(elapsed * 2.8 + pad.phase) * 0.55;
          if (pad.mesh.position.z > 32) pad.mesh.position.z -= 210;
        });

        cloudPuffs.forEach(cp => {
          cp.sprite.position.z += cp.speed * delta;
          if (cp.sprite.position.z > 35) cp.sprite.position.z -= 250;
        });

        cityStructures.forEach(c => {
          c.group.position.z += c.speed * delta;
          if (c.group.position.z > 40) c.group.position.z -= 280;
        });

        sparkParticles.forEach(sp => {
          if (sp.isScarf) {
            sp.mesh.position.y = sp.baseY + Math.sin(elapsed * 18 - sp.index * 0.65 + sp.tail) * (0.14 * sp.index);
            sp.mesh.position.z = sp.baseZ + Math.cos(elapsed * 14 - sp.index * 0.5) * (0.08 * sp.index);
          } else {
            const s = 0.5 + Math.sin(elapsed * 38 + sp.phase) * 0.45;
            sp.mesh.scale.set(s, s, s);
          }
        });

        for (let i = pickupBurstParticles.length - 1; i >= 0; i--) {
          const bp = pickupBurstParticles[i];
          bp.life -= delta;
          bp.mesh.position.addScaledVector(bp.vel, delta);
          bp.mesh.scale.setScalar(Math.max(0.01, bp.life * 2.2));
          if (bp.life <= 0) {
            scene.remove(bp.mesh);
            pickupBurstParticles.splice(i, 1);
          }
        }
      }

      if (composer && Settings.bloom) {
        composer.render();
      } else {
        renderer.render(scene, camera);
      }
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      if (composer) composer.setSize(window.innerWidth, window.innerHeight);
    });

    animate();
  </script>
