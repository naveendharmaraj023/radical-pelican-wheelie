<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Mumbai Auto: Metro Velocity</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Outfit:wght@700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --neon-cyan: #00f5d4;
      --neon-pink: #ff007f;
      --neon-gold: #ffbe0b;
      --glass-bg: rgba(12, 16, 32, 0.82);
      --glass-border: rgba(255, 190, 11, 0.65);
      --bpm-scale: 1;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      overflow: hidden;
      background: #120c1f;
      font-family: 'Outfit', system-ui, -apple-system, sans-serif;
      color: #fff;
    }
    #canvas-container {
      width: 100vw;
      height: 100vh;
      display: block;
    }

    /* =================================================================
       SPIDER-VERSE x SUBWAY SURFERS DYNAMIC ISLAND HUD
       ================================================================= */
    #hud {
      position: absolute;
      top: max(12px, env(safe-area-inset-top));
      left: 12px;
      right: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      pointer-events: none;
      z-index: 15;
    }
    #hud.hidden { display: none; }

    .hud-top-row {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    #dynamic-island {
      flex: 1;
      max-width: 350px;
      margin: 0 auto;
      background: var(--glass-bg);
      backdrop-filter: blur(20px) saturate(190%);
      -webkit-backdrop-filter: blur(20px) saturate(190%);
      border: 2.5px solid #000;
      outline: 2px solid var(--neon-gold);
      box-shadow: 0 6px 0 #000, 0 10px 24px rgba(0, 0, 0, 0.6);
      border-radius: 999px;
      padding: 7px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      pointer-events: auto;
      transform: scale(var(--bpm-scale));
      transition: outline-color 0.3s ease, transform 0.08s ease;
    }

    .island-left {
      display: flex;
      align-items: center;
      gap: 7px;
    }
    .mult-orb {
      background: linear-gradient(135deg, #ffbe0b 0%, #fb5607 100%);
      color: #000;
      border: 2px solid #000;
      font-family: 'Fredoka', sans-serif;
      font-size: 13px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 999px;
      box-shadow: 0 2px 0 #000;
    }
    .zone-micro-tag {
      font-size: 10px;
      font-weight: 900;
      color: #00f5d4;
      letter-spacing: 0.6px;
      text-transform: uppercase;
      text-shadow: 1px 1px 0 #000;
    }

    .island-score {
      font-family: 'Fredoka', sans-serif;
      font-size: 27px;
      font-weight: 700;
      letter-spacing: 0.5px;
      color: #ffffff;
      -webkit-text-stroke: 1.2px #000;
      text-shadow: 0 3px 0 #ff007f;
      font-variant-numeric: tabular-nums;
      transition: transform 0.08s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .island-score.bump {
      transform: scale(1.22) rotate(-2deg);
      color: #ffbe0b;
    }

    .island-right {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      font-weight: 900;
      color: #ffbe0b;
      text-shadow: 1px 1px 0 #000;
    }

    .glass-pause-btn {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: #ffbe0b;
      border: 2.5px solid #000;
      color: #000;
      font-weight: 900;
      font-size: 15px;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      pointer-events: auto;
      box-shadow: 0 4px 0 #000;
    }
    .glass-pause-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #000; }

    #powerup-banners {
      display: flex;
      gap: 6px;
      margin-top: 8px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .spatial-pill {
      background: #ff007f;
      border: 2px solid #000;
      border-radius: 999px;
      padding: 4px 12px;
      font-size: 10px;
      font-weight: 900;
      letter-spacing: 0.6px;
      color: #fff;
      text-transform: uppercase;
      box-shadow: 0 3px 0 #000;
    }

    /* =================================================================
       HOME SCREEN (COMIC STYLIZED TURNTABLE + MUMBAI METRO)
       ================================================================= */
    #home-screen {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: max(14px, env(safe-area-inset-top)) 16px max(20px, env(safe-area-inset-bottom)) 16px;
      z-index: 25;
      pointer-events: none;
    }
    #home-screen.hidden { display: none; }

    .home-top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      pointer-events: auto;
    }
    .currency-glass-pill {
      background: var(--glass-bg);
      backdrop-filter: blur(16px);
      border: 2.5px solid #000;
      outline: 2px solid var(--neon-cyan);
      border-radius: 999px;
      padding: 6px 14px;
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 12px;
      font-weight: 900;
      color: #fff;
      box-shadow: 0 5px 0 #000;
    }

    .brand-header {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      margin-top: 0.5vh;
      pointer-events: none;
    }
    .logo-badge {
      width: 54px;
      height: 54px;
      border-radius: 15px;
      border: 2.5px solid #000;
      outline: 2px solid #ffbe0b;
      box-shadow: 0 4px 0 #000;
      margin-bottom: 6px;
      object-fit: cover;
    }
    .Zone-pill-badge {
      background: #ff007f;
      border: 2px solid #000;
      color: #fff;
      padding: 3px 12px;
      border-radius: 999px;
      font-size: 10px;
      font-weight: 900;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      margin-bottom: 4px;
      box-shadow: 0 3px 0 #000;
    }
    .modern-title {
      font-family: 'Fredoka', sans-serif;
      font-size: clamp(30px, 8.5vw, 44px);
      line-height: 0.94;
      color: #ffbe0b;
      text-transform: uppercase;
      -webkit-text-stroke: 2px #000;
      text-shadow: 0 5px 0 #000;
      transform: rotate(-2deg);
    }
    .modern-title .sub-glow {
      display: block;
      font-size: clamp(22px, 6.2vw, 32px);
      color: #00f5d4;
      -webkit-text-stroke: 1.8px #000;
      text-shadow: 0 4px 0 #000;
    }

    #turntable-drag-zone {
      flex: 1;
      width: 100%;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: center;
      padding-bottom: 10px;
      pointer-events: auto;
      cursor: grab;
    }
    .turntable-hint {
      background: rgba(10, 14, 28, 0.85);
      border: 2px solid #000;
      border-radius: 999px;
      padding: 4px 14px;
      font-size: 10px;
      font-weight: 900;
      color: #ffbe0b;
      letter-spacing: 0.8px;
      margin-bottom: 8px;
      box-shadow: 0 3px 0 #000;
    }

    .thumb-zone-footer {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      width: 100%;
      pointer-events: auto;
    }

    .launch-run-btn {
      width: 100%;
      max-width: 310px;
      background: linear-gradient(180deg, #ffbe0b 0%, #fb5607 100%);
      border: 3px solid #000;
      border-radius: 999px;
      padding: 13px 26px;
      font-family: 'Fredoka', sans-serif;
      font-size: 20px;
      font-weight: 700;
      color: #000;
      letter-spacing: 0.8px;
      text-align: center;
      box-shadow: 0 6px 0 #000, 0 10px 20px rgba(251, 86, 7, 0.5);
      cursor: pointer;
      transform: scale(var(--bpm-scale));
      transition: transform 0.08s ease;
    }
    .launch-run-btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #000; }

    .floating-glass-dock {
      display: flex;
      justify-content: center;
      gap: 10px;
      width: 100%;
      max-width: 360px;
      background: var(--glass-bg);
      backdrop-filter: blur(20px);
      border: 2.5px solid #000;
      outline: 2px solid var(--neon-cyan);
      border-radius: 24px;
      padding: 8px;
      box-shadow: 0 8px 0 #000;
    }
    .dock-pill-item {
      flex: 1;
      border-radius: 16px;
      padding: 7px 6px;
      text-align: center;
      cursor: pointer;
      transition: background 0.2s ease, transform 0.1s ease;
    }
    .dock-pill-item:active {
      background: rgba(255, 190, 11, 0.25);
      transform: scale(0.94);
    }
    .dock-pill-icon { font-size: 18px; display: block; margin-bottom: 2px; }
    .dock-pill-txt {
      font-size: 10px;
      font-weight: 900;
      color: #fff;
      letter-spacing: 0.6px;
      text-transform: uppercase;
    }

    /* =================================================================
       BOTTOM DRAWER SHEETS
       ================================================================= */
    .modal-backdrop {
      position: absolute;
      inset: 0;
      background: rgba(3, 5, 14, 0.78);
      backdrop-filter: blur(8px);
      display: flex;
      justify-content: center;
      align-items: flex-end;
      z-index: 30;
    }
    .modal-backdrop.hidden { display: none; }

    .bottom-sheet-card {
      background: #14182e;
      border-top: 4px solid #ffbe0b;
      box-shadow: 0 -10px 40px rgba(0, 0, 0, 0.8);
      border-radius: 28px 28px 0 0;
      padding: 12px 22px max(24px, env(safe-area-inset-bottom)) 22px;
      width: 100%;
      max-width: 440px;
      text-align: center;
      max-height: 84vh;
      overflow-y: auto;
      animation: slideUpSheet 0.26s cubic-bezier(0.16, 1, 0.3, 1);
    }
    @keyframes slideUpSheet {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }
    .sheet-drag-handle {
      width: 44px;
      height: 5px;
      background: rgba(255, 255, 255, 0.35);
      border-radius: 999px;
      margin: 0 auto 14px auto;
    }
    .bottom-sheet-card h2 {
      font-family: 'Fredoka', sans-serif;
      color: #ffbe0b;
      font-size: 22px;
      margin-bottom: 8px;
      -webkit-text-stroke: 1px #000;
    }
    .bottom-sheet-card p {
      font-size: 13px;
      color: #e2e8f0;
      line-height: 1.5;
      margin-bottom: 16px;
      font-weight: 700;
    }
    .sheet-btn-col { display: flex; flex-direction: column; gap: 10px; }
    .sheet-btn {
      background: #ffbe0b;
      color: #000;
      border: 2.5px solid #000;
      padding: 12px 20px;
      font-family: 'Fredoka', sans-serif;
      font-size: 15px;
      font-weight: 700;
      border-radius: 16px;
      cursor: pointer;
      box-shadow: 0 4px 0 #000;
    }
    .sheet-btn.pink {
      background: #00f5d4;
      color: #000;
    }
    .sheet-btn.ghost {
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
    }
    .setting-row, .level-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(255, 255, 255, 0.08);
      border: 2px solid #000;
      padding: 10px 14px;
      border-radius: 14px;
      margin-bottom: 8px;
      font-size: 13px;
      font-weight: 800;
      text-align: left;
    }
    .level-item.active {
      border: 2.5px solid #ffbe0b;
      background: rgba(255, 190, 11, 0.2);
    }
    .livery-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 14px;
    }
    .livery-swatch {
      background: rgba(255,255,255,0.08);
      border: 2px solid #000;
      border-radius: 14px;
      padding: 10px 6px;
      cursor: pointer;
      font-size: 11px;
      font-weight: 800;
      color: #fff;
    }
    .livery-swatch.active { border: 2.5px solid #ffbe0b; background: rgba(255, 190, 11, 0.22); }

    /* SPIDER-VERSE COMIC IMPACT POPUPS */
    #floating-popups {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 16;
      overflow: hidden;
    }
    .combo-pop {
      position: absolute;
      left: 50%;
      top: 50%;
      font-family: 'Fredoka', sans-serif;
      font-size: 26px;
      font-weight: 700;
      color: #ffbe0b;
      -webkit-text-stroke: 1.5px #000;
      text-shadow: 3px 4px 0 #ff007f;
      animation: comicPop 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    @keyframes comicPop {
      0% { transform: translate(-50%, 0) scale(0.4) rotate(-8deg); opacity: 1; }
      45% { transform: translate(-50%, -42px) scale(1.3) rotate(4deg); opacity: 1; }
      100% { transform: translate(-50%, -78px) scale(0.95) rotate(-2deg); opacity: 0; }
    }
    #event-toast {
      position: absolute;
      top: 96px;
      left: 50%;
      transform: translateX(-50%);
      background: #ffbe0b;
      border: 2.5px solid #000;
      box-shadow: 0 4px 0 #000;
      padding: 6px 18px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 900;
      color: #000;
      z-index: 18;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.25s ease;
      white-space: nowrap;
    }
    #event-toast.show { opacity: 1; }
  </style>

  <script src="three.min.js" onerror="this.onerror=null;this.src='https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js';"></script>
  <script src="GLTFLoader.js" onerror="this.onerror=null;this.src='https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js';"></script>
  <script src="CopyShader.js" onerror="this.onerror=null;this.src='https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js';"></script>
  <script src="LuminosityHighPassShader.js" onerror="this.onerror=null;this.src='https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js';"></script>
  <script src="EffectComposer.js" onerror="this.onerror=null;this.src='https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js';"></script>
  <script src="RenderPass.js" onerror="this.onerror=null;this.src='https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js';"></script>
  <script src="ShaderPass.js" onerror="this.onerror=null;this.src='https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js';"></script>
  <script src="UnrealBloomPass.js" onerror="this.onerror=null;this.src='https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js';"></script>
</head>
<body>

  <!-- HOME SCREEN -->
  <div id="home-screen">
    <div class="home-top-bar">
      <div class="currency-glass-pill">

    <div class="brand-header">
      <img src="logo.png" alt="Cyber Capy Logo" class="logo-badge" onerror="this.style.display='none'">
      <div class="Zone-pill-badge" id="home-event-label">MUMBAI METRO • LINE 1: DHARAVI ↔ BKC</div>
      <div class="modern-title">
        MUMBAI AUTO
        <span class="sub-glow">METRO VELOCITY</span>
      </div>
    </div>

    <div id="turntable-drag-zone">
      <div class="turntable-hint">↺ DRAG TO SPIN 360° • SWIPE UP TO LAUNCH</div>
    </div>

    <div class="thumb-zone-footer">

        </div>

  <div id="floating-popups"></div>

  <!-- SWIPE-DOWN BOTTOM DRAWER SHEET -->
  <div id="modal-backdrop" class="modal-backdrop hidden">
    <div class="bottom-sheet-card" id="modal-content"></div>
  </div>

  <div id="canvas-container"></div>

  <script>
    // =========================================================================
    // 1. 132 BPM MUMBAI STREET-GROOVE SEQUENCER + SFX ENGINE
    // =========================================================================
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;

    const Settings = {
      bgm: true,
      sfx: true,
      loops: true,
      bloom: true,
      vibration: true,
      selectedEventIdx: 0,
      liveryIdx: 0
    };

    const LIVERIES = [
      { name: 'Mumbai Kaali-Peeli', hex: 0xffbe0b, baseHex: 0x14161f, accent: '#ffbe0b' },
      { name: 'Bandra Neon Pink', hex: 0xff007f, baseHex: 0x1c0b2b, accent: '#ff007f' },
      { name: 'Worli Sea-Link Cyan', hex: 0x00f5d4, baseHex: 0x091e26, accent: '#00f5d4' }
    ];

    function ensureAudio() {
      try {
        if (!audioCtx) audioCtx = new AudioCtx();
        if (audioCtx.state === 'suspended') audioCtx.resume();
      } catch (e) {}
    }

    let bpmPulseValue = 1.0;
    const SubwayBGM = {
      step: 0,
      accum: 0,
      stepDuration: 60 / 132 / 4,
      bassNotes: [110, 0, 110, 130.8, 146.8, 0, 146.8, 164.8, 130.8, 0, 130.8, 146.8, 164.8, 0, 196.0, 164.8],
      leadNotes: [440, 0, 523.2, 587.3, 659.2, 0, 587.3, 523.2, 440, 523.2, 659.2, 0, 784.0, 659.2, 587.3, 0],
      update(delta, isFast = false) {
        bpmPulseValue = THREE.MathUtils.lerp(bpmPulseValue, 1.0, delta * 14);
        document.documentElement.style.setProperty('--bpm-scale', bpmPulseValue.toFixed(3));

        if (!Settings.bgm || !audioCtx) return;
        this.accum += delta * (isFast ? 1.16 : 1.0);
        if (this.accum < this.stepDuration) return;
        this.accum -= this.stepDuration;

        const s = this.step % 16;
        if (s === 0 || s === 4 || s === 8 || s === 12) {
          bpmPulseValue = 1.035;
          SoundFX._tone(130, 'sine', 0.11, 36, 0.14);
        }
        if (s === 4 || s === 12) {
          this._playNoiseHit(0.08, 0.07);
          SoundFX._tone(210, 'triangle', 0.06, 110, 0.08);
        }
        if (s % 2 === 1) this._playNoiseHit(0.025, 0.03);
        const b = this.bassNotes[s];
        if (b > 0) SoundFX._tone(b, 'sawtooth', 0.09, b * 0.98, 0.055);
        const l = this.leadNotes[s];
        if (l > 0) SoundFX._tone(l, 'square', 0.10, l * 1.005, 0.045);
        this.step++;
      },
      _playNoiseHit(duration, vol) {
        try {
          const sz = Math.floor(audioCtx.sampleRate * duration);
          const buf = audioCtx.createBuffer(1, sz, audioCtx.sampleRate);
          const data = buf.getChannelData(0);
          for (let i = 0; i < sz; i++) data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (sz * 0.35));
          const src = audioCtx.createBufferSource();
          src.buffer = buf;
          const f = audioCtx.createBiquadFilter();
          f.type = 'highpass'; f.frequency.value = 1800;
          const g = audioCtx.createGain(); g.gain.value = vol;
          src.connect(f); f.connect(g); g.connect(audioCtx.destination);
          src.start();
        } catch (e) {}
      }
    };

    const SoundFX = {
      uiTap() { if (Settings.sfx) { ensureAudio(); this._tone(620, 'sine', 0.05, 880, 0.12); } },
      popupOpen() { if (Settings.sfx) { ensureAudio(); this._tone(420, 'triangle', 0.10, 760, 0.12); } },
      odoTick() { if (Settings.sfx) { ensureAudio(); this._tone(1250, 'sine', 0.02, 1400, 0.04); } },
      autoHorn() {
        if (!Settings.sfx) return;
        ensureAudio();

          osc.type = type;
          osc.frequency.setValueAtTime(freq, audioCtx.currentTime);

      material.onBeforeCompile = (shader) => {
        shader.uniforms.uCurveY = worldCurveUniforms.uCurveY;
        shader.uniforms.uCurveX = worldCurveUniforms.uCurveX;
        shader.vertexShader = `uniform float uCurveY;\nuniform float uCurveX;\n` + shader.vertexShader;
        shader.vertexShader = shader.vertexShader.replace(
          '#include <project_vertex>',
          `
          vec4 mvPosition = modelViewMatrix * vec4( transformed, 1.0 );
          float zDist = max(0.0, -mvPosition.z - 15.0);
          mvPosition.y += uCurveY * zDist * zDist;
          mvPosition.x += uCurveX * zDist * zDist;
          gl_Position = projectionMatrix * mvPosition;
          `

        const pList = ['jetpack', 'magnet', 'sneakers', 'mystery'];

      }

      const x = LANES[laneIdx];
      const y = (type === 'fish' && activePowerups.jetpack > 0) ? 9.5 : 0.0;
      mesh.position.set(x, y, -175);
      scene.add(mesh);
      activeEntities.push({ mesh, laneIdx, type, pType, highBarrier, passedSound: false, active: true });

      if (gameState === 'HOME') {
        isDraggingTurntable = true;

      if (!modalBackdrop.classList.contains('hidden') && dy > 55) {
        if (gameState === 'PAUSED') resumeGame();

      if (gameState === 'HOME' && dy < -45 && Math.abs(dy) > Math.abs(dx)) {

        return;
      }

      if (gameState === 'GAMEOVER' && dy < -45) {
        startGame();
        return;
      }

      if (gameState !== 'PLAYING') return;
      if (Math.abs(dx) > 24 && Math.abs(dx) > Math.abs(dy)) {
        switchLane(dx < 0 ? -1 : 1);

    // =========================================================================
    const clock = new THREE.Clock();

    function updatePowerupHUD() {
      const tags = [];
      if (stumbleTimer > 0) tags.push(`<span class="spatial-pill" style="background:#ff2a2a;">⚠️ WALL WARNING ${Math.ceil(stumbleTimer)}S</span>`);
      if (activePowerups.jetpack > 0) tags.push(`<span class="spatial-pill" style="background:#ff6d00;">🚀 NITRO JET ${Math.ceil(activePowerups.jetpack)}S</span>`);
      if (activePowerups.magnet > 0) tags.push(`<span class="spatial-pill" style="background:#0096c7;">🧲 CHAI MAGNET ${Math.ceil(activePowerups.magnet)}S</span>`);
      if (activePowerups.sneakers > 0) tags.push(`<span class="spatial-pill" style="background:#38b000;">🔩 SPRINGS ${Math.ceil(activePowerups.sneakers)}S</span>`);
      if (activePowerups.shield > 0) tags.push(`<span class="spatial-pill" style="background:#7209b7;">🛡️ BUMPER ${Math.ceil(activePowerups.shield)}S</span>`);
      powerupBanners.innerHTML = tags.join('');
    }

    function animate() {
      requestAnimationFrame(animate);
      const delta = Math.min(clock.getDelta(), 0.1);
      const elapsed = clock.getElapsedTime();

      worldCurveUniforms.uCurveX.value = Math.sin(elapsed * 0.32) * 0.00007;
      SubwayBGM.update(delta, activePowerups.jetpack > 0);

      // Expressive Capybara Eye Blinking & 2-Stroke Engine Suspension Bounce!
      const isBlinking = (elapsed % 3.8) > 3.65;
      capyEyelids.forEach(eye => {
        eye.scale.y = isBlinking ? 0.12 : 1.0;
      });
      autoVisualGroup.position.y = Math.abs(Math.sin(elapsed * 22)) * 0.08;

      if (cameraShake > 0) cameraShake = Math.max(0, cameraShake - delta * 2.2);
      const shakeX = (Math.random() - 0.5) * cameraShake * 1.2;
      const shakeY = (Math.random() - 0.5) * cameraShake * 1.2;

      // Update Ground Contact Shadow position & scale based on altitude (`jumpY`)
      vehicleContactShadow.position.x = playerRig.position.x;
      const shadowScale = Math.max(0.35, 1.0 - jumpY * 0.06);
      vehicleContactShadow.scale.set(shadowScale, shadowScale, 1);
      vehicleContactShadow.material.opacity = Math.max(0.2, 0.85 - jumpY * 0.05);

      if (gameState === 'HOME') {
        turntableRing.visible = true;
        diegeticTiltArc.visible = false;
        leftTireTrail.visible = false;
        rightTireTrail.visible = false;
        if (!isDraggingTurntable) turntableAngle += delta * 0.45;
        playerRig.position.set(0, 0, 0);
        bikeWheelieRig.rotation.y = turntableAngle;
        bikeWheelieRig.rotation.z = 0.22 + Math.sin(elapsed * 3.0) * 0.03;
        turntableRing.rotation.z = elapsed * 1.5;

        camera.position.lerp(new THREE.Vector3(0, 6.2, 27.5), delta * 5);
        camera.lookAt(0, 2.8, 0);
      }

      if (gameState === 'PLAYING') {
        const targetFov = activePowerups.jetpack > 0 ? 60 : 54;
        if (Math.abs(camera.fov - targetFov) > 0.1) {
          camera.fov = THREE.MathUtils.lerp(camera.fov, targetFov, delta * 5);
          camera.updateProjectionMatrix();
        }

        ['jetpack', 'magnet', 'sneakers', 'shield'].forEach(k => {
          if (activePowerups[k] > 0) activePowerups[k] = Math.max(0, activePowerups[k] - delta);
        });
        if (stumbleTimer > 0) stumbleTimer = Math.max(0, stumbleTimer - delta);
        if (slideTimer > 0) slideTimer = Math.max(0, slideTimer - delta);
        updatePowerupHUD();

        if (isHoldingWheelie) wheelieMeter += delta * 54;
        else wheelieMeter -= delta * 34;
        wheelieMeter = Math.max(25, wheelieMeter);

        if (wheelieMeter >= 100) {
          wheelieMeter = 65;
          triggerGameOver('Tilted past the balance point and rolled on the Metro viaduct!');
          return;
        }

        const inSweetSpot = wheelieMeter >= 55 && wheelieMeter <= 85;
        const mult = (inSweetSpot ? 2 : 1) * Math.max(1, currentLevelIdx + 1);
        multBadge.textContent = `${mult}X`;

        diegeticTiltArc.material.color.setHex(wheelieMeter > 85 ? 0xff007f : (inSweetSpot ? 0xffbe0b : 0x00f5d4));
        const arcScale = 0.65 + (wheelieMeter / 100) * 0.55;
        diegeticTiltArc.scale.set(arcScale, arcScale, 1);

        // Tire ribbon color changes to gold when in 2X sweet spot!
        leftTireTrail.material.color.setHex(inSweetSpot ? 0xffbe0b : 0x00f5d4);
        rightTireTrail.material.color.setHex(inSweetSpot ? 0xffbe0b : 0x00f5d4);

        dynamicIsland.style.outlineColor = inSweetSpot ? '#ffbe0b' : '#00f5d4';

        score += delta * 24 * mult;
        if (Math.floor(score) > displayedScore) {
          const diff = Math.floor(score) - displayedScore;
          displayedScore += Math.max(1, Math.ceil(diff * 0.25));
          scoreEl.textContent = String(displayedScore).padStart(5, '0');
        }
        fishEl.textContent = fishCount;

        for (let i = LEVELS.length - 1; i >= 0; i--) {
          if (score >= LEVELS[i].minScore && i > currentLevelIdx) {
            currentLevelIdx = i;
            const newLvl = LEVELS[currentLevelIdx];
            applyThemeVisuals(newLvl);
            hudLevelTxt.textContent = `LINE ${newLvl.id}`;
            SoundFX.autoHorn();
            showToast(`🚇 LINE ${newLvl.id}: ${newLvl.name}!`);
            break;
          }
        }

        const targetX = LANES[currentLane];
        const prevX = playerRig.position.x;
        playerRig.position.x = THREE.MathUtils.lerp(playerRig.position.x, targetX, delta * 13);
        const laneVelX = playerRig.position.x - prevX;

        if (activePowerups.jetpack > 0) {
          jumpY = THREE.MathUtils.lerp(jumpY, 9.5, delta * 8);
          isJumping = false;
        } else if (isJumping) {
          jumpY += jumpVel * delta;
          jumpVel -= 90 * delta;
          if (jumpY <= 0) {
            jumpY = 0;
            isJumping = false;
            cameraShake = 0.14;
            SoundFX.landImpact();
          }
        } else {
          jumpY = THREE.MathUtils.lerp(jumpY, 0, delta * 10);
        }

        playerRig.position.y = jumpY;

        // ALTITUDE-TRACKING CAMERA: Moves up with `jumpY` so Jetpack never hides the Auto!
        const camFollowX = playerRig.position.x * 0.45 + shakeX;
        const camFollowY = 8.8 + jumpY * 0.92 + shakeY;
        const lookTargetY = 2.4 + jumpY * 0.85;
        camera.position.lerp(new THREE.Vector3(camFollowX, camFollowY, 24.5), delta * 8);
        camera.lookAt(playerRig.position.x * 0.25, lookTargetY, -26);

        const targetScaleY = slideTimer > 0 ? 0.38 : 0.62;
        bikeWheelieRig.scale.y = THREE.MathUtils.lerp(bikeWheelieRig.scale.y, targetScaleY, delta * 16);

        bikeWheelieRig.rotation.z = (wheelieMeter / 100) * 0.40 - laneVelX * 0.45;
        bikeWheelieRig.rotation.y = 0.14 - laneVelX * 0.35;

        const currentLvlObj = LEVELS[currentLevelIdx];
        spawnTimer -= delta;
        if (spawnTimer <= 0) {
          spawnWave(currentLvlObj);
          spawnTimer = Math.max(0.45, 0.98 - currentLevelIdx * 0.07);
        }

        const speed = (78 + currentLevelIdx * 10) * (activePowerups.jetpack > 0 ? 1.38 : 1.0);
        updateContinuousAudioLoops(delta, speed, activePowerups, currentLvlObj);

        for (let i = activeEntities.length - 1; i >= 0; i--) {
          const ent = activeEntities[i];
          ent.mesh.position.z += speed * delta;
          if (ent.type !== 'obstacle') ent.mesh.rotation.y += delta * 2.5;

          if (ent.active && ent.type === 'fish' && activePowerups.magnet > 0 && ent.mesh.position.z > -45) {
            ent.mesh.position.x = THREE.MathUtils.lerp(ent.mesh.position.x, playerRig.position.x, delta * 9);
            ent.mesh.position.y = THREE.MathUtils.lerp(ent.mesh.position.y, playerRig.position.y + 1.5, delta * 9);
          }

          if (!ent.passedSound && ent.type === 'obstacle' && ent.mesh.position.z > 12) {
            ent.passedSound = true;
            SoundFX.trainFlyBy();
          }

          if (ent.active && ent.mesh.position.z > 5.8 && ent.mesh.position.z < 12.6) {
            const xDist = Math.abs(playerRig.position.x - ent.mesh.position.x);
            if (xDist < 2.3) {
              if (ent.type === 'fish') {
                ent.active = false;
                fishCount++;
                comboFish++;
                const pts = 50 * mult;
                score += pts;
                scoreEl.classList.add('bump');
                setTimeout(() => scoreEl.classList.remove('bump'), 110);
                SoundFX.chaiClink(comboFish);
                SoundFX.odoTick();
                spawnPickupBurst(ent.mesh.position, 0xffbe0b);
                showFloatingComboText(pts);
                scene.remove(ent.mesh);
              } else if (ent.type === 'powerup') {
                ent.active = false;
                spawnPickupBurst(ent.mesh.position, 0x00f5d4);
                scene.remove(ent.mesh);
                let chosen = ent.pType;
                if (chosen === 'mystery') {
                  SoundFX.mysteryBoxFanfare();
                  const pool = ['jetpack', 'magnet', 'sneakers', 'shield'];
                  chosen = pool[Math.floor(Math.random() * pool.length)];
                } else {
                  SoundFX.autoHorn();
                }
                activePowerups[chosen] = 9.0;
                showToast(`⚡ ${chosen.toUpperCase()} ACTIVATED!`);
              } else if (ent.type === 'obstacle' && activePowerups.jetpack <= 0) {
                const hitHigh = ent.highBarrier && slideTimer <= 0;
                const hitLow = !ent.highBarrier && jumpY < 2.8;
                if (hitHigh || hitLow) {
                  ent.active = false;
                  scene.remove(ent.mesh);
                  triggerGameOver(ent.highBarrier ? 'Clipped an overhead Metro Signal Gantry! (Swipe Down to Duck!)' : 'Hit a Grounded Mumbai Police Barricade! (Swipe Up to Bunny-Hop!)');
                  return;
                }
              }
            }
          }

          if (ent.mesh.position.z > 30) {
            scene.remove(ent.mesh);
            activeEntities.splice(i, 1);
          }
        }
      }

      if (gameState !== 'PAUSED') {
        rearWheel.children.forEach(w => w.rotation.x -= delta * 24);
        frontWheel.rotation.x -= delta * 24;
        metroTrackTex.offset.y -= delta * 3.2;

        thrusterFlames.forEach(tf => {
          const pulse = 0.85 + Math.sin(elapsed * 42 + tf.phase) * 0.2;
          tf.outer.scale.set(pulse, 1.0 + Math.sin(elapsed * 30) * 0.3, pulse);
          tf.core.scale.set(pulse, pulse, pulse);
        });

        trainSegments.forEach(seg => {
          seg.position.z += 68 * delta;
          if (seg.position.z > 10) seg.position.z -= 234;
        });

        cityStructures.forEach(c => {
          c.group.position.z += c.speed * delta;
          if (c.group.position.z > 40) c.group.position.z -= 300;
        });

        sparkParticles.forEach(sp => {
          if (sp.isScarf) {
            sp.mesh.position.y = sp.baseY + Math.sin(elapsed * 18 - sp.index * 0.65 + sp.tail) * (0.14 * sp.index);
            sp.mesh.position.z = sp.baseZ + Math.cos(elapsed * 14 - sp.index * 0.5) * (0.08 * sp.index);
          } else {
            const s = 0.5 + Math.sin(elapsed * 38 + sp.phase) * 0.45;
            sp.mesh.scale.set(s, s, s);
          }
        });

        for (let i = pickupBurstParticles.length - 1; i >= 0; i--) {
          const bp = pickupBurstParticles[i];
          bp.life -= delta;
          bp.mesh.position.addScaledVector(bp.vel, delta);
          bp.mesh.scale.setScalar(Math.max(0.01, bp.life * 2.2));
          if (bp.life <= 0) {
            scene.remove(bp.mesh);
            pickupBurstParticles.splice(i, 1);
          }
        }
      }

      if (composer && Settings.bloom) {
        composer.render();
      } else {
        renderer.render(scene, camera);
      }
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      if (composer) composer.setSize(window.innerWidth, window.innerHeight);
    });

    animate();
  </script>
</body>
</html>
